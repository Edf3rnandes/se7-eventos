<style>
:root{
  --bg:#f4f7fc;
  --card:#ffffff;
  --primary:#2554e0;
  --primary-dark:#1a3ea6;
  --accent:#ff7a45;
  --success:#2e9e5b;
  --success-bg:#e6f6ec;
  --text:#25333a;
  --muted:#83949c;
  --muted2:#7c8b93;
  --border:#e1e6ef;
  --radius:14px;
  --chip-blue:#2554e0;
  --chip-blue-dark:#1a3ea6;
  --chip-orange:#ff7a45;
  --team-bg:#eef1f5;
  --winner-bg:#e8f0fe;

  /* ---- Identidade visual do "chaveador" (chave dupla eliminatória N=8-30,
     ver ESPEC_Chaveador_Duplo.md) — escopada aos componentes da árvore/lista
     de uma chave, não ao resto do site. Azul = chave dos vencedores, vermelho
     = repescagem, dourado = fase final. ---- */
  --cv-surface:#FFFFFF; --cv-surface-2:#F5F7FA;
  --cv-line:#D3DAE3; --cv-line-soft:#E3E8EE;
  --cv-ink:#0F1822; --cv-ink-2:#3C4A5A; --cv-muted:#6D7C8C;
  --cv-wb:#12508F; --cv-wb-soft:#DCE8F6;
  --cv-lb:#A82F36; --cv-lb-soft:#F7E0E1;
  --cv-gold:#9A7212; --cv-gold-soft:#F5E9C9;
  --cv-shadow:0 1px 2px rgba(15,24,34,.06), 0 6px 18px -12px rgba(15,24,34,.28);
}
@media (prefers-color-scheme: dark){
  .chaveador-novo{
    --cv-surface:#141D27; --cv-surface-2:#1A242F;
    --cv-line:#2B3745; --cv-line-soft:#222D39;
    --cv-ink:#E7EDF4; --cv-ink-2:#B7C4D2; --cv-muted:#8496A8;
    --cv-wb:#5AA3E8; --cv-wb-soft:#12293F;
    --cv-lb:#E9737A; --cv-lb-soft:#3A1D20;
    --cv-gold:#E0B551; --cv-gold-soft:#3A2F14;
    --cv-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:40px;
}
a{color:inherit;}
button{font-family:inherit;}
.app-header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(120deg,var(--primary),var(--primary-dark));
  color:#fff;
  /* left reservado pro ícone ☰ do menu lateral, fixo por cima em todo canto
     superior esquerdo (Ed, 18/09: "quero o menu na lateral esquerda, lá em
     cima") — sem essa folga o ícone ficaria em cima do botão "‹ voltar". */
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px)) 64px;
  padding-top:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.app-header .row{display:flex; align-items:center; gap:10px;}
.header-edicao{font-weight:500; opacity:.85; font-size:.8em;}
.header-logo{width:64px; height:64px; object-fit:contain; flex:none;}
@media (min-width:640px){ .header-logo{width:84px; height:84px;} }
.regras-text{font-size:13.5px; line-height:1.5; color:var(--text);}
.regras-text.collapsed{max-height:76px; overflow:hidden; position:relative;}
.regras-text.collapsed::after{content:''; position:absolute; left:0; right:0; bottom:0; height:32px; background:linear-gradient(transparent, var(--card));}
.regras-toggle{font-size:12.5px; font-weight:700; color:var(--primary); cursor:pointer; margin-top:6px; text-align:center;}
.atleta-row{display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);}
.atleta-row:last-child{border-bottom:none;}
.atleta-row .rk{
  width:34px; height:34px; border-radius:9px; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;
}
.atleta-time-nome{font-weight:800; font-size:17px; color:var(--text);}
.atleta-nomes{font-size:15.5px; font-weight:700; color:var(--text);}
.ct-badge{display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; background:var(--border); color:var(--muted); vertical-align:middle;}
.app-header .back{
  background:rgba(255,255,255,.18); border:none; color:#fff; width:34px;height:34px;border-radius:10px;
  font-size:18px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer;
}
.app-header h1{font-size:17px; margin:0; font-weight:700; flex:1; line-height:1.25;}
.app-header .sub{font-size:12px; opacity:.85; margin-top:2px;}
.wrap{max-width:640px; margin:0 auto; padding:14px;}
/* Telas de categoria (Atletas/Confrontos/Árvore, cronograma): no celular é
   igual a .wrap, mas em notebook/desktop ganha bem mais largura — o Ed
   reportou que essas telas ficavam "presas" na largura de mobile mesmo numa
   tela grande, sobrando espaço vazio dos dois lados enquanto a árvore e o
   cronograma (que já rolam na horizontal por dentro) tinham menos espaço
   visível do que a tela realmente permitia. */
.wrap-chave{max-width:640px; margin:0 auto; padding:14px;}
@media (min-width:900px){ .wrap-chave{max-width:1200px; padding:20px 28px;} }
/* Telas de TV/monitor bem grandes (painel ao vivo na quadra, Ed 22/08/2026)
   — mais um degrau além do desktop normal, pra não deixar 1200px preso numa
   tela de 1900px+ com faixas vazias enormes dos dois lados. */
@media (min-width:1500px){ .wrap-chave{max-width:1600px;} }
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(20,30,30,.04);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--primary); color:#fff; border:none; border-radius:11px;
  padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer;
  width:100%;
}
.btn:active{transform:scale(.98);}
.btn.secondary{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
.btn.accent{background:var(--accent);}
.btn.ghost{background:transparent; color:var(--muted2); border:1px solid var(--border); font-weight:500;}
.btn.small{padding:8px 12px; font-size:13px; width:auto;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
label{font-size:13px; font-weight:600; color:var(--muted2); display:block; margin:10px 0 6px;}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=time]{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  font-size:16px; background:#fff; color:var(--text);
}
input[type=number]{text-align:center;}
.size-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0;}
.size-btn{
  padding:10px 0; text-align:center; border-radius:10px; border:1.5px solid var(--border);
  background:#fff; font-weight:700; font-size:14px; cursor:pointer; color:var(--text);
}
.size-btn.selected{background:var(--primary); color:#fff; border-color:var(--primary);}
.empty{
  text-align:center; padding:40px 16px; color:var(--muted2);
}
.empty .big{font-size:40px; margin-bottom:8px;}
.chave-item{
  display:flex; align-items:center; gap:12px; padding:14px; background:var(--card);
  border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; cursor:pointer;
}
.chave-item .info{flex:1; min-width:0;}
.chave-item .nome{font-weight:700; font-size:15px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chave-item .meta{font-size:12.5px; color:var(--muted2);}
.progress-pill{
  font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; background:var(--success-bg); color:var(--success); flex:none;
}
.progress-pill.zero{background:#f1eee2; color:var(--muted2);}
.del-btn{background:none; border:none; color:#c65b4a; font-size:18px; padding:4px 6px; cursor:pointer; flex:none;}
.field-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.field-row .rk{
  width:34px; height:34px; border-radius:9px; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;
}
.hint{font-size:12.5px; color:var(--muted2); margin-top:4px; line-height:1.4;}
.fmt-choice{display:flex; gap:8px; margin:10px 0;}
.fmt-choice label{margin:0; flex:1;}
.fmt-opt{
  border:1.5px solid var(--border); border-radius:11px; padding:12px 10px; text-align:center; cursor:pointer; font-size:13px; font-weight:600;
}
.fmt-opt.selected{border-color:var(--primary); background:#eaf0fe; color:var(--primary-dark);}
.progress-bar-wrap{background:rgba(255,255,255,.25); border-radius:20px; height:6px; margin-top:10px; overflow:hidden;}
.progress-bar-fill{background:#fff; height:100%; border-radius:20px; transition:width .3s;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; -webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:none; padding:8px 14px; border-radius:20px; background:#fff; border:1.5px solid var(--border);
  font-size:13px; font-weight:600; color:var(--muted2); cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.podium{
  background:linear-gradient(135deg,#fff6e8,#fdeee0); border:1px solid #f3ddb8; border-radius:var(--radius);
  padding:14px; margin-bottom:14px;
}
.podium h3{margin:0 0 10px; font-size:14px; color:#8a5a12; display:flex; align-items:center; gap:6px;}
.podium-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px;}
.podium-row .pos{
  width:26px; height:26px; border-radius:50%; background:#f2c14e; color:#5a3d00; font-weight:800; font-size:12px;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.podium-row .pos.p1{background:#f2c14e;}
.podium-row .pos.p2{background:#d6d9dd;}
.podium-row .pos.p3{background:#e2a86f;}
.podium-row .pos.p5{background:#dbe6fb; color:var(--primary-dark);}
.podium-row .name{font-weight:600;}
.ranking-link{
  display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; font-weight:700;
  color:#8a5a12; background:#fff6e8; border:1.3px solid #f0d9a8; border-radius:20px; padding:7px 10px;
  margin-bottom:12px; cursor:pointer;
}
.phase-section{margin-bottom:16px;}
.phase-title{
  display:flex; align-items:center; justify-content:space-between; padding:6px 2px 10px;
  font-size:13px; font-weight:800; color:var(--primary-dark); text-transform:uppercase; letter-spacing:.03em;
}
.phase-title .count{font-size:11.5px; font-weight:700; color:var(--muted2); text-transform:none; letter-spacing:0;}
.match-card{
  background:var(--card); border:1.5px solid var(--border); border-radius:11px; padding:8px 10px; margin-bottom:7px;
  box-shadow:0 1px 3px rgba(20,30,30,.05);
}
.match-card.done{border-color:var(--border);}
.match-card.pending{opacity:.55;}
.match-card.live-now{border-color:var(--chip-blue); background:#eef3ff; box-shadow:0 1px 6px rgba(37,84,224,.15);}
/* Destaque (pedido do Ed, 18/09): card da Final/3º lugar na lista de jogos —
   mesmo tratamento dourado do selo da árvore nova (ver .cv-node.destaque). */
.match-card.destaque{border-color:#9A7212; border-width:2px; box-shadow:0 1px 8px rgba(154,114,18,.22);}
.match-top{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
.match-num{font-size:10.5px; font-weight:800; color:var(--muted2); border:1.3px solid var(--border); border-radius:20px; padding:2px 8px; flex:none;}
.chave-chip{font-size:10px; font-weight:800; padding:3px 9px; border-radius:20px; color:#fff; flex:none;}
.chave-chip.principal{background:var(--chip-blue);}
.chave-chip.repescagem{background:var(--chip-orange);}
.chave-chip.neutral{background:#eef2f2; color:var(--muted2);}
.chave-chip.destaque{background:#9A7212;}
.match-round{font-size:11px; color:var(--muted2); flex:none;}
.match-top .spacer{flex:1;}
.match-badge{font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; background:#eef2f2; color:var(--muted2); flex:none; white-space:nowrap;}
.match-badge.wait{background:#f3efe2; color:#a68e4f;}
.match-badge.ready{background:var(--chip-blue); color:#fff;}
.match-badge.done{background:var(--success-bg); color:var(--success);}
.match-badge.rejected{background:#fbe4e0; color:#c65b4a;}
/* Os dois times de um confronto lado a lado, não mais empilhados (Ed,
   21/08/2026: "altere na lista para os times ficarem um do lado do outro
   para diminuir a lista e melhorar a visão do expectador") — cada dupla é
   uma célula (.team-cell) dentro de .match-teams-row, com um "×" no meio. */
.match-teams-row{display:flex; align-items:stretch; gap:6px; margin-bottom:4px;}
.team-cell{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:7px 6px; border-radius:9px; background:var(--team-bg); text-align:center;
}
.match-teams-row .vs-sep{flex:none; align-self:center; font-size:11px; font-weight:800; color:var(--muted2);}
.team-cell .tname{font-size:13px; font-weight:600; min-width:0; line-height:1.25; word-break:break-word;}
.team-cell.placeholder .tname{color:var(--muted2); font-weight:500; font-style:italic;}
.team-cell.winner{background:var(--winner-bg);}
.team-cell.winner .tname{color:var(--primary-dark); font-weight:800;}
/* Dupla já classificada pra essa fase mas o jogo ainda não formou (esperando
   o adversário) — negrito pra achar rápido quem já avançou (Ed, 21/08/2026). */
.team-cell.waiting-opponent .tname{font-weight:800;}
.team-cell .score-pill{
  flex:none; min-width:26px; text-align:center; font-size:12.5px; font-weight:800; padding:3px 10px; border-radius:20px;
  background:#fff; border:1.3px solid var(--border); color:var(--text);
}
.team-cell.winner .score-pill{background:var(--chip-blue); border-color:var(--chip-blue); color:#fff;}
.vs{font-size:11px; color:var(--muted2); text-align:center; padding:1px 0;}
.match-actions{display:flex; gap:8px; margin-top:10px;}
.match-actions .btn{flex:1;}
.set-picker{display:flex; gap:6px; margin-top:8px;}
.set-picker .set-opt{
  flex:1; text-align:center; padding:8px 4px; border:1.5px solid var(--border); border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--muted2);
}
.set-picker .set-opt.selected{border-color:var(--primary); background:#eaf0fe; color:var(--primary-dark);}
.wo-link{font-size:12px; color:var(--muted2); text-decoration:underline; cursor:pointer; text-align:center; margin-top:8px;}
.footer-actions{display:flex; gap:8px; margin-top:18px;}
.footer-actions .btn{flex:1;}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#23333a; color:#fff;
  padding:10px 18px; border-radius:30px; font-size:13.5px; z-index:99; box-shadow:0 4px 14px rgba(0,0,0,.2);
  opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s;
}
.toast.show{opacity:1; bottom:34px;}
/* Persistent (does NOT auto-hide like .toast) banner shown while a placar
   save is stuck waiting to reach the server — e.g. a transação failed on a
   flaky connection and fell back to a plain queued write. Honest status,
   not a promise that resolves itself invisibly. */
.sync-banner{
  position:fixed; left:0; right:0; bottom:0; z-index:60; background:#fff6e8; color:#8a5a12;
  text-align:center; font-size:12.5px; font-weight:700; padding:9px 12px;
  border-top:1.5px solid #f0d9a8; box-shadow:0 -2px 10px rgba(0,0,0,.06);
  transform:translateY(100%); transition:transform .2s;
}
.sync-banner.show{transform:translateY(0);}

/* Menu lateral que se esconde (Ed, 18/09) — ícone ☰ fixo, abre uma gaveta
   deslizante da esquerda com fundo escurecido atrás, igual em celular e
   computador (pedido explícito do Ed). z-index acima do sync-banner (60) e
   do toast (99) pra nunca ficar preso atrás deles.
   Reposicionado (Ed, 18/09, 2ª rodada: "quero o menu na lateral esquerda,
   lá em cima, não embaixo como está") pro canto superior esquerdo, dentro
   da folga reservada em `.app-header` acima — fica "encaixado" no cabeçalho
   de toda tela (sticky, acompanha o scroll junto) em vez de flutuar solto
   no canto inferior direito. */
.side-menu-fab{
  position:fixed; left:14px; top:calc(14px + env(safe-area-inset-top,0px)); z-index:70;
  width:38px; height:38px; border-radius:10px;
  border:none; background:rgba(255,255,255,.18); color:#fff; font-size:19px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.side-menu-backdrop{
  position:fixed; inset:0; background:rgba(20,30,30,.45); z-index:110; opacity:0; pointer-events:none;
  transition:opacity .2s;
}
.side-menu-backdrop.open{opacity:1; pointer-events:auto;}
.side-menu{
  position:fixed; top:0; left:0; bottom:0; width:min(280px, 82vw); background:var(--card); z-index:120;
  box-shadow:2px 0 18px rgba(20,30,30,.22); transform:translateX(-100%); transition:transform .22s ease;
  display:flex; flex-direction:column; overflow-y:auto;
}
.side-menu.open{transform:translateX(0);}
.side-menu-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; flex:none;
}
.side-menu-title{font-weight:800; font-size:15px;}
.side-menu-close{
  background:rgba(255,255,255,.2); border:none; color:#fff; width:30px; height:30px; border-radius:8px;
  font-size:15px; cursor:pointer; flex:none;
}
.side-menu-nav{padding:10px;}
.side-menu-item{padding:12px 12px; border-radius:10px; font-weight:700; font-size:14px; color:var(--text); cursor:pointer;}
.side-menu-item:hover{background:var(--team-bg);}
.side-menu-item.danger{color:#b3261e;}
.side-menu-section-label{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2); margin:14px 6px 4px;}
.side-menu-empty{padding:8px 12px; font-size:12.5px; color:var(--muted2);}
#sideMenuNav input[type=text]{margin-bottom:2px;}
.section-note{font-size:12.5px; color:var(--muted2); background:#f5f1e4; border-radius:10px; padding:8px 10px; margin-bottom:10px;}
.status-badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; margin-left:6px; vertical-align:middle; white-space:nowrap;}
.status-badge.status-pending{background:#f1eee2; color:var(--muted2);}
.status-badge.status-live{background:#fff6e8; color:#8a5a12;}
.status-badge.status-done{background:var(--success-bg); color:var(--success);}
.cat-actions{display:flex; align-items:center; gap:4px; flex:none;}
.cat-actions select{border:1px solid var(--border); border-radius:8px; font-size:11.5px; color:var(--muted2); background:#fff; padding:4px 2px; max-width:78px;}
.cat-switcher{margin-top:8px;}
.cat-switcher select{width:100%; padding:9px 10px; border-radius:10px; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:13px; font-weight:600;}
.cat-switcher select option{color:#23333a;}
.pub-badge{display:inline-block; font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.2); color:#fff; margin-top:4px;}
.pub-refresh{cursor:pointer; margin-left:6px;}
.pub-refresh:active{background:rgba(255,255,255,.35);}
.view-toggle{display:flex; gap:6px; margin-bottom:10px;}
.view-toggle .vt-opt{
  flex:1; text-align:center; padding:8px 3px; border-radius:11px; border:1.5px solid var(--border);
  background:#fff; font-size:12px; font-weight:700; color:var(--muted2); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.view-toggle .vt-opt.selected{border-color:var(--primary); background:#eaf0fe; color:var(--primary-dark);}
.tree-wrap{border:1px solid var(--border); border-radius:13px; overflow:hidden; background:#fbfbf9; margin-bottom:14px;}
/* Vencedores/Repescagem — static section pills over the canvas, both sides
   always render together now, so these are labels, not tabs. */
.tree-side-labels{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap;
}
.tsl{font-size:11.5px; font-weight:800; padding:5px 12px; border-radius:20px; color:#fff;}
.tsl.principal{background:var(--chip-blue);}
.tsl.repescagem{background:var(--chip-orange);}
.tree-zoom-bar{
  display:flex; align-items:center; gap:8px; padding:8px 10px; background:#fff; border-bottom:1px solid var(--border);
  font-size:11px; color:var(--muted2);
}
.tree-zoom-bar button{
  width:30px; height:30px; border-radius:9px; border:1.3px solid var(--border); background:#fff;
  font-size:16px; font-weight:800; color:var(--primary-dark); cursor:pointer; flex:none; padding:0;
}
.tree-zoom-bar span#treeZoomPct{font-weight:800; color:var(--text); flex:none;}
.tree-zoom-bar .hint{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tree-scroll{overflow:auto; max-height:min(70vh,560px); cursor:grab; touch-action:pan-x pan-y;}
.tree-canvas-wrap{position:relative;}
.tree-canvas{position:relative; transform-origin:top left;}
.tree-svg{position:absolute; top:0; left:0; pointer-events:none;}
.tree-line{fill:none; stroke:var(--border); stroke-width:2;}
.tree-midline{
  position:absolute; left:0; height:1px; border-top:1px dashed var(--border); pointer-events:none;
}
.tree-match{
  position:absolute; background:#fff; border:1.5px solid var(--border); border-radius:9px;
  padding:6px 8px; font-size:12px; cursor:pointer; box-shadow:0 1px 2px rgba(20,30,30,.05);
  box-sizing:border-box; z-index:1;
}
.tree-match.final{
  border:2px solid var(--primary); box-shadow:0 3px 12px rgba(37,84,224,.22); z-index:2;
}
.tree-match.terceiro{
  border:2px solid var(--chip-orange); box-shadow:0 3px 12px rgba(255,122,69,.22); z-index:2;
}
.tree-final-ribbon{
  background:var(--primary); color:#fff; font-size:9.5px; font-weight:800; text-align:center;
  border-radius:6px; padding:3px 4px; margin:-3px -5px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tree-match.terceiro .tree-final-ribbon{ background:var(--chip-orange); }
.tree-match.live{ border-color:var(--chip-blue); background:#eef3ff; box-shadow:0 2px 10px rgba(37,84,224,.25); }
.tree-live-badge{
  display:inline-block; font-size:9px; font-weight:800; color:var(--chip-blue); margin-right:5px;
  animation:treeLivePulse 1.4s ease-in-out infinite;
}
@keyframes treeLivePulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.tree-match-tag{
  font-size:9.5px; color:var(--muted2); margin-bottom:4px;
  display:flex; align-items:center; justify-content:space-between; gap:4px;
}
.tree-match-tag-text{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tree-match .tree-num{font-weight:800; color:var(--muted2);}
.tree-quadra-badge{
  flex:none; font-size:9px; font-weight:800; color:var(--muted2); background:#eef2f2;
  border-radius:8px; padding:1px 5px; white-space:nowrap;
}
.tree-match.live .tree-quadra-badge{ background:#fff; color:var(--chip-blue); }
.tree-team-block{border-top:1px solid var(--border); margin-top:3px;}
.tree-team-row{
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:7px 1px; font-weight:600; font-size:12.5px;
}
.tree-team-row:first-child{border-bottom:1px solid var(--border);}
.tree-team-row.win{color:var(--primary-dark); font-weight:800;}
.tree-tname{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.tree-score{font-size:11px; font-weight:800; color:var(--muted2); flex:none;}
.tree-team-row.win .tree-score{color:var(--primary-dark);}
/* Semifinal — the one wide, two-cell box (spec §7.1). Left cell = invicto
   (arrives from the chave dos vencedores, on the left); right cell =
   repescado (arrives from the repescagem, on the right). No connector ever
   leaves this box toward Final/3º-4º — the box text already says why. */
.tree-semi{
  position:absolute; background:#fff; border:2px solid var(--success,#2f8f5b); border-radius:11px;
  box-sizing:border-box; cursor:pointer; box-shadow:0 2px 8px rgba(20,30,30,.08); z-index:2;
  overflow:hidden;
}
.tree-semi.live{ border-color:var(--chip-blue); box-shadow:0 2px 10px rgba(37,84,224,.25); }
.tree-semi-title{
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-weight:800; font-size:11px; letter-spacing:.3px; color:var(--text);
  padding:7px 4px 5px; background:#f3f9f5;
}
.tree-semi-title-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tree-semi-cells{display:flex; height:calc(100% - 30px);}
.tree-semi-cell{
  flex:1; min-width:0; padding:7px 9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center;
}
.tree-semi-cell.inv{border-right:1px dashed var(--border);}
.tree-semi-cell .status{font-size:8.8px; font-weight:800; letter-spacing:.2px;}
.tree-semi-cell.inv .status{color:var(--chip-blue);}
.tree-semi-cell.rep .status{color:var(--chip-orange);}
.tree-semi-cell .origin{
  font-size:14px; font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
}
.tree-semi-cell.win .origin{color:var(--primary-dark);}
.tree-semi-score{font-size:10.5px; font-weight:800; color:var(--muted2);}
.tree-semi-cell.win .tree-semi-score{color:var(--primary-dark);}

/* Section titles + per-column round/bloco headers, repeated above each half
   (CIMA then BAIXO), mirroring Ed's own printed reference sheet. */
.tree-section-titles{
  position:absolute; left:0; display:flex; justify-content:space-between; align-items:center;
  gap:8px; box-sizing:border-box; padding:0 8px;
}
.tst{font-size:11px; font-weight:800; white-space:nowrap;}
.tst.chave{color:var(--chip-blue);}
.tst.rep{color:var(--chip-orange);}
.tree-col-heads{position:absolute; left:0; height:40px;}
.tree-col-head{
  position:absolute; top:0; box-sizing:border-box; padding:0 6px; text-align:center;
}
.tree-col-head-r{font-size:9.5px; font-weight:800; color:var(--muted2);}
.tree-col-head-b{font-size:8.8px; color:var(--muted2); margin-top:1px;}
.tree-col-head.center .tree-col-head-r{color:var(--success,#2f8f5b);}
.tree-col-head.center .tree-col-head-b{color:var(--success,#2f8f5b);}

/* quadra + status do jogo */
.match-badge.live{background:var(--chip-orange); color:#fff;}
.match-meta-row{display:flex; align-items:center; gap:6px; margin-bottom:9px; flex-wrap:wrap;}
.match-court{
  font-size:10.5px; font-weight:700; color:var(--muted2); background:#eef2f2; border-radius:8px;
  padding:4px 8px; display:flex; align-items:center; gap:4px; flex:none;
}
.match-court input{
  border:none; background:transparent; font-size:10.5px; font-weight:700; color:var(--text);
  width:30px; padding:0; text-align:left;
}
/* Firefox e Chrome/Safari escondem as setinhas do number input — o campo é
   pequeno de propósito (só o número, a palavra "Quadra" já vem fixa antes). */
.match-court input[type=number]{ -moz-appearance:textfield; }
.match-court input[type=number]::-webkit-outer-spin-button,
.match-court input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
/* Select de quadra por nome (Ed, 21/08/2026) — mesmo visual discreto do
   input numérico que ele substitui quando o evento tem quadras cadastradas. */
.match-court select{
  border:none; background:transparent; font-size:10.5px; font-weight:700; color:var(--text);
  padding:0; max-width:120px;
}
.andamento-btn{
  flex:none; border:1.5px solid var(--chip-orange); color:var(--chip-orange); background:#fff;
  border-radius:20px; padding:4px 10px; font-size:11px; font-weight:800; cursor:pointer;
}
.andamento-btn.on{background:var(--chip-orange); color:#fff;}

/* grade de cronograma (horário x quadra, estilo planner) */
.grade-table{ border-collapse:collapse; font-size:10.5px; }
.grade-table th, .grade-table td{ border:1px solid var(--border); padding:3px 6px; text-align:center; }
.grade-table th{ background:#eef2f2; font-weight:800; color:var(--muted2); position:sticky; top:0; z-index:1; white-space:nowrap; }
.grade-th-hora{ font-weight:800; background:#eef2f2; color:var(--muted2); position:sticky; left:0; z-index:2; white-space:nowrap; font-size:10px; }
.planner-table th{ width:132px; min-width:132px; }
.planner-cell{
  width:132px; min-width:132px; max-width:132px; height:34px; vertical-align:middle;
  padding:3px 7px !important; box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
}
.planner-cell .planner-cat{
  font-size:10.5px; font-weight:800; line-height:1.25; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap;
}
.planner-cell .planner-fase{
  font-size:9.5px; font-weight:700; opacity:.9; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; margin-top:2px; display:block;
}

/* foto do evento */
.evento-photo{width:100%; height:130px; object-fit:cover; border-radius:12px; margin-bottom:10px; display:block; background:#eef2f2;}
.evento-hero{width:100%; height:auto; max-height:320px; object-fit:contain; display:block; background:#eef2f2;}
.evento-hero-wrap{background:#eef2f2;}
.evento-hero-wrap.noimg{padding-top:2px;}
.hero-pills{display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px; max-width:1100px; margin:0 auto;}
.hero-pill{font-size:12px; font-weight:800; padding:5px 11px; border-radius:9px; background:var(--primary); color:#fff;}
.hero-pill.open{background:var(--success-bg); color:var(--success);}
.cat-day-header{
  font-size:11.5px; font-weight:800; letter-spacing:.06em; color:var(--muted2); text-transform:uppercase;
  margin:14px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--border);
}
.cat-day-header:first-child{margin-top:0;}
.chave-item .thumb{width:52px; height:52px; border-radius:10px; object-fit:cover; flex:none; background:#eef2f2;}
.foto-upload-preview{width:100%; height:110px; object-fit:cover; border-radius:10px; margin-top:8px; display:block;}
.foto-upload-btn{margin-top:8px;}
.logo-upload-preview{width:76px; height:76px; object-fit:contain; border-radius:10px; margin-top:8px; display:block; background:#eef2f2; padding:6px;}
.patrocinador-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.patrocinador-thumb{position:relative; width:72px; height:72px; border-radius:10px; background:#eef2f2; padding:5px; box-sizing:border-box;}
.patrocinador-thumb img{width:100%; height:100%; object-fit:contain; display:block;}
.patrocinador-thumb .rm{
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#a13a3a; color:#fff;
  border:none; font-size:12px; font-weight:800; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;
}
/* Lista de nomes de quadras cadastrados no evento (Ed, 21/08/2026) — editor em
   duas colunas (esquerda/direita), espelhando o mapa, com ▲/▼ pra reordenar
   dentro do lado ("mover a quadra para o lugar e ordem certa"). */
.quadra-edit-cols{display:flex; gap:12px; margin-top:10px;}
.quadra-edit-col{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
.quadra-edit-col-label{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted2);}
.quadra-edit-row{
  display:flex; align-items:center; justify-content:space-between; gap:6px; background:#eef3ff;
  border:1px solid var(--border); border-radius:10px; padding:6px 8px 6px 12px;
}
.quadra-edit-nome{font-size:12.5px; font-weight:700; color:var(--primary-dark); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.quadra-edit-actions{display:flex; align-items:center; gap:4px; flex:none;}
.quadra-edit-actions .qmove{
  width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid var(--border); color:var(--text);
  font-size:10px; font-weight:800; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;
}
.quadra-edit-actions .qmove:hover:not(:disabled){background:var(--chip-blue); color:#fff; border-color:var(--chip-blue);}
.quadra-edit-actions .qmove:disabled{opacity:.3; cursor:default;}
.quadra-edit-actions .lado-tag{
  font-size:9px; font-weight:800; color:var(--muted2); background:#fff; border-radius:6px; padding:1px 5px; flex:none;
  cursor:pointer; border:1px solid var(--border);
}
.quadra-edit-actions .lado-tag:hover{background:var(--chip-blue); color:#fff; border-color:var(--chip-blue);}
.quadra-edit-actions .rm{
  width:18px; height:18px; border-radius:50%; background:#a13a3a; color:#fff; border:none;
  font-size:11px; font-weight:800; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; padding:0;
}
.quadra-nome-add{display:flex; gap:8px; align-items:center;}
.quadra-nome-add input{flex:1;}
/* Classificação de grupo (3/4/5 duplas) — critérios saldo de vitórias →
   average → confronto direto (Ed, 21/08/2026), com ▲/▼ pro organizador
   ajustar manualmente quando o critério automático não resolve. */
.standings-row{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13.5px; padding:4px 0; border-bottom:1px solid var(--border);}
.standings-stats{color:var(--muted2); font-size:12px; white-space:nowrap;}
.standings-actions{display:flex; gap:4px; flex:none;}
.standings-actions .qmove{
  width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid var(--border); color:var(--text);
  font-size:10px; font-weight:800; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;
}
.standings-actions .qmove:hover:not(:disabled){background:var(--chip-blue); color:#fff; border-color:var(--chip-blue);}
.standings-actions .qmove:disabled{opacity:.3; cursor:default;}
.standings-manual-tag{font-size:10px; font-weight:700; color:#8a5a12; background:#fdeee0; padding:2px 6px; border-radius:6px;}
.standings-reset-link{font-size:10.5px; font-weight:700; color:var(--chip-blue); cursor:pointer; text-decoration:underline;}
/* Mapa visual das quadras (Ed, 21/08/2026) — duas colunas (esquerda/direita
   da arena, igual a foto que ele mandou), cada quadra mostrando o nome e a
   categoria que está jogando (ou a próxima) ali naquele momento. */
.quadra-mapa-card{margin-bottom:14px;}
.quadra-mapa{display:flex; gap:14px; margin-top:10px;}
.quadra-mapa-lado{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0;}
.quadra-mapa-lado-label{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted2); margin-bottom:2px;}
.quadra-mapa-box{
  border:1.5px solid var(--border); border-radius:10px; padding:9px 11px; background:#fff;
}
.quadra-mapa-box.ocupada{border-color:var(--chip-blue); background:#eef3ff;}
.quadra-mapa-nome{font-weight:800; font-size:12.5px; color:var(--text);}
.quadra-mapa-cat{font-size:12px; color:var(--primary-dark); font-weight:700; margin-top:3px;}
.quadra-mapa-cat.livre{color:var(--muted2); font-weight:500; font-style:italic;}
.quadra-mapa-tempo{font-size:10px; color:var(--muted2); margin-top:1px;}
.quadra-mapa-select{
  width:100%; margin-top:7px; font-size:11px; font-weight:600; color:var(--text);
  border:1px solid var(--border); border-radius:7px; padding:4px 6px; background:#fff;
}
/* Visão Geral ao vivo (Ed, 22/08/2026) — mesma disposição em duas colunas do
   Mapa das Quadras, mas cada caixa agora carrega o confronto real (nomes +
   placar) em vez de só o nome da categoria. */
/* Grade da Visão Geral (Ed, 22/08/2026: "tv/computador ficam iguais ao
   celular, quero mais espaçado e distribuído, com os próximos jogos, talvez
   reduzindo os quadradinhos") — cada lado vira um grid que se auto-preenche
   com quantas colunas couberem (uma no celular, várias numa tela de
   TV/desktop), em vez do antigo layout de coluna única sempre — e as caixas
   ficam um pouco mais compactas pra caber mais informação (inclusive os
   próximos confrontos) sem virar uma parede de texto. .wrap-chave (ver
   abaixo) já cuida de dar mais largura total à página em telas grandes;
   isso aqui cuida de distribuir essa largura extra em colunas de verdade.
*/
.vg-wrap{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
.vg-col{flex:1 1 320px; min-width:0;}
.vg-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:6px;}
@media (min-width:560px){ .vg-grid{grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));} }
.vg-box{
  border:1.5px solid var(--border); border-radius:11px; padding:9px 10px; background:#fff;
}
.vg-box.live{border-color:var(--chip-orange); background:#fff8f0;}
.vg-court{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.vg-cat{font-size:11px; color:var(--primary-dark); font-weight:700;}
.vg-game{margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);}
.vg-game .andamento-btn{width:100%; margin-top:6px;}
.vg-box .match-teams-row{margin-bottom:0;}
.vg-box .team-cell{padding:5px 5px;}
.vg-box .team-cell .tname{font-size:12px;}
.vg-toggle-btn{
  text-align:center; font-size:12px; font-weight:700; color:var(--chip-blue); text-decoration:underline;
  cursor:pointer; margin-top:6px; padding:3px 0;
}
.vg-toggle-btn.primary{
  background:var(--chip-blue); color:#fff; text-decoration:none; border-radius:8px; padding:7px 0; font-weight:800;
}
/* Pódio geral (Ed, 22/08/2026) — lista simples por categoria, pensada pra
   virar imagem exportável (html2canvas) e ser mandada direto no WhatsApp. */
.podio-list{display:flex; flex-direction:column; gap:10px;}
.podio-card{border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; background:#fff;}
.podio-cat-nome{font-weight:800; font-size:14px; margin-bottom:6px;}
.podio-row{display:flex; align-items:center; gap:8px; padding:4px 0;}
.podio-medal{font-size:18px; flex:none; width:24px; text-align:center;}
.podio-pos{font-size:11px; font-weight:800; color:var(--muted2); flex:none; width:28px;}
.podio-names{font-size:13px; font-weight:700; color:var(--text);}
.ra-cat-list{display:flex; flex-direction:column; gap:16px;}
.ra-cat-card{border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; background:#fafcfc;}
.ra-cat-nome{font-weight:800; font-size:14px; margin-bottom:8px; color:var(--primary-dark);}
.ra-instancia{margin-bottom:12px;}
.ra-instancia:last-child{margin-bottom:0;}
.ra-instancia-evento{font-size:11px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--muted2); margin-bottom:6px;}
.ra-list{display:flex; flex-direction:column; gap:6px;}
.ra-row-static{display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:10px; padding:8px 12px; background:#fff;}
.ra-pos{font-weight:800; font-size:13px; color:var(--muted2); width:44px; flex:none;}
.ra-name{flex:1; min-width:0; font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ra-pontos{font-weight:800; font-size:13.5px; color:var(--primary-dark); flex:none;}

/* Ranking público estilo campeonato (cards → categorias → medalhas) */
.camp-list{display:flex; flex-direction:column; gap:10px;}
.camp-card{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px; cursor:pointer; box-shadow:0 1px 3px rgba(20,30,30,.05);
  transition:box-shadow .15s, transform .15s;
}
.camp-card:hover{box-shadow:0 6px 18px rgba(20,30,30,.12); transform:translateY(-1px);}
.camp-card-badge{font-size:26px; flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:var(--team-bg); border-radius:12px;}
.camp-card-body{flex:1; min-width:0;}
.camp-card-nome{font-weight:800; font-size:15px; color:var(--text); line-height:1.3;}
.camp-card-meta{font-size:12.5px; color:var(--muted2); font-weight:600; margin-top:2px;}
.camp-card-chev{font-size:22px; color:var(--muted); flex:none;}

.rk-cat-list{display:flex; flex-direction:column; gap:8px;}
.rk-cat-row{
  display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:12px 14px; cursor:pointer; box-shadow:0 1px 3px rgba(20,30,30,.04);
  transition:box-shadow .15s, transform .15s;
}
.rk-cat-row:hover{box-shadow:0 4px 14px rgba(20,30,30,.1); transform:translateY(-1px);}
.rk-cat-nome{flex:1; min-width:0; font-weight:700; font-size:14px; color:var(--text);}
.rk-cat-meta{font-size:12px; color:var(--muted2); font-weight:600; flex:none;}
.rk-cat-chev{font-size:20px; color:var(--muted); flex:none;}

.rk-instancia{margin-bottom:14px;}
.rk-instancia:last-child{margin-bottom:0;}
.rk-instancia-evento{font-size:11px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--muted2); margin-bottom:6px;}

.rk-leaderboard{display:flex; flex-direction:column; gap:6px;}
.rk-lb-row{
  display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:10px;
  padding:9px 12px; background:#fff;
}
.rk-lb-row.top3{background:var(--winner-bg); border-color:var(--chip-blue);}
.rk-lb-pos{font-weight:800; font-size:15px; width:28px; flex:none; text-align:center;}
.rk-lb-name{flex:1; min-width:0; font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rk-lb-etapas{font-size:11px; color:var(--muted2); font-weight:600; flex:none;}
.rk-lb-pontos{font-weight:800; font-size:13.5px; color:var(--primary-dark); flex:none;}

.sponsor-footer{margin-top:22px; padding-top:16px; border-top:1px solid var(--border); text-align:center;}
.sponsor-footer-label{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2); margin-bottom:10px;}
.sponsor-footer-logos{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px;}
.sponsor-footer-logos img{height:40px; max-width:120px; object-fit:contain;}
/* Logo de fundo do menu principal — marca d'água fixa, atrás de tudo,
   discreta (opacidade baixa) pra não brigar com o conteúdo por cima. */
.menu-bg-layer{
  position:fixed; inset:0; z-index:-1; background-repeat:no-repeat; background-position:center 18%;
  background-size:min(70vw,420px); opacity:.07; pointer-events:none;
}
textarea{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  font-size:15px; background:#fff; color:var(--text); font-family:inherit; min-height:80px; resize:vertical;
}

/* home pública (grade de cartões, estilo arevo/tecbeach) */
.wrap-wide{max-width:1100px; margin:0 auto; padding:14px;}
.evt-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; margin-top:14px;}
.evt-card{
  background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
  cursor:pointer; box-shadow:0 1px 3px rgba(20,30,30,.05); transition:box-shadow .15s, transform .15s;
}
.evt-card:hover{box-shadow:0 6px 18px rgba(20,30,30,.12); transform:translateY(-1px);}
.evt-card .banner{position:relative; height:150px; background:#eef2f2;}
.evt-card .banner img{width:100%; height:100%; object-fit:cover; display:block;}
.evt-card .banner-ph{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:rgba(255,255,255,.85);
}
.evt-card .banner .status-badge{position:absolute; top:10px; right:10px; margin:0; background:rgba(255,255,255,.95);}
.evt-card .banner .status-badge.status-pending{color:var(--muted2);}
.evt-card .banner .status-badge.status-live{color:#8a5a12;}
.evt-card .banner .status-badge.status-done{color:var(--success);}
.evt-card .banner .status-badge.price-pill{top:auto; bottom:10px; right:auto; left:10px; background:var(--primary); color:#fff;}
.evt-card .body{padding:14px;}
.evt-card .title{font-weight:800; font-size:15.5px; color:var(--text); line-height:1.3; margin-bottom:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.evt-card .edicao{font-weight:500; color:var(--muted2);}
.evt-card .meta-row{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted2); font-weight:600; margin-bottom:10px;}
.evt-card .meta-row span{display:flex; align-items:center; gap:6px;}
.evt-tags{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;}
.evt-tag{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:8px; background:var(--team-bg); color:var(--text);}
.evt-tag.muted{color:var(--muted2);}
.evt-card .cta{
  display:flex; align-items:center; justify-content:center; gap:6px; background:var(--primary); color:#fff;
  border-radius:10px; padding:9px 0; font-size:13px; font-weight:700;
}

/* página pública do evento (estilo arevo) */
.evt-title-row{display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap;}
.evt-title-row h1{font-size:21px; margin:0; font-weight:800; color:var(--text); line-height:1.25;}
.evt-meta-row{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted2); font-weight:600; margin-top:6px;}
.card-title{font-weight:800; font-size:14px; color:var(--primary-dark); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.info-row{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;}
.info-row:last-of-type{margin-bottom:0;}
.info-row .ico{font-size:16px; flex:none; line-height:1.4;}
.info-row .ir-label{font-size:11.5px; color:var(--muted2); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
.info-row .ir-value{font-size:14px; font-weight:600; color:var(--text); margin-top:1px;}
.section-title{
  font-size:15px; font-weight:800; color:var(--primary-dark); margin:18px 0 10px;
  display:flex; align-items:center; gap:6px;
}
.cat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px;}
.cat-grid-item{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px;
  cursor:pointer; box-shadow:0 1px 3px rgba(20,30,30,.04);
}
.cgi-nome{font-weight:700; font-size:14px; margin-bottom:4px; line-height:1.25;}
.cgi-dia{font-size:11.5px; color:var(--muted2); margin-bottom:10px;}
.cgi-bottom{display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;}
.cgi-max{font-size:11px; color:var(--muted2); font-weight:600;}

/* home pública / rascunho / topo com Entrar */
.rascunho-badge{
  font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; margin-left:6px;
  vertical-align:middle; white-space:nowrap; background:#f1eee2; color:var(--muted2);
}
.publish-row{display:flex; gap:8px; margin-top:6px;}
.publish-row .btn{flex:1;}

/* importar planilha */
.import-row{display:flex; gap:8px; margin-top:6px;}
.import-row .btn{flex:1;}

/* ===== Chaveador novo (N=8-30, dupla eliminatória com repescagem cruzada) —
   ver ESPEC_Chaveador_Duplo.md. Escopado dentro de .chaveador-novo pra não
   vazar pro resto do site. ===== */
.chaveador-novo{
  font-family:Barlow,"Helvetica Neue",Arial,sans-serif; color:var(--cv-ink);
}
.cv-tag{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:2px 7px; border-radius:3px; font-weight:600; white-space:nowrap;
}
.cv-tag.wb{background:var(--cv-wb-soft); color:var(--cv-wb);}
.cv-tag.lb{background:var(--cv-lb-soft); color:var(--cv-lb);}
.cv-tag.fi{background:var(--cv-gold-soft); color:var(--cv-gold);}
.cv-rhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-bottom:4px; border-bottom:1px solid var(--cv-line); margin:14px 0 9px;}
.cv-rhead h3{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; font-size:17px; font-weight:600; margin:0; letter-spacing:.02em; color:var(--cv-ink);}
.cv-rhead .n{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--cv-muted);}
.cv-games{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
.cv-game{background:var(--cv-surface); border:1px solid var(--cv-line); border-radius:6px; overflow:hidden; box-shadow:var(--cv-shadow);}
.cv-game.wb{border-top:2px solid var(--cv-wb);}
.cv-game.lb{border-top:2px solid var(--cv-lb);}

.cv-slot .sc{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12.5px; color:var(--cv-ink-2);}

// Generic algorithm for every bracket size from 8 to 30, replacing both the
// hand-extracted spreadsheet tables (7-26) and the old ad-hoc 27-30 filler.
// This is Ed's own spec (ago/2026): everyone starts in the "chave dos
// vencedores", split into two mirrored halves (CIMA/BAIXO). Whoever loses
// falls into the repescagem of the OPPOSITE half — the crossover rule — so

// eliminates. Each half delivers 2 survivors (1 invicto + 1 repescado) who

// renumbers what's left in sequence, so a chave of 11 looks like a chave of

// exact same {fase,num,a,b} shape (plain rank numbers or "Venc J N"/"Perd J
// N" references) as every hand-built table above, so nothing else in the
// app (computeBracketMeta, a árvore, o ranking) needs to know this exists.
function bracketSeedOrder(P){
  let order = [1];
  while(order.length < P){
    const n = order.length * 2;
    const next = [];
    order.forEach(s => { next.push(s); next.push(n + 1 - s); });
    order = next;
  }
  return order;
}

  // sobreviventes" (os repescados jogam entre si).
  function construirRepescagem(prefixo, lado, rodadasOrigem){
    const k = rodadasOrigem.length;
    const games = [];
    let r = 1;
    let ids = [];
    const quedas = rodadasOrigem[0].map(j => ({ type:'P', val:j }));
    for(let i = 0; i < quedas.length; i += 2){
      const jid = prefixo + r + '.' + (i/2 + 1);
      games.push({ id:jid, fase:'REPESCAGEM', lado, rodada:r, a:quedas[i], b:quedas[i+1] });
      ids.push(jid);
    }
    let atual = ids.map(id => ({ type:'V', val:id }));
    r++;
    for(let wr = 2; wr <= k; wr++){
      const entrando = rodadasOrigem[wr-1].map(j => ({ type:'P', val:j })).slice().reverse();
      ids = [];
      for(let i = 0; i < atual.length; i++){
        const jid = prefixo + r + '.' + (i+1);
        games.push({ id:jid, fase:'REPESCAGEM', lado, rodada:r, a:entrando[i], b:atual[i] });
        ids.push(jid);
      }
      atual = ids.map(id => ({ type:'V', val:id }));
      r++;
      if(atual.length > 1 && wr < k){
        ids = [];
        for(let i = 0; i < atual.length; i += 2){
          const jid = prefixo + r + '.' + (i/2 + 1);
          games.push({ id:jid, fase:'REPESCAGEM', lado, rodada:r, a:atual[i], b:atual[i+1] });
          ids.push(jid);
        }
        atual = ids.map(id => ({ type:'V', val:id }));
        r++;
      }
    }
    return { games, champion: atual[0] };
  }

  const chaveCima = construirChave('C', 'CIMA', seedsCima);
  const chaveBaixo = construirChave('B', 'BAIXO', seedsBaixo);
  const repCima = construirRepescagem('RC', 'CIMA', chaveBaixo.roundsIds);
  const repBaixo = construirRepescagem('RB', 'BAIXO', chaveCima.roundsIds);

  const sfCima = { id:'SF-CIMA', fase:'SEMIFINAL', lado:'CIMA', rodada:1, a:chaveCima.champion, b:repCima.champion };
  const sfBaixo = { id:'SF-BAIXO', fase:'SEMIFINAL', lado:'BAIXO', rodada:1, a:chaveBaixo.champion, b:repBaixo.champion };
  const final = { id:'FINAL', fase:'FINAL', lado:null, rodada:1, a:{type:'V',val:'SF-CIMA'}, b:{type:'V',val:'SF-BAIXO'} };
  const terceiro = { id:'3-LUGAR', fase:'TERCEIRO', lado:null, rodada:1, a:{type:'P',val:'SF-CIMA'}, b:{type:'P',val:'SF-BAIXO'} };

  const allGames = [].concat(chaveCima.games, chaveBaixo.games, repCima.games, repBaixo.games, [sfCima, sfBaixo, final, terceiro]);
  const byId = {};
  allGames.forEach(g => { byId[g.id] = g; });

  // Resolução estrutural de bye: se um lado acaba em BYE não depende de quem
  // ganha um jogo real (só da posição dos seeds), então dá pra calcular antes
  // de qualquer partida ter sido jogada — regra da PODA (§3.1 da spec).
  const effCache = {};
  function effective(ref){
    const key = ref.type + ':' + ref.val;
    if(effCache[key]) return effCache[key];
    let result;
    if(ref.type === 'seed'){
      result = ref.val <= N ? { type:'seed', val:ref.val } : { type:'bye' };
    } else {
      const g = byId[ref.val];
      const aEff = effective(g.a), bEff = effective(g.b);
      if(ref.type === 'V'){
        if(aEff.type === 'bye' && bEff.type === 'bye') result = { type:'bye' };
        else if(aEff.type === 'bye') result = bEff;
        else if(bEff.type === 'bye') result = aEff;
        else result = { type:'gameWinner', id:g.id };
      } else {
        if(aEff.type === 'bye' || bEff.type === 'bye') result = { type:'bye' };
        else result = { type:'gameLoser', id:g.id };
      }
    }
    effCache[key] = result;
    return result;
  }
  function isReal(g){
    return effective(g.a).type !== 'bye' && effective(g.b).type !== 'bye';
  }

  // Cada rodada da repescagem é uma rodada de eliminação e decide uma faixa
  // da classificação final. Andando da última rodada pra primeira, cada jogo
  // REAL daquela rodada (CIMA e BAIXO juntos) consome uma posição.
  const repescagemGames = [].concat(repCima.games, repBaixo.games);
  const roundsDesc = Array.from(new Set(repescagemGames.map(g => g.rodada))).sort((a,b) => b - a);
  const faixaByRound = {};
  let proxima = 5;
  roundsDesc.forEach(r => {
    const reais = repescagemGames.filter(g => g.rodada === r && isReal(g));
    if(reais.length){
      faixaByRound[r] = [proxima, proxima + reais.length - 1];
      proxima += reais.length;
    }
  });
  function faseFor(g){
    if(g.fase === 'CHAVE') return 'GRUPO';
    if(g.fase === 'SEMIFINAL') return 'S/Final';
    if(g.fase === 'FINAL') return 'Final';
    if(g.fase === 'TERCEIRO') return '3º/4º';
    const f = faixaByRound[g.rodada];
    return f[0] === f[1] ? (f[0] + 'º') : (f[0] + 'º/' + f[1] + 'º');
  }

  // PODA + NUMERAÇÃO EM CASCATA (§9): os jogos são numerados 1, 2, 3... na
  // ordem OFICIAL do calendário, não na ordem em que foram construídos acima.
  // Essa ordem agrupa os jogos em "blocos" (cada bloco = uma rodada inteira),
  // na sequência fixa da §9.1:
  //   bloco 1: chave r1        bloco 2: chave r2
  //   bloco 3: repescagem r1   bloco 4: repescagem r2 (recepção)
  //   pra r = 3..k: chave rR, repescagem r(2r-3) (sobreviventes),
  //                 repescagem r(2r-2) (recepção)
  //   bloco: semifinais        bloco: final + disputa de 3º
  // Dentro de cada bloco (§9.2), primeiro todos os jogos do grupo de CIMA,
  // depois todos os do grupo de BAIXO, na ordem vertical em que foram
  // construídos (§9.2) — e, dentro disso (§9.3), os jogos cujos dois lados
  // já são nomes conhecidos (seeds, incl. quem passou por bye) vêm ANTES dos
  // que ainda dependem do resultado de outro jogo ("Venc./Perd. jogo X"),
  // cada um dos dois grupos preservando essa mesma ordem cima-depois-baixo.
  // Um bloco sem nenhum jogo REAL (ex.: repescagem r1 pode ser todo W.O. em
  // chaves pequenas) simplesmente não numera nada e a cascata segue pro
  // próximo bloco — não deixa buraco na numeração nem precisa de caso
  // especial.
  const k = chaveCima.roundsIds.length; // === chaveBaixo.roundsIds.length
  const blocoDescs = [
    { fase:'CHAVE', rodada:1 },
    { fase:'CHAVE', rodada:2 },
    { fase:'REPESCAGEM', rodada:1 },
    { fase:'REPESCAGEM', rodada:2 },
  ];
  for(let r = 3; r <= k; r++){
    blocoDescs.push({ fase:'CHAVE', rodada:r });
    blocoDescs.push({ fase:'REPESCAGEM', rodada: 2*r - 3 });
    blocoDescs.push({ fase:'REPESCAGEM', rodada: 2*r - 2 });
  }
  function gamesForBloco(desc){
    const cima = desc.fase === 'CHAVE' ? chaveCima.games : repCima.games;
    const baixo = desc.fase === 'CHAVE' ? chaveBaixo.games : repBaixo.games;
    return [].concat(
      cima.filter(g => g.rodada === desc.rodada),
      baixo.filter(g => g.rodada === desc.rodada)
    );
  }

  let novoNum = 0;
  const novoNumPorId = {};
  const out = [];
  function formatRef(eff){
    if(eff.type === 'seed') return eff.val;
    if(eff.type === 'gameWinner') return 'Venc J ' + novoNumPorId[eff.id];
    return 'Perd J ' + novoNumPorId[eff.id];
  }
  // "Pronto" (§9.3) isn't just "both sides are literal seeds" — a game that
  // depends on another REAL game is only as ready as whichever of its two
  // inputs took the LONGEST to become knowable. blocoOfId tracks which
  // bloco each already-numbered real game landed in; a seed (or a bye
  // resolved all the way down to one) is available immediately (bloco 0).
  // Sorting each bloco's games by that "latest-resolved input" bloco index
  // (ascending, ties broken by the natural cima-then-baixo cascade order)
  // reproduces the official example exactly — including the subtler case
  // where two repescagem "sobreviventes" games are equally un-fed-by-seeds
  // but one of them additionally waits on ANOTHER repescagem game (a later
  // bloco) while the other only traces back to chave games (an earlier
  // bloco): the one anchored to the earlier bloco goes first.
  const blocoOfId = {};
  let blocoCounter = 0;
  function numerarBloco(blocoGames){
    blocoCounter++;
    const myBloco = blocoCounter;
    const reais = blocoGames.filter(isReal);
    function readinessBloco(g){
      const aE = effective(g.a), bE = effective(g.b);
      const ka = aE.type === 'seed' ? 0 : blocoOfId[aE.id];
      const kb = bE.type === 'seed' ? 0 : blocoOfId[bE.id];
      return Math.max(ka, kb);
    }
    const ordenados = reais
      .map((g, i) => ({ g, i, key: readinessBloco(g) }))
      .sort((x, y) => (x.key - y.key) || (x.i - y.i))
      .map(x => x.g);
    ordenados.forEach(g => {
      novoNum++;
      novoNumPorId[g.id] = novoNum;
      blocoOfId[g.id] = myBloco;
      // rodada carries the TRUE (pre-poda) round number — a game whose seeds
      // both arrived via bye (e.g. "#4 x #5" when 4 and 5 both skipped round
      // 1) looks structurally identical to a genuine round-1 game once
      // pruned (both inputs are bare seed numbers either way), but it isn't
      // played at the same time: it's scheduled alongside round 2. Keeping
      // the real round here is what lets the árvore column the two
      // correctly instead of aliasing them together.
      out.push({ fase: faseFor(g), num: novoNum, a: formatRef(effective(g.a)), b: formatRef(effective(g.b)), rodada: g.rodada });
    });
  }
  blocoDescs.forEach(desc => numerarBloco(gamesForBloco(desc)));
  numerarBloco([sfCima, sfBaixo]);
  numerarBloco([final, terceiro]);
  return out;
}
// buildDuplaCruzada() generates a mathematically standard bracket seeding
// (the textbook recursive 1-vs-2^N pattern: seed 1 always paired against the
// theoretical bottom seed, 2 against the next, etc.) — that's NOT the same
// pairing convention as the official CBV draw sheets extracted into
// brackets.json for N=4,5,7-26 (confirmed against a real 17-duplas reference
// sheet on 16/08/2026: the live game 1 was seed 16 x 17, but the official
// sheet has seed 17 x 14, with seed 2 meeting seed 16 — a different,
// non-formulaic seeding chart, not reproducible by a simple recursive rule).
// brackets.json is authoritative for every size from 8 to 30 (confirmed
// against N=17's real reference sheet, and N=11's too — matches the earlier
// byte-for-byte audit). It used to have known problems for 15,19,20,24,25,26
// (broken ranking coverage) and no entries at all for 27-30, both patched at
// runtime with buildDuplaCruzada() below. Ed flagged (20/08/2026, the day
// before a real tournament) that N=11's repescagem could reunite a dupla with
// the SAME opponent it had already lost to earlier ("o perdedor não está
// invertendo") — auditing every size the same way found the identical bug
// (a placement-round game reuniting a pair that already played) baked into
// MANY sizes, brackets.json AND buildDuplaCruzada alike (buildDuplaCruzada's
// own "anti-revanche" reversal heuristic only reliably protects the
// semifinal, not the 9º/12º-7º/8º-5º/6º placement rounds). Every size 8-30
// was re-solved (search_fix.js: local search over which loser/winner lands in
// which placement-round slot, keeping game numbers and every other structural
// invariant fixed) so NO two duplas ever meet twice under realistic results,
// and the fixed tables were baked directly into brackets.json — so
// buildDuplaCruzada is no longer called for any size at build time.
const TABELA_OFICIAL_COM_PROBLEMA = new Set([]);
TABELA_OFICIAL_COM_PROBLEMA.forEach(n => { BRACKETS[n] = buildDuplaCruzada(n); });

const SIZES = Object.keys(BRACKETS).map(Number).sort((a,b)=>a-b);

// Estado (UF) do atleta (Ed, 18/09: "cadastrar o estado da pessoa") — lista
// fixa das 27 UFs do Brasil, sigla mesmo (é assim que a CBVP mostra, ex.
// "EVANDRO/RJ").
const ESTADOS_BR = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

const PHASE_LABELS = {
  "GP ÚNICO":"Grupo único (todos x todos)",
  "GRUPO":"Fase de grupos / chave",
  "Grupo A":"Grupo A",
  "Grupo B":"Grupo B",
  "S/Final":"Semifinal",
  "3º/4º":"Disputa 3º / 4º lugar",
  "Final":"Final",
  // Rótulos do novo modelo "chaveador" (N=8-30, ver buildBracket()/seedOrder()) —
  // repescagem cruzada com final em quatro (semifinais cruzadas + 3º lugar + final).
  "Preliminar":"Preliminar",
  "16-avos":"16-avos de final",
  "Oitavas":"Oitavas de final",
  "Quartas":"Quartas de final",
  "Semifinais da chave":"Semifinais da chave dos vencedores",
  "Semifinais cruzadas":"Semifinais cruzadas",
  "3º lugar":"Disputa de 3º lugar",
};
function phaseLabel(f){
  if(PHASE_LABELS[f]) return PHASE_LABELS[f];
  if(/^Rodada \d+$/.test(f)) return 'Chave — ' + f;
  if(/^LB Rodada \d+$/.test(f)) return 'Repescagem — ' + f.replace('LB ','');
  if(/^Repescagem \d+$/.test(f)) return f;
  return "Colocação " + f;
}

// Structural classification: which games belong to the "Chave dos Vencedores"
// (principal) vs the "Chave de Repescagem" (losers bracket) vs are the single
// merge point ("final"). This is derived purely from the a/b references — a
// game is tainted "repescagem" the moment any input traces back to a "Perd J N"
// (loser-of) reference; "Venc J N" (winner-of) inherits its source game's
// classification; a plain rank number or {grp,pos} group standing is a fresh
// seed (principal). A game whose two inputs disagree (one principal-lineage,
// one repescagem-lineage) is the merge/"final" game. This works uniformly for
// the hand-built tables (3-6), the extracted spreadsheet tables (7-26) and the
// generated tables (27-30) without trusting any fase label text — those vary a
// lot between sources (see brackets.json vs generateDoubleElim's "Rodada N").
// "round" is the longest structural path from a fresh seed, used as the column
// a game belongs to in the árvore (tree) view.
const bracketMetaCache = {};
function computeBracketMeta(numTimes){
  if(bracketMetaCache[numTimes]) return bracketMetaCache[numTimes];
  const games = BRACKETS[numTimes];
  const byNum = {};
  games.forEach(g => { byNum[g.num] = g; });
  const memo = {};

  // "touched" = this survivor's lineage has a loss somewhere in its history
  // (fresh rank seeds / group standings are untouched; the winner side of a
  // "Perd J N" reference is always touched; the winner of "Venc J N" inherits
  // whatever that source game already was).
  function touched(gnum){
    if(memo[gnum] && memo[gnum].touched !== undefined) return memo[gnum].touched;
    const g = byNum[gnum];
    const inputTouched = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return m[1] === 'Perd' ? true : touched(parseInt(m[2], 10));
      }
      return false; // rank number or {grp,pos}: fresh seed, never lost
    };
    const t = inputTouched(g.a) || inputTouched(g.b);
    memo[gnum] = Object.assign(memo[gnum] || {}, { touched: t });
    return t;
  }

  function classify(gnum){
    const g = byNum[gnum];
    const sideTouched = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return m[1] === 'Perd' ? true : touched(parseInt(m[2], 10));
      }
      return false;
    };
    const ta = sideTouched(g.a), tb = sideTouched(g.b);
    if(!ta && !tb) return 'principal';       // both sides still fully undefeated
    if(ta && tb) return 'repescagem';        // both sides already carry a loss
    return 'crossover';                       // one undefeated side meets one touched side
  }

  function depth(gnum){
    if(memo[gnum] && memo[gnum].depth !== undefined) return memo[gnum].depth;
    const g = byNum[gnum];
    const inputDepth = (ref) => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m) return depth(parseInt(m[2], 10));
      }
      return 0;
    };
    const d = 1 + Math.max(inputDepth(g.a), inputDepth(g.b));
    memo[gnum] = Object.assign(memo[gnum] || {}, { depth: d });
    return d;
  }

  games.forEach(g => { touched(g.num); depth(g.num); });
  const meta = {};
  games.forEach(g => { meta[g.num] = { bracket: classify(g.num), round: memo[g.num].depth }; });
  const crossovers = games.filter(g => meta[g.num].bracket === 'crossover');
  const hasRepescagem = games.some(g => meta[g.num].bracket === 'repescagem' || meta[g.num].bracket === 'crossover');
  // "clean" = the two lineages only ever meet once (the real grand final) — only
  // then does a strict "Chave dos Vencedores" / "Chave de Repescagem" 2-view
  // split make sense. Sizes with several crossover/placement games throughout
  // (common in the CBV-style tables for 7-26) don't decompose that way.
  const isClean = hasRepescagem && crossovers.length === 1;
  const result = { meta, hasRepescagem, isClean, crossovers: crossovers.map(g=>g.num) };
  bracketMetaCache[numTimes] = result;
  return result;
}

// Semifinal, final and the 3rd-place dispute can use a different set format
// (e.g. melhor de 3) than the rest of the chave (e.g. set único).
const DECISIVE_FASES = new Set(['S/Final', 'Final', '3º/4º']);
function formatForGame(chave, g){
  if(DECISIVE_FASES.has(g.fase)) return chave.formatoDecisivo || chave.formato;
  return chave.formato;
}

// ---------- Firestore-backed data layer ----------
// eventos/categorias/chaves now live in Firestore. Realtime listeners
// (onSnapshot) mirror each collection into a plain in-memory array below, so
// every load*/get* function stays a synchronous read exactly like it was with
// localStorage — only update*/delete* now also fire off a Firestore write.
// The local array is updated optimistically (immediately) on every write so
// the screen right after saving always shows fresh data without waiting for
// a round trip; the listener then reconciles it with whatever the server
// confirms (which is what makes multi-organizador sync actually show up).
let _chavesCache = [];
let _eventosCache = [];
let _categoriasCache = [];
// Config geral do site (não é por evento) — hoje só guarda a logo de fundo
// do menu principal. Um único documento fixo (config/geral) em vez de uma
// coleção, porque só existe essa configuração por enquanto.
let _configCache = { menuBgUrl: null };
// Catálogo de CTs (Ed, 18/09: "cadastramos previamente os CTs pra unificar
// as informações, caso não tenha o CT do atleta, que o atleta possa
// cadastrar e eu confirmar posteriormente") — coleção pública igual a
// eventos/chaves/categorias, lida por qualquer um (inclusive antes de
// logar, pro autocomplete do cadastro de atleta), escrita só otimista aqui
// e revisada pelo organizador em renderCtsPendentesView().
let _ctsCache = [];

// Firestore flatly rejects any field that's a nested array — an array whose
// elements are themselves arrays, like sets:[[21,15]] — with "Nested arrays
// are not supported". Every placar in this app has always been stored that
// way, which means every write of a real score has been rejected by the
// REAL Firestore backend since day one (confirmed live on 16/08/2026: the
// optimistic local update made it LOOK saved on screen, but nothing ever
// reached the server — this, not connection quality, is the actual cause of
// the 15/08/2026 incidente). Fixed by storing each set as a plain {a,b}
// object on the wire (Firestore-safe) and converting back to the [a,b]
// tuple every other part of the app already expects (UI, average calc,
// tree view, W.O., conflict comparison) the instant it's read back — only
// these two functions and the write boundary below need to know about the
// wire format.
function setsToFirestore(sets){
  return (sets || []).map(s => ({ a: s[0], b: s[1] }));
}
function setsFromFirestore(sets){
  return (sets || []).map(s => Array.isArray(s) ? s : [s.a, s.b]);
}
function resultadoToFirestore(res){
  if(!res) return res;
  return Object.assign({}, res, { sets: setsToFirestore(res.sets) });
}
function normalizeChaveFromFirestore(chave){
  if(chave.resultados){
    const conv = {};
    Object.keys(chave.resultados).forEach(k => {
      const r = chave.resultados[k];
      conv[k] = r ? Object.assign({}, r, { sets: setsFromFirestore(r.sets) }) : r;
    });
    chave.resultados = conv;
  }
  return chave;
}

// Assina (ou reassina) os três listeners em tempo real. route() roda a cada
// snapshot, então qualquer tela aberta (organizador OU público) já deveria
// se atualizar sozinha sem precisar de navegação — mas o Ed relatou que no
// modo público, quem está assistindo precisa voltar pro menu e abrir a
// categoria de novo pra ver o que mudou. Isso bate com um problema conhecido
// de navegadores mobile: ao trocar de app ou trancar a tela, a conexão em
// tempo real do Firestore (WebSocket/long-polling) pode ficar "adormecida" e
// não se recupera sozinha quando a pessoa volta — o app continua mostrando
// o último estado que tinha antes de ir pro segundo plano. Cancelar os
// listeners antigos e assinar de novo força uma reconexão limpa (que já
// dispara um snapshot fresco na hora), sem precisar trocar de tela nem
// perder o lugar onde a pessoa estava.
let _liveUnsubs = [];
function attachLiveListeners(){
  _liveUnsubs.forEach(unsub => { try{ unsub(); }catch(e){} });
  _liveUnsubs = [];
  _liveUnsubs.push(fbDb.collection('chaves').onSnapshot(snap => {
    _chavesCache = snap.docs.map(d => normalizeChaveFromFirestore(Object.assign({ id: d.id }, d.data())));
    route();
  }, err => { console.error('chaves onSnapshot', err); toast('Sem conexão com o servidor'); }));
  _liveUnsubs.push(fbDb.collection('eventos').onSnapshot(snap => {
    _eventosCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('eventos onSnapshot', err)));
  _liveUnsubs.push(fbDb.collection('categorias').onSnapshot(snap => {
    _categoriasCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('categorias onSnapshot', err)));
  // 'config' é uma coleção com um único documento fixo ('geral') — usa o
  // mesmo onSnapshot em nível de coleção que chaves/eventos/categorias já
  // usam (em vez de doc().onSnapshot(), que a mesma API do Firestore
  // suporta, mas mantém tudo no mesmo padrão testado nas outras 3).
  _liveUnsubs.push(fbDb.collection('config').onSnapshot(snap => {
    const geral = snap.docs.find(d => d.id === 'geral');
    _configCache = Object.assign({ menuBgUrl:null }, geral ? geral.data() : {});
    route();
  }, err => console.error('config onSnapshot', err)));
  _liveUnsubs.push(fbDb.collection('cts').onSnapshot(snap => {
    _ctsCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('cts onSnapshot', err)));
}
attachLiveListeners();
// Reabre os listeners quando a aba volta a ficar visível (troca de app,
// desbloqueio de tela), quando a página volta do bfcache do Safari
// (event.persisted — não roda o script de novo do zero, só "acorda" o que já
// estava congelado) e quando a conexão de rede volta depois de cair.
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') attachLiveListeners(); });
}
if(typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('pageshow', (e) => { if(e && e.persisted) attachLiveListeners(); });
  window.addEventListener('online', attachLiveListeners);
}

// Redimensiona no navegador antes de salvar (mesmo esquema da logomarca do
// evento) — como PNG, pra preservar transparência se a imagem já tiver.
function onMenuBgSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      setMenuBg(canvas.toDataURL('image/png'));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
// Camada de fundo fixa (position:fixed, atrás de tudo, opacidade baixa) —

function loadChaves(){ return _chavesCache; }
function getChave(id){ return _chavesCache.find(c => c.id === id); }
function updateChave(chave){
  const idx = _chavesCache.findIndex(c => c.id === chave.id);
  if(idx >= 0) _chavesCache[idx] = chave; else _chavesCache.push(chave);
  const data = Object.assign({}, chave);
  delete data.id;
  // Any full-chave write (renaming a time, editing a categoria, etc.) can
  // carry already-scored resultados along with it — those need the same
  // Firestore-safe {a,b} set shape as salvarResultado(), or the WHOLE write
  // gets rejected (nested arrays), not just the score itself.
  if(data.resultados){
    const conv = {};
    Object.keys(data.resultados).forEach(k => { conv[k] = resultadoToFirestore(data.resultados[k]); });
    data.resultados = conv;
  }
  fbDb.collection('chaves').doc(chave.id).set(data).catch(err => {
    console.error('updateChave', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
}
function deleteChave(id){
  _chavesCache = _chavesCache.filter(c => c.id !== id);
  fbDb.collection('chaves').doc(id).delete().catch(err => console.error('deleteChave', err));
}
function uid(prefix){ return (prefix||'c') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ---------- Evento -> Dia -> Categoria ----------
// A "categoria" is just a thin link between a day of an evento and a chave — the
// chave's own .nome IS the categoria's name, so renaming a categoria is just
// renaming its chave (no duplicated name to keep in sync).
function loadEventos(){ return _eventosCache; }
function getEvento(id){ return _eventosCache.find(e => e.id === id); }
function updateEvento(ev){
  const idx = _eventosCache.findIndex(e => e.id === ev.id);
  if(idx >= 0) _eventosCache[idx] = ev; else _eventosCache.push(ev);
  const data = Object.assign({}, ev);
  delete data.id;
  fbDb.collection('eventos').doc(ev.id).set(data).catch(err => {
    console.error('updateEvento', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
}
function deleteEvento(id){
  loadCategorias().filter(c => c.eventoId === id).forEach(c => {
    deleteChave(c.chaveId);
    deleteCategoriaRecord(c.id);
  });
  _eventosCache = _eventosCache.filter(e => e.id !== id);
  fbDb.collection('eventos').doc(id).delete().catch(err => console.error('deleteEvento', err));
}
function diasOfEvento(evento){
  const days = [];
  if(!evento.dataInicio || !evento.dataFim) return days;
  let d = new Date(evento.dataInicio + 'T00:00:00');
  const end = new Date(evento.dataFim + 'T00:00:00');
  let guard = 0;
  while(d <= end && guard < 60){
    days.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return days;
}
function formatDiaLabel(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// Full day-of-week name for the evento's day tabs/list, e.g. "Sexta – 21/08".
function formatDiaLabelFull(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return dias[d.getDay()] + ' – ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// "31 de julho de 2026" — usado na página pública do evento (estilo arevo).
function formatDateLong(dataStr){
  const d = new Date(dataStr + 'T00:00:00');
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return String(d.getDate()).padStart(2,'0') + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
}
function formatPeriodoLong(dataInicio, dataFim){
  if(!dataInicio) return '';
  if(!dataFim || dataFim === dataInicio) return formatDateLong(dataInicio);
  return formatDateLong(dataInicio) + ' - ' + formatDateLong(dataFim);
}
