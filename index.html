function onImportListaCompletaSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', blankrows:false });
      const { records, headerFound } = parsePlanilhaGeral(rows);
      if(!headerFound){
        toast('Não achei uma coluna "Categoria" nessa planilha — confira se a primeira linha tem os títulos das colunas');
        return;
      }
      const rawGroups = groupRecordsByCategoria(records);
      importListaState.fileName = file.name;
      // Cada categoria da planilha vira ou "criar" (nome novo, nunca visto
      // no evento) ou "atualizar" (já existe uma chave com esse nome, em
      // qualquer dia) — nesse segundo caso comparamos os times pelo nome
      // dos atletas pra descobrir só quem é novo, sem duplicar categoria
      // nem mexer na data/horário que já estava definido.
      importListaState.groups = rawGroups.map(g => {
        const match = findExistingCategoriaByName(importListaState.eventoId, g.categoria);
        const { modalidade: modalidadeSheet, times } = buildTimesFromRows(g.rows, match ? match.chave.modalidade : undefined);
        if(match){
          const modalidade = match.chave.modalidade; // usa a modalidade já cadastrada, evita duplicar por conta de uma coluna ambígua
          const diff = diffTimes(match.chave.times || [], times, modalidade);
          return {
            categoria: g.categoria, modalidade, times, horaInicio: '',
            acao: 'atualizar', existingChaveId: match.chave.id,
            novos: diff.novos, sumidos: diff.sumidos,
            incluir: diff.novos.length > 0, confirmReset: false,
          };
        }
        return { categoria: g.categoria, modalidade: modalidadeSheet, times, incluir: true, horaInicio: '', acao: 'criar' };
      });
      renderImportLista(importListaState.eventoId, importListaState.dia);
    } catch(err){
      console.error('importListaCompleta', err);
      toast('Não deu pra ler essa planilha — confira o formato (.xlsx ou .csv)');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
// Aplica a prévia: categorias "criar" viram chave nova (sem dia definido,
// pro Ed mover e ajustar horário); categorias "atualizar" só recebem os
// times novos no final da lista — nunca mexem em data/horário/quadras já
// definidos, e só zeram placar se realmente mudar o tamanho da chave E já
// tinha jogo lançado (e mesmo assim só com a confirmação explícita marcada
// na prévia).
function confirmarImportLista(){
  const s = importListaState;
  if(!s || !s.groups) return;
  let criadas = 0, atualizadas = 0, placaresZerados = 0, puladasPorConfirmacao = 0, puladasPorTamanho = 0;
  s.groups.forEach(g => {
    if(g.acao === 'criar'){
      if(!g.incluir || !g.categoria || !g.categoria.trim() || !g.times.length) return;
      // Corrigido 18/09: sem esse check, uma categoria nova com um total de
      // duplas que não bate com nenhum tamanho de chave pronto (ex.: 2, 6,
      // ou qualquer N fora de SIZES) criava uma chave com numTimes inválido
      // — BRACKETS[numTimes] vem undefined e QUALQUER tela que leia essa
      // categoria (ranking, chaveamento, cronograma, lista) quebra na hora.
      if(!SIZES.includes(g.times.length)){ puladasPorTamanho++; return; }
      const c = {
        id: uid('c'),
        nome: g.categoria.trim(),
        modalidade: g.modalidade,
        numTimes: g.times.length,
        formato: 'unico',
        formatoDecisivo: 'melhorDe3',
        disputa3: true,
        times: g.times,
        resultados: {},
        criadoEm: Date.now()
      };
      updateChave(c);
      const cat = { id:uid('cat'), eventoId:s.eventoId, data:s.dia, chaveId:c.id, horaInicio: g.horaInicio || null, criadoEm:Date.now() };
      updateCategoria(cat);
      criadas++;
      return;
    }
    // acao === 'atualizar'
    if(!g.novos || !g.novos.length) return; // nada novo pra somar (sumidos sozinhos nunca aplicam automaticamente)
    if(!g.incluir) return;
    const chave = getChave(g.existingChaveId);
    if(!chave) return;
    const novoTimes = (chave.times || []).concat(g.novos);
    if(!SIZES.includes(novoTimes.length)){ puladasPorTamanho++; return; } // não existe chave pronta pra esse total — ajuste manual em "Editar chave"
    const resize = novoTimes.length !== chave.numTimes;
    const temPlacar = Object.keys(chave.resultados || {}).length > 0;
    if(resize && temPlacar && !g.confirmReset){ puladasPorConfirmacao++; return; }
    chave.times = novoTimes;
    chave.numTimes = novoTimes.length;
    if(resize && temPlacar){ chave.resultados = {}; placaresZerados++; }
    updateChave(chave);
    atualizadas++;
  });
  const eventoId = s.eventoId, dia = s.dia;
  importListaState = null;
  const partes = [];
  if(criadas) partes.push(criadas + ' nova' + (criadas===1?'':'s'));
  if(atualizadas) partes.push(atualizadas + ' atualizada' + (atualizadas===1?'':'s'));
  if(placaresZerados) partes.push(placaresZerados + ' com placar zerado (mudou de tamanho)');
  if(puladasPorConfirmacao) partes.push(puladasPorConfirmacao + ' pulada' + (puladasPorConfirmacao===1?'':'s') + ' — falta confirmar o aviso de placar');
  if(puladasPorTamanho) partes.push(puladasPorTamanho + ' pulada' + (puladasPorTamanho===1?'':'s') + ' — total não bate com nenhum tamanho de chave pronto');
  toast(partes.length ? ('Categorias: ' + partes.join(', ')) : 'Nenhuma mudança pra aplicar');
  location.hash = '/evento/' + eventoId + '/' + encodeURIComponent(dia);
}

// ---------- tela do cronograma ----------
// Modelo pedido pelo Ed: cada categoria tem quadras DEDICADAS (ele define
// quantas quadras e a que horas cada categoria começa, igual a planilha que
// ele já usava), sem misturar categorias diferentes na mesma quadra. Dentro
// da faixa de quadras de uma categoria, cada JOGO individual aparece como um
// retângulo pequeno (categoria + fase + número do jogo), com rowspan só nas
// linhas que aquele jogo realmente ocupa.
function renderCronograma(eventoId, dia){
  const ev = getEvento(eventoId);
  if(!ev){ location.hash = '/organizador'; return; }
  const dc = getDiaConfig(ev, dia);
  const items = categoriasOfDia(eventoId, dia);
  const backHash = '/evento/' + eventoId + '/' + encodeURIComponent(dia);

  // Troca de dia direto aqui dentro do cronograma — pedido do Ed pra não
  // precisar voltar pra tela do evento só pra ver o cronograma de outro dia.
  const dias = diasOfEvento(ev);
  const dayTabs = dias.length > 1 ? `<div class="tabs" style="overflow-x:auto;">
    ${dias.map(d => `<div class="tab ${d===dia?'active':''}" onclick="location.hash='/cronograma/${eventoId}/'+encodeURIComponent('${d}')">${formatDiaLabelFull(d)}</div>`).join('')}
  </div>` : '';

  const configCard = `<div class="card">
    <label>Quadras disponíveis nesse dia</label>
    <input type="number" min="1" step="1" value="${dc.quadras||''}" placeholder="ex: 9" oninput="setDiaConfig('${eventoId}','${dia}',{quadras:parseInt(this.value,10)||0}); renderCronograma('${eventoId}','${dia}')">
    <div style="display:flex; gap:8px; margin-top:8px;">
      <div style="flex:1;">
        <label>Início do dia</label>
        <input type="time" value="${escapeHtmlAttr(dc.horaInicio)}" oninput="setDiaConfig('${eventoId}','${dia}',{horaInicio:this.value}); renderCronograma('${eventoId}','${dia}')">
      </div>
      <div style="flex:1;">
        <label>Horário limite (opcional)</label>
        <input type="time" value="${escapeHtmlAttr(dc.horaLimite)}" oninput="setDiaConfig('${eventoId}','${dia}',{horaLimite:this.value}); renderCronograma('${eventoId}','${dia}')">
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <div style="flex:1;">
        <label>Duração jogo (min)</label>
        <input type="number" min="5" step="5" value="${ev.duracaoPadrao||30}" oninput="setEventoDuracao('${eventoId}','duracaoPadrao',this.value); renderCronograma('${eventoId}','${dia}')">
      </div>
      <div style="flex:1;">
        <label>Duração semi/final (min)</label>
        <input type="number" min="5" step="5" value="${ev.duracaoDecisiva||40}" oninput="setEventoDuracao('${eventoId}','duracaoDecisiva',this.value); renderCronograma('${eventoId}','${dia}')">
      </div>
    </div>
  </div>`;

  let body;
  if(!items.length){
    body = `<div class="empty" style="margin-top:12px;"><div class="big">🏐</div><div style="font-weight:700; font-size:16px;">Nenhuma categoria nesse dia ainda</div></div>`;
  } else if(!dc.quadras){
    body = `<div class="hint" style="margin-top:10px;">Informe o número de quadras acima pra ver o cronograma.</div>`;
  } else {
    body = renderCronogramaPlanner(eventoId, dia, ev, dc, items);
  }

  app.innerHTML = `
    ${header('Cronograma', escapeHtml(ev.nome) + ' • ' + formatDiaLabel(dia), backHash)}
    <div class="wrap-chave">
      ${dayTabs}
      ${configCard}
      ${body}
    </div>`;
}
function renderCronogramaPlanner(eventoId, dia, ev, dc, items){
  // Painel único: pra cada categoria, times + jogos (referência) e os dois
  // campos editáveis que definem a quadra dedicada — quantas quadras e que
  // horas ela começa. É exatamente o que o Ed pediu: "saber quantos jogos
  // tem e quantos times estão, e eu fazer a definição aqui da quantidade de
  // quadras pra aquela categoria, que horas ela inicia".
  const configCategorias = `<div class="card">
    <div class="card-title" style="margin-bottom:4px;">Quadras por categoria</div>
    <div class="hint" style="margin:0 0 8px;">Cada categoria ocupa suas próprias quadras — os jogos dela não se misturam com os de outra categoria no mesmo horário. Dá pra mudar a quantidade de quadras ao longo do dia (ex: começa com 2, ganha mais uma a partir de um horário) em "+ mudar quadras num horário".</div>
    ${items.map(({cat, chave}) => {
      const steps = (cat.quadraSteps || []).slice();
      const stepsHtml = steps.map((s,i) => `
        <div style="display:flex; align-items:center; gap:6px; margin-top:5px;">
          <span class="hint" style="margin:0; white-space:nowrap;">a partir das</span>
          <input type="time" value="${escapeHtmlAttr(s.horaInicio)}" style="width:92px;" oninput="setCategoriaStep('${cat.id}',${i},{horaInicio:this.value}); renderCronograma('${eventoId}','${dia}')">
          <input type="number" min="1" step="1" value="${s.quadras||1}" style="width:52px;" oninput="setCategoriaStep('${cat.id}',${i},{quadras:Math.max(1,parseInt(this.value,10)||1)}); renderCronograma('${eventoId}','${dia}')">
          <span class="hint" style="margin:0; white-space:nowrap;">quadras</span>
          <button class="del-btn" style="padding:2px 6px;" onclick="removeCategoriaStep('${cat.id}',${i}); renderCronograma('${eventoId}','${dia}')">✕</button>
        </div>`).join('');
      return `
      <div style="padding:8px 0; border-bottom:1px solid var(--border);">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div style="flex:1; min-width:140px;">
            <div style="font-weight:700; font-size:13px;">${escapeHtml(chave.nome)}</div>
            <div class="hint" style="margin:0;">${chave.numTimes} ${modalidadePlural(chave.modalidade)} · ${effectiveGames(chave).length} jogos</div>
          </div>
          <div style="width:78px;">
            <label style="font-size:10px;">Quadras</label>
            <input type="number" min="1" step="1" value="${cat.quadras||1}" oninput="setCategoriaConfig('${cat.id}',{quadras:Math.max(1,parseInt(this.value,10)||1)}); renderCronograma('${eventoId}','${dia}')">
          </div>
          <div style="width:110px;">
            <label style="font-size:10px;">Início</label>
            <input type="time" value="${escapeHtmlAttr(cat.horaInicio||dc.horaInicio)}" oninput="setCategoriaConfig('${cat.id}',{horaInicio:this.value}); renderCronograma('${eventoId}','${dia}')">
          </div>
        </div>
        ${stepsHtml}
        <button class="btn ghost small" style="margin-top:6px;" onclick="addCategoriaStep('${cat.id}'); renderCronograma('${eventoId}','${dia}')">+ mudar quadras num horário</button>
      </div>`;
    }).join('')}
  </div>`;

  const evForCalc = Object.assign({}, ev, { duracaoPadrao: ev.duracaoPadrao||30, duracaoDecisiva: ev.duracaoDecisiva||40 });
  const { jogos, fimMin } = gerarGradeDia(evForCalc, items, dc.quadras, dc.horaInicio);
  const limiteMin = dc.horaLimite ? hhmmToMin(dc.horaLimite) : null;
  const feasibility = limiteMin != null
    ? (fimMin <= limiteMin
        ? `<div class="section-note" style="background:var(--success-bg); color:var(--success); font-weight:600; margin-top:10px;">✅ Cabe no horário — previsão de término ${minToHHMM(fimMin)}, ${minToHHMM(limiteMin-fimMin)} de folga antes do limite (${dc.horaLimite}).</div>`
        : `<div class="section-note" style="background:#fbeaea; color:#b13a3a; font-weight:600; margin-top:10px;">⚠️ Não cabe no horário limite — previsão de término ${minToHHMM(fimMin)}, ${fimMin-limiteMin} min além do limite (${dc.horaLimite}). Considere mais quadras, reduzir a duração dos jogos, ou tirar alguma categoria desse dia.</div>`)
    : `<div class="section-note" style="margin-top:10px;">Previsão de término: <strong>${minToHHMM(fimMin)}</strong> (defina um horário limite acima pra saber se cabe).</div>`;

  if(!jogos.length){
    return `${configCategorias}${feasibility}<div class="hint" style="margin-top:10px;">Nenhum jogo pra mostrar ainda.</div>`;
  }

  const inicioMin = hhmmToMin(dc.horaInicio) || 8*60;
  const step = cronogramaGridStep(ev);
  const fimGrade = Math.ceil(fimMin/step)*step;
  const linhas = [];
  for(let t = inicioMin; t < fimGrade; t += step) linhas.push(t);
  const corMap = corMapCategorias(jogos);

  const headRow = `<tr><th class="grade-th-hora">Horário</th>${Array.from({length:dc.quadras}, (_,i)=>`<th>Quadra ${i+1}</th>`).join('')}</tr>`;
  const coveredUntil = Array(dc.quadras).fill(inicioMin);
  const bodyRows = linhas.map(t => {
    let cells = '';
    for(let i=0; i<dc.quadras; i++){
      if(t < coveredUntil[i]) continue; // já coberto pelo rowspan de uma linha anterior
      const s = jogos.find(x => x.quadraIdx === i && x.inicio === t);
      if(!s){ cells += `<td></td>`; continue; }
      const span = Math.max(1, Math.round((s.fim - s.inicio) / step));
      coveredUntil[i] = s.fim;
      const cor = corMap[s.categoria];
      cells += `<td rowspan="${span}" class="planner-cell" style="background:${cor[0]}; color:${cor[1]};" title="${escapeHtmlAttr(s.categoria)} — Jogo ${s.gnum} · ${escapeHtmlAttr(s.fase)}">
        <div class="planner-cat">${escapeHtml(s.categoria)}</div>
        <div class="planner-fase">#${s.gnum} · ${escapeHtml(s.fase)}</div>
      </td>`;
    }
    return `<tr><td class="grade-th-hora">${minToHHMM(t)}</td>${cells}</tr>`;
  }).join('');

  return `${configCategorias}${feasibility}
    <div style="display:flex; gap:8px; margin:10px 0; flex-wrap:wrap;">
      <button class="btn ghost small" onclick="exportCronogramaPDF('${eventoId}','${dia}')">📄 PDF (este dia)</button>
      <button class="btn ghost small" onclick="exportCronogramaTodosDiasPDF('${eventoId}')">📚 PDF (todos os dias)</button>
      <button class="btn ghost small" onclick="exportCronogramaImagem('${eventoId}','${dia}')">🖼️ Exportar imagem</button>
    </div>
    <div style="overflow-x:auto;"><table id="grade-table-${cssId(dia)}" class="grade-table planner-table"><thead>${headRow}</thead><tbody>${bodyRows}</tbody></table></div>`;
}
function cssId(str){ return String(str).replace(/[^a-zA-Z0-9]/g, '-'); }
// jsPDF (~350KB) só é carregado quando o organizador realmente pede o PDF do
// cronograma — mesmo motivo do carregamento sob demanda do SheetJS.
let jspdfLoadPromise = null;
function ensureJsPdfLoaded(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if(jspdfLoadPromise) return jspdfLoadPromise;
  jspdfLoadPromise = new Promise((resolve, reject) => {
    const s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
      s2.onload = () => resolve();
      s2.onerror = () => { jspdfLoadPromise = null; reject(new Error('autotable load failed')); };
      document.head.appendChild(s2);
    };
    s1.onerror = () => { jspdfLoadPromise = null; reject(new Error('jspdf load failed')); };
    document.head.appendChild(s1);
  });
  return jspdfLoadPromise;
}
// html2canvas só é carregado quando o organizador pede a exportação em
// imagem — mesmo padrão de carregamento sob demanda das outras libs.
let html2canvasLoadPromise = null;
function ensureHtml2CanvasLoaded(){
  if(window.html2canvas) return Promise.resolve();
  if(html2canvasLoadPromise) return html2canvasLoadPromise;
  html2canvasLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = () => resolve();
    s.onerror = () => { html2canvasLoadPromise = null; reject(new Error('html2canvas load failed')); };
    document.head.appendChild(s);
  });
  return html2canvasLoadPromise;
}
// Monta a tabela [head, body] de um dia específico pro autotable, a partir
// da grade de quadras dedicadas (gerarGradeDia) — reaproveitado tanto no PDF
// de um dia só quanto no PDF com todos os dias juntos.
function montarTabelaCronogramaDia(ev, eventoId, dia){
  const dc = getDiaConfig(ev, dia);
  if(!dc.quadras) return null;
  const items = categoriasOfDia(eventoId, dia);
  if(!items.length) return null;
  const evForCalc = Object.assign({}, ev, { duracaoPadrao: ev.duracaoPadrao||30, duracaoDecisiva: ev.duracaoDecisiva||40 });
  const { jogos, fimMin } = gerarGradeDia(evForCalc, items, dc.quadras, dc.horaInicio);
  if(!jogos.length) return null;
  const corMap = corMapCategorias(jogos);
  const inicioMin = hhmmToMin(dc.horaInicio) || 8*60;
  const step = cronogramaGridStep(ev);
  const fimGrade = Math.ceil(fimMin/step)*step;
  const linhas = [];
  for(let t = inicioMin; t < fimGrade; t += step) linhas.push(t);
  const head = [['Horário'].concat(Array.from({length:dc.quadras}, (_,i) => 'Quadra ' + (i+1)))];
  const body = linhas.map(t => {
    const row = [minToHHMM(t)];
    for(let i=0; i<dc.quadras; i++){
      const s = jogos.find(x => x.quadraIdx === i && t >= x.inicio && t < x.fim);
      row.push(s ? (s.categoria + ' · #' + s.gnum + ' ' + s.fase) : '');
    }
    return row;
  });
  return { head, body, corMap, quadras: dc.quadras };
}
// Mapa visual das quadras (Ed, 21/08/2026): pra cada quadra ativa naquele dia
// (mesma quantidade configurada no Cronograma de quadras), mostra o nome
// cadastrado no evento + a categoria jogando ali agora (ou a próxima, se
// ainda não começou), agrupadas por lado da arena (esquerda/direita — igual
// a foto que ele mandou de referência). Por padrão usa a MESMA grade que o
// Cronograma já calcula (gerarGradeDia) — mas o Ed relatou que "a ordem dos
// jogos e a disposição das categorias está errada", então cada quadra pode
// ser FIXADA manualmente numa categoria (📌), sobrepondo o cálculo
// automático só naquela quadra/dia — a opção de fixar só aparece pro
// organizador (readOnly=false); o público sempre vê o resultado final, só
// leitura.
function renderQuadraMapHtml(ev, dia, readOnly){
  const dc = getDiaConfig(ev, dia);
  if(!dc.quadras) return '';
  const items = categoriasOfDia(ev.id, dia);
  if(!items.length) return '';
  const evForCalc = Object.assign({}, ev, { duracaoPadrao: ev.duracaoPadrao||30, duracaoDecisiva: ev.duracaoDecisiva||40 });
  const { jogos } = gerarGradeDia(evForCalc, items, dc.quadras, dc.horaInicio);

  const inicioMin = hhmmToMin(dc.horaInicio) || 8*60;
  const hojeStr = new Date().toISOString().slice(0,10);
  let refMin;
  if(dia === hojeStr){
    const agora = new Date();
    refMin = agora.getHours()*60 + agora.getMinutes();
  } else {
    refMin = inicioMin;
  }

  const nomes = (ev.quadrasNomes || []).map(normQuadraNome);
  const overrides = dc.quadraCategoria || {};
  const boxes = [];
  for(let i=0; i<dc.quadras; i++){
    const q = nomes[i] || null;
    let cat = null, quando = null, manual = false;
    const overrideChaveId = overrides[i] || '';
    if(overrideChaveId){
      const overrideChave = getChave(overrideChaveId);
      if(overrideChave){ cat = overrideChave.nome; manual = true; }
    }
    if(!manual){
      const emAndamento = jogos.find(j => j.quadraIdx === i && refMin >= j.inicio && refMin < j.fim);
      if(emAndamento){ cat = emAndamento.categoria; quando = 'agora'; }
      else {
        const proximos = jogos.filter(j => j.quadraIdx === i && j.inicio >= refMin).sort((a,b) => a.inicio - b.inicio);
        if(proximos.length){ cat = proximos[0].categoria; quando = minToHHMM(proximos[0].inicio); }
      }
    }
    boxes.push({ idx:i, nome: q ? q.nome : ('Quadra ' + (i+1)), lado: q ? q.lado : 'esquerda', cat, quando, manual, overrideChaveId });
  }

  function selectHtml(b){
    if(readOnly) return '';
    const opts = items.map(({chave}) => `<option value="${chave.id}" ${b.overrideChaveId===chave.id ? 'selected' : ''}>${escapeHtml(chave.nome)}</option>`).join('');
    return `<select class="quadra-mapa-select" onchange="setQuadraMapaCategoria('${ev.id}','${dia}',${b.idx},this.value)">
      <option value="">Automático (conforme horário)</option>
      ${opts}
    </select>`;
  }

  function boxHtml(b){
    const catHtml = b.cat
      ? `<div class="quadra-mapa-cat">${b.manual ? '📌 ' : ''}${escapeHtml(b.cat)}</div>${(!b.manual && b.quando && b.quando!=='agora') ? `<div class="quadra-mapa-tempo">a partir das ${escapeHtml(b.quando)}</div>` : ''}`
      : `<div class="quadra-mapa-cat livre">Livre</div>`;
    return `<div class="quadra-mapa-box ${(b.quando==='agora'||b.manual) ? 'ocupada' : ''}">
      <div class="quadra-mapa-nome">🏐 ${escapeHtml(b.nome)}</div>
      ${catHtml}
      ${selectHtml(b)}
    </div>`;
  }

  const esquerda = boxes.filter(b => b.lado !== 'direita');
  const direita = boxes.filter(b => b.lado === 'direita');
  if(!esquerda.length && !direita.length) return '';

  return `<div class="card quadra-mapa-card">
    <div class="card-title">🗺️ Mapa das quadras${dia===hojeStr ? '' : ' <span class="hint" style="font-weight:500;">(prévia do dia)</span>'}</div>
    ${readOnly ? '' : '<div class="hint" style="margin-top:-4px; margin-bottom:8px;">Por padrão a quadra mostra a categoria calculada pelo Cronograma. Se a ordem estiver errada, escolha manualmente a categoria certa em cada quadra abaixo (📌 fixado).</div>'}
    <div class="quadra-mapa">
      <div class="quadra-mapa-lado">
        <div class="quadra-mapa-lado-label">Lado esquerdo</div>
        ${esquerda.length ? esquerda.map(boxHtml).join('') : '<div class="hint">Nenhuma quadra desse lado</div>'}
      </div>
      <div class="quadra-mapa-lado">
        <div class="quadra-mapa-lado-label">Lado direito</div>
        ${direita.length ? direita.map(boxHtml).join('') : '<div class="hint">Nenhuma quadra desse lado</div>'}
      </div>
    </div>
  </div>`;
}

// ---------- Visão Geral (ao vivo) ----------
// Ed (22/08/2026): "queria uma visão geral dos jogos que estão acontecendo e
// ao colocar como finalizado, automaticamente me dar o novo confronto para
// aquela categoria, respeitando a quadra". Diferença chave pro Mapa das
// Quadras acima: o mapa só mostra a CATEGORIA prevista pra cada quadra,
// calculada por ESTIMATIVA de horário (gerarGradeDia agenda os jogos de uma
// categoria do primeiro ao último, sem saber se algum já terminou de
// verdade). Esta tela troca a estimativa pelo ESTADO REAL — mostra o
// confronto (nomes das duplas) que realmente está pronto pra jogar em cada
// quadra agora, e assim que o placar é lançado ali mesmo, a quadra
// automaticamente passa a mostrar o PRÓXIMO confronto pronto daquela mesma
// categoria (a categoria continua "dona" da quadra do mesmo jeito que já
// funcionava no mapa — fixação manual 📌 ou estimativa de horário decidem
// qual categoria está em qual quadra; só o jogo específico exibido dentro
// dela vira tempo real).
function computeVisaoGeralBoxes(ev, dia){
  const dc = getDiaConfig(ev, dia);
  if(!dc.quadras) return [];
  const items = categoriasOfDia(ev.id, dia);
  if(!items.length) return [];
  const evForCalc = Object.assign({}, ev, { duracaoPadrao: ev.duracaoPadrao||30, duracaoDecisiva: ev.duracaoDecisiva||40 });
  const { jogos } = gerarGradeDia(evForCalc, items, dc.quadras, dc.horaInicio);

  const inicioMin = hhmmToMin(dc.horaInicio) || 8*60;
  const hojeStr = new Date().toISOString().slice(0,10);
  let refMin;
  if(dia === hojeStr){
    const agora = new Date();
    refMin = agora.getHours()*60 + agora.getMinutes();
  } else {
    refMin = inicioMin;
  }

  const nomes = (ev.quadrasNomes || []).map(normQuadraNome);
  const overrides = dc.quadraCategoria || {};

  // Qual categoria está "da vez" em cada quadra — mesma regra do Mapa das
  // Quadras (fixação manual 📌 primeiro, senão a estimativa de horário).
  const courtOf = [];
  for(let i=0; i<dc.quadras; i++){
    const overrideChaveId = overrides[i] || '';
    if(overrideChaveId){
      const oc = getChave(overrideChaveId);
      if(oc){ courtOf.push({ idx:i, chaveId: oc.id, chaveNome: oc.nome, manual:true }); continue; }
    }
    const emAndamento = jogos.find(j => j.quadraIdx === i && refMin >= j.inicio && refMin < j.fim);
    if(emAndamento){ courtOf.push({ idx:i, chaveId: emAndamento.chaveId, chaveNome: emAndamento.categoria, manual:false }); continue; }
    const proximos = jogos.filter(j => j.quadraIdx === i && j.inicio >= refMin).sort((a,b) => a.inicio - b.inicio);
    if(proximos.length){ courtOf.push({ idx:i, chaveId: proximos[0].chaveId, chaveNome: proximos[0].categoria, manual:false }); continue; }
    courtOf.push({ idx:i, chaveId:null, chaveNome:null, manual:false });
  }

  // Fila REAL (não estimada) de jogos prontos por categoria: times já
  // definidos, sem resultado ainda — prioriza quem já foi marcado "em
  // andamento" pelo organizador, depois segue em ordem de número.
  const filaPorCategoria = {};
  function filaDe(chaveId){
    if(filaPorCategoria[chaveId]) return filaPorCategoria[chaveId];
    const chave = getChave(chaveId);
    if(!chave){ filaPorCategoria[chaveId] = []; return []; }
    const prontos = effectiveGames(chave)
      .filter(g => !(chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot))
      .map(g => ({ g, info: matchInfo(chave, g) }))
      .filter(x => x.info.ready)
      .sort((x,y) => {
        const ax = (chave.andamento && chave.andamento[x.g.num]) ? 0 : 1;
        const ay = (chave.andamento && chave.andamento[y.g.num]) ? 0 : 1;
        if(ax !== ay) return ax - ay;
        return x.g.num - y.g.num;
      });
    filaPorCategoria[chaveId] = prontos;
    return prontos;
  }

  // Qual confronto cada quadra mostra usa o MESMO campo "🏐 Quadra" que já
  // aparece na lista de Confrontos de cada categoria (chave.quadras[gnum]) —
  // não uma atribuição paralela só desta tela. Ed (22/08/2026) relatou que a
  // Visão Geral "não segue a quadra que eu informei" e "não aceita a quadra
  // na lista confrontos": a primeira versão mantinha seu PRÓPRIO controle de
  // qual jogo está em qual quadra, então uma quadra já escolhida à mão na
  // lista de Confrontos não era respeitada aqui, e o inverso também — o jogo
  // que a Visão Geral escolhia sozinha não aparecia com quadra na lista.
  // Agora os dois lugares leem e escrevem o mesmo campo.
  const claimedNums = {}; // chaveId -> Set de gnums já reservados por alguma quadra nesta passada
  const chosenFor = {};   // idx -> item da fila escolhido pra essa quadra
  const activeCourtNames = new Set(courtOf.map(co => {
    const q = nomes[co.idx] || null;
    return q ? q.nome : ('Quadra ' + (co.idx+1));
  }));

  // Passada 1: toda quadra cujo nome JÁ está escrito no campo "quadra" de
  // algum jogo pronto daquela categoria (fixado à mão na lista de
  // Confrontos, ou herdado de uma rodada anterior desta própria tela) usa
  // esse jogo — reservado antes de qualquer escolha automática, pra nunca
  // ser "roubado" por outra quadra sem jogo ainda.
  courtOf.forEach(co => {
    const q = nomes[co.idx] || null;
    const nome = q ? q.nome : ('Quadra ' + (co.idx+1));
    if(!co.chaveId) return;
    const chave = getChave(co.chaveId);
    if(!chave) return;
    const fila = filaDe(co.chaveId);
    claimedNums[co.chaveId] = claimedNums[co.chaveId] || new Set();
    const match = fila.find(x => !claimedNums[co.chaveId].has(x.g.num) && ((chave.quadras||{})[x.g.num] || '').trim() === nome);
    if(match){ claimedNums[co.chaveId].add(match.g.num); chosenFor[co.idx] = match; }
  });

  // Passada 2: quadra sem jogo reservado ainda pega o próximo item livre da
  // fila que NÃO esteja preso numa quadra diferente (o organizador pode ter
  // marcado esse jogo pra outra quadra de propósito) — e ESCREVE o nome da
  // quadra nele, pra ficar igual na lista de Confrontos também.
  const toWrite = []; // {chave, gnum, nome}
  courtOf.forEach(co => {
    if(!co.chaveId || chosenFor[co.idx]) return;
    const chave = getChave(co.chaveId);
    if(!chave) return;
    const q = nomes[co.idx] || null;
    const nome = q ? q.nome : ('Quadra ' + (co.idx+1));
    const fila = filaDe(co.chaveId);
    claimedNums[co.chaveId] = claimedNums[co.chaveId] || new Set();
    const candidate = fila.find(x => {
      if(claimedNums[co.chaveId].has(x.g.num)) return false;
      const assigned = ((chave.quadras||{})[x.g.num] || '').trim();
      return !assigned || !activeCourtNames.has(assigned);
    });
    if(candidate){
      claimedNums[co.chaveId].add(candidate.g.num);
      chosenFor[co.idx] = candidate;
      toWrite.push({ chave, gnum: candidate.g.num, nome });
    }
  });
  if(toWrite.length){
    const chavesToSave = new Set();
    toWrite.forEach(w => { w.chave.quadras = Object.assign({}, w.chave.quadras, { [w.gnum]: w.nome }); chavesToSave.add(w.chave); });
    chavesToSave.forEach(c => updateChave(c));
  }

  return courtOf.map(co => {
    const q = nomes[co.idx] || null;
    const nome = q ? q.nome : ('Quadra ' + (co.idx+1));
    const lado = q ? q.lado : 'esquerda';
    if(!co.chaveId) return { idx:co.idx, nome, lado, chaveId:null, chaveNome:null, manual:false, game:null, state:'livre' };
    const chave = getChave(co.chaveId);
    if(!chave) return { idx:co.idx, nome, lado, chaveId:null, chaveNome:null, manual:false, game:null, state:'livre' };
    const chosen = chosenFor[co.idx];
    if(!chosen){
      const total = effectiveGames(chave).length;
      const done = effectiveGames(chave).filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
      const state = (total > 0 && done >= total) ? 'encerrada' : 'aguardando';
      return { idx:co.idx, nome, lado, chaveId:co.chaveId, chaveNome:co.chaveNome, manual:co.manual, game:null, state };
    }
    const g = chosen.g, info = chosen.info;
    const andamento = !!(chave.andamento && chave.andamento[g.num]);
    return {
      idx:co.idx, nome, lado, chaveId:co.chaveId, chaveNome:co.chaveNome, manual:co.manual,
      game: { num:g.num, fase:g.fase, A:info.A, B:info.B, andamento },
      state: 'live'
    };
  });
}

// Cada caixa nasce RECOLHIDA (só nomes + placar de status) — só expande pra
// mostrar o formulário de placar quando o organizador toca em "Lançar
// placar". Ed (22/08/2026): "ficou muito extenso, não dá pra ler direito"
// com todas as caixas já abertas com sets/confirmar/W.O. ao mesmo tempo.
let vgExpanded = {};
function toggleVgExpand(chaveId, gnum){
  const key = chaveId + '_' + gnum;
  vgExpanded[key] = !vgExpanded[key];
  route();
}
function visaoGeralBoxHtml(b, readOnly){
  const header = `<div class="quadra-mapa-nome">🏐 ${escapeHtml(b.nome)}</div>`;
  if(b.state === 'livre'){
    return `<div class="vg-box"><div class="vg-court">${header}<div class="quadra-mapa-cat livre">Livre</div></div></div>`;
  }
  const catLine = `<div class="vg-cat">${b.manual ? '📌 ' : ''}${escapeHtml(b.chaveNome)}</div>`;
  if(b.state !== 'live'){
    const msg = b.state === 'encerrada' ? '✅ Categoria encerrada' : '⏳ Aguardando o próximo confronto ficar pronto';
    return `<div class="vg-box"><div class="vg-court">${header}${catLine}</div><div class="hint" style="margin-top:6px;">${msg}</div></div>`;
  }
  const g = b.game;
  const chave = getChave(b.chaveId);
  const chip = chaveBadgeInfo(chave, g);
  const rowA = teamRow(g.A, false, null, false);
  const rowB = teamRow(g.B, false, null, false);
  const badge = g.andamento ? `<span class="match-badge live">● Em andamento</span>` : `<span class="match-badge ready">Próximo</span>`;
  const key = b.chaveId + '_' + g.num;
  const expanded = !readOnly && !!vgExpanded[key];
  let actions = '';
  if(!readOnly){
    actions = expanded
      ? `<button class="andamento-btn ${g.andamento?'on':''}" onclick="toggleAndamento('${b.chaveId}',${g.num})">${g.andamento ? '⏸ Encerrar' : '▶ Iniciar jogo'}</button>
         ${scoreEntryHtml(chave, { num:g.num, fase:g.fase })}
         <div class="vg-toggle-btn" onclick="toggleVgExpand('${b.chaveId}',${g.num})">▲ Recolher</div>`
      : `<div class="vg-toggle-btn primary" onclick="toggleVgExpand('${b.chaveId}',${g.num})">✓ Lançar placar</div>`;
  }
  return `<div class="vg-box ${g.andamento?'live':''}">
    <div class="vg-court">${header}${catLine}</div>
    <div class="vg-game">
      <div class="match-top">
        <span class="match-num">#${g.num}</span>
        <span class="chave-chip ${chip.cls}">${escapeHtml(chip.label)}</span>
        ${chip.round ? `<span class="match-round">R${chip.round}</span>` : ''}
        <span class="spacer"></span>
        ${badge}
      </div>
      ${teamsPairHtml(rowA, rowB)}
      ${actions}
    </div>
  </div>`;
}

function renderVisaoGeralGrid(ev, dia, readOnly){
  const boxes = computeVisaoGeralBoxes(ev, dia);
  if(!boxes.length){
    return `<div class="empty"><div class="big">🏐</div><div style="font-weight:700; font-size:16px; margin-bottom:4px;">Nada rolando ainda</div><div style="font-size:13.5px;">Configure as quadras e categorias desse dia pra ver o painel ao vivo aqui.</div></div>`;
  }
  const esquerda = boxes.filter(b => b.lado !== 'direita');
  const direita = boxes.filter(b => b.lado === 'direita');
  return `<div class="vg-wrap">
    <div class="vg-col">
      <div class="quadra-mapa-lado-label">Lado esquerdo</div>
      <div class="vg-grid">${esquerda.length ? esquerda.map(b => visaoGeralBoxHtml(b, readOnly)).join('') : '<div class="hint">Nenhuma quadra desse lado</div>'}</div>
    </div>
    <div class="vg-col">
      <div class="quadra-mapa-lado-label">Lado direito</div>
      <div class="vg-grid">${direita.length ? direita.map(b => visaoGeralBoxHtml(b, readOnly)).join('') : '<div class="hint">Nenhuma quadra desse lado</div>'}</div>
    </div>
  </div>`;
}

// ---------- Ranking de categorias isoladas, com pontuação (Ed, 24/08/2026)
// ---------- Só organizador (relatório interno, cobre TODOS os eventos já
// cadastrados). Passou por três ajustes até chegar aqui: 1) "separado por
// categoria" — cada categoria tem sua própria seção; 2) "por duplas, não
// atleta total" — quem aparece é a dupla, não a pessoa isolada; 3) "não
// quero que some nada. quero o ranking das categorias isoladas" — nada de
// somar pontos entre eventos: cada vez que a categoria rolou (em cada
// evento) mostra a classificação daquela edição, isolada das outras.
function classificacaoInstanciaHtml(inst){
  const c = inst.classificacao;
  if(!c.linhas.length){
    return `<div class="hint" style="margin-top:2px;">Categoria sem times cadastrados.</div>`;
  }
  const algumaDecidida = c.linhas.some(l => l.names.length);
  if(!algumaDecidida){
    return `<div class="hint" style="margin-top:2px;">${c.done === 0 ? 'Ainda não começou' : ('Em andamento · ' + c.done + '/' + c.total + ' jogos')} — a classificação aparece aqui conforme as colocações forem decididas.</div>`;
  }
  // Ed (18/09): "deixe os times separados, por mais que fiquem na mesma
  // posição, repete a posição e a pontuação, com lista" — cada dupla ganha
  // sua PRÓPRIA linha (mesmo empatada com outra no posLabel), em vez de
  // juntar os nomes empatados numa linha só separada por "•".
  const rows = c.linhas.filter(l => l.names.length).flatMap(l => l.names.map(name => `<div class="ra-row-static">
    <span class="ra-pos">${escapeHtml(l.posLabel)}</span>
    <span class="ra-name">${escapeHtml(name)}</span>
    <span class="ra-pontos">${l.pontos} pts</span>
  </div>`)).join('');
  const aindaFaltam = !c.concluded ? `<div class="hint" style="margin-top:4px;">Em andamento · ${c.done}/${c.total} jogos — o restante da classificação aparece conforme for sendo decidido.</div>` : '';
  return `<div class="ra-list">${rows}</div>${aindaFaltam}`;
}
function rankingCategoriasIsoladasHtml(){
  const grupos = computeRankingCategoriasIsoladas();
  if(!grupos.length){
    return `<div class="empty"><div class="big">🏅</div><div style="font-weight:700; font-size:16px; margin-bottom:4px;">Nenhuma categoria ainda</div><div style="font-size:13.5px;">A classificação de cada categoria aparece aqui conforme os eventos forem cadastrados e as colocações decididas.</div></div>`;
  }
  return grupos.map(g => `<div class="ra-cat-card">
    <div class="ra-cat-nome">${escapeHtml(g.categoriaNome)}</div>
    ${g.instancias.map(inst => `<div class="ra-instancia">
      <div class="ra-instancia-evento">${escapeHtml(inst.eventoNome)}</div>
      ${classificacaoInstanciaHtml(inst)}
    </div>`).join('')}
  </div>`).join('');
}
function exportRankingAtletasXlsx(){
  const grupos = computeRankingCategoriasIsoladas();
  if(!grupos.length){ toast('Nada pra exportar ainda'); return; }
  toast('Gerando planilha…');
  ensureXlsxLoaded().then(() => {
    const linhas = [];
    grupos.forEach(g => {
      g.instancias.forEach(inst => {
        inst.classificacao.linhas.forEach(l => {
          if(!l.names.length) return;
          l.names.forEach(name => {
            linhas.push({ 'Categoria': g.categoriaNome, 'Evento': inst.eventoNome, 'Colocação': l.posLabel, 'Pontos': l.pontos, 'Dupla': name });
          });
        });
      });
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Ranking');
    XLSX.writeFile(wb, 'ranking-categorias.xlsx');
  }).catch(() => toast('Não consegui gerar a planilha — confira sua internet'));
}
function renderRankingAtletasView(){
  app.innerHTML = `
    ${header('🏅 Ranking por categoria', 'Classificação de cada categoria, isolada', '/organizador')}
    <div class="wrap-chave">
      <div class="hint" style="margin-bottom:10px;">Uma seção pra cada categoria e, dentro dela, a classificação de cada vez que essa categoria rolou — sem somar pontos entre edições nem entre duplas diferentes.</div>
      <button class="btn accent" style="margin-bottom:14px; width:100%;" onclick="exportRankingAtletasXlsx()">📥 Baixar planilha (Excel)</button>
      <div class="ra-cat-list">
        ${rankingCategoriasIsoladasHtml()}
      </div>
    </div>`;
}

// ---------- Ranking público, estilo "campeonato" (Ed, 18/09 — telas
// inspiradas num app concorrente: cards de campeonato → categorias →
// classificação com medalhas). Fica em /pub/ranking (sem precisar logar,
// igual ao resto da área pública) — não substitui renderRankingAtletasView
// (que continua sendo a ferramenta de exportação do organizador, isolada por
// evento); esta aqui é a vitrine pro público/atleta, com pontos SOMADOS
// dentro de um mesmo campeonato (ver computeRankingCampeonato) e os eventos
// sem campeonato reunidos num bucket "Ranking Interno" isolado por etapa
// (mesmo comportamento de sempre — nada de soma aí).

// Calcula um tamanho de página sob medida pra tabela de um dia — em vez de
// forçar A4/Letter e deixar o autotable quebrar em várias páginas quando tem
// muita quadra ou muito horário, a página nasce do tamanho exato da tabela
// (fonte/coluna ajustadas pela quantidade de quadras), garantindo 1 página só
// — pedido do Ed ("encaixar o pdf em uma única página").
function cronogramaPdfLayout(t){
  const cols = t.head[0].length;
  const rows = t.body.length;
  let fontSize, cellPadding, horarioW, quadraW;
  if(cols <= 5){ fontSize = 9; cellPadding = 3.5; horarioW = 58; quadraW = 78; }
  else if(cols <= 8){ fontSize = 8; cellPadding = 3; horarioW = 52; quadraW = 68; }
  else if(cols <= 12){ fontSize = 7; cellPadding = 2.5; horarioW = 46; quadraW = 58; }
  else if(cols <= 16){ fontSize = 6; cellPadding = 2; horarioW = 42; quadraW = 48; }
  else { fontSize = 5.5; cellPadding = 1.5; horarioW = 38; quadraW = 40; }
  const quadraCols = Math.max(0, cols - 1);
  const tableW = horarioW + quadraCols * quadraW;
  const rowH = fontSize * 1.5 + cellPadding * 2;
  const headerH = fontSize * 1.6 + cellPadding * 2 + 2;
  const tableH = headerH + rows * rowH;
  const marginX = 24, topY = 58, marginBottom = 24;
  const pageW = Math.max(300, tableW + marginX * 2);
  const pageH = Math.max(200, topY + tableH + marginBottom);
  const colStyles = { 0: { cellWidth: horarioW } };
  for(let i=0; i<quadraCols; i++) colStyles[i+1] = { cellWidth: quadraW };
  return { fontSize, cellPadding, horarioW, quadraW, marginX, topY, pageW, pageH, colStyles };
}
// PDF no mesmo formato da grade em tela: horário nas linhas, quadra nas
// colunas, célula colorida por categoria com "categoria · #jogo fase" — igual
// ao modelo de planilha que o Ed já usa (a mesma célula repete o texto em
// cada linha que o jogo ocupa, já que autotable não tem rowspan nativo). A
// página é dimensionada sob medida (cronogramaPdfLayout) pra tudo caber numa
// página só, sem quebrar em várias.
function exportCronogramaPDF(eventoId, dia){
  const ev = getEvento(eventoId);
  if(!ev) return;
  toast('Gerando PDF…');
  ensureJsPdfLoaded().then(() => {
    const t = montarTabelaCronogramaDia(ev, eventoId, dia);
    if(!t){ toast('Nada pra exportar ainda'); return; }
    const { jsPDF } = window.jspdf;
    const L = cronogramaPdfLayout(t);
    const orientation = L.pageW >= L.pageH ? 'landscape' : 'portrait';
    const doc = new jsPDF({ orientation, unit:'pt', format:[L.pageW, L.pageH] });
    doc.setFontSize(14);
    doc.text(ev.nome + (ev.edicao ? (' — ' + ev.edicao) : ''), 30, 30);
    doc.setFontSize(10);
    doc.text('Cronograma de quadras • ' + formatDiaLabelFull(dia), 30, 46);
    doc.autoTable({
      startY: L.topY,
      head: t.head,
      body: t.body,
      // Corrigido 18/09: cronogramaPdfLayout calcula a altura da página
      // assumindo 1 linha por célula. Com overflow:'linebreak' um nome de
      // categoria longo numa coluna estreita (16+ quadras = colunas de
      // 40-48pt) quebra em 2-3 linhas e o autotable estoura a página que
      // calculamos, criando uma 2ª página silenciosa (sem título/data) —
      // justamente o que "encaixar numa página só" (pedido do Ed) queria
      // evitar. 'ellipsize' trunca com "…" em vez de quebrar linha, então a
      // altura real da linha nunca passa do rowH calculado.
      styles: { fontSize: L.fontSize, cellPadding: L.cellPadding, overflow:'ellipsize' },
      headStyles: { fillColor: [37,84,224] },
      columnStyles: L.colStyles,
      tableWidth: 'wrap',
      margin: { left: L.marginX, right: L.marginX },
      didParseCell: (data) => {
        if(data.section === 'body' && data.column.index > 0){
          const txt = String(data.cell.raw || '').split(' · ')[0];
          if(txt && t.corMap[txt]) data.cell.styles.fillColor = hexToRgb(t.corMap[txt][0]);
        }
      }
    });
    doc.save('cronograma-' + dia + '.pdf');
  }).catch(() => toast('Não consegui carregar o gerador de PDF — confira sua internet'));
}
// Junta todos os dias do evento num único PDF — cada dia numa página própria
// (doc.addPage antes de cada dia, sempre, não só "quando não cabe"), e cada
// página nasce do tamanho exato da tabela daquele dia (mesmo cálculo do PDF
// de um dia só) — pedido do Ed: "cada dia, em uma pagina dos pdf".
function exportCronogramaTodosDiasPDF(eventoId){
  const ev = getEvento(eventoId);
  if(!ev) return;
  const dias = diasOfEvento(ev);
  if(!dias.length){ toast('Esse evento não tem dias configurados'); return; }
  const tabelas = dias.map(dia => ({ dia, t: montarTabelaCronogramaDia(ev, eventoId, dia) })).filter(x => x.t);
  if(!tabelas.length){ toast('Nenhum dia com cronograma pra exportar ainda'); return; }
  toast('Gerando PDF…');
  ensureJsPdfLoaded().then(() => {
    const { jsPDF } = window.jspdf;
    let doc = null;
    tabelas.forEach((item, i) => {
      const dia = item.dia, t = item.t;
      const L = cronogramaPdfLayout(t);
      const orientation = L.pageW >= L.pageH ? 'landscape' : 'portrait';
      if(i === 0){
        doc = new jsPDF({ orientation, unit:'pt', format:[L.pageW, L.pageH] });
      } else {
        doc.addPage([L.pageW, L.pageH], orientation);
      }
      doc.setFontSize(14);
      doc.text(ev.nome + (ev.edicao ? (' — ' + ev.edicao) : ''), 30, 30);
      doc.setFontSize(10);
      doc.text('Cronograma de quadras • ' + formatDiaLabelFull(dia), 30, 46);
      doc.autoTable({
        startY: L.topY,
        head: t.head,
        body: t.body,
        // Mesma correção de 18/09 do exportCronogramaPDF (ver comentário lá):
        // 'ellipsize' garante 1 linha por célula, batendo com a altura de
        // página calculada por cronogramaPdfLayout — sem 2ª página surpresa.
        styles: { fontSize: L.fontSize, cellPadding: L.cellPadding, overflow:'ellipsize' },
        headStyles: { fillColor: [37,84,224] },
        columnStyles: L.colStyles,
        tableWidth: 'wrap',
        margin: { left: L.marginX, right: L.marginX },
        didParseCell: (data) => {
          if(data.section === 'body' && data.column.index > 0){
            const txt = String(data.cell.raw || '').split(' · ')[0];
            if(txt && t.corMap[txt]) data.cell.styles.fillColor = hexToRgb(t.corMap[txt][0]);
          }
        }
      });
    });
    doc.save('cronograma-' + (ev.nome||'evento').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-todos-os-dias.pdf');
  }).catch(() => toast('Não consegui carregar o gerador de PDF — confira sua internet'));
}
// Exporta a grade renderizada na tela como PNG (útil pra mandar direto no
// WhatsApp dos árbitros, sem precisar abrir um PDF) — via html2canvas,
// carregado sob demanda.
function exportCronogramaImagem(eventoId, dia){
  const el = document.getElementById('grade-table-' + cssId(dia));
  if(!el){ toast('Nada pra exportar ainda'); return; }
  toast('Gerando imagem…');
  ensureHtml2CanvasLoaded().then(() => {
    return window.html2canvas(el, { backgroundColor:'#ffffff', scale:2 });
  }).then(canvas => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'cronograma-' + dia + '.png';
    a.click();
  }).catch(() => toast('Não consegui gerar a imagem — confira sua internet'));
}

function saveSetup(editId){
  const s = setupState;
  const numTimes = s.times.length;
  if(!s.nome || !s.nome.trim()){ toast('Dê um nome para a categoria'); return; }
  if(!SIZES.includes(numTimes)){ toast('Ajuste o número de times para um tamanho de chave disponível'); return; }
  if(editId){
    const c = getChave(editId);
    c.nome = s.nome.trim();
    if(c.numTimes !== numTimes){
      // resize changes the bracket shape, so old results no longer line up
      c.numTimes = numTimes;
      c.resultados = {};
    }
    c.disputa3 = s.disputa3;
    c.formato = s.formato;
    c.formatoDecisivo = s.formatoDecisivo;
    c.idadeMin = (s.idadeMin!=null && s.idadeMin!=='') ? parseInt(s.idadeMin,10) : null;
    c.idadeMax = (s.idadeMax!=null && s.idadeMax!=='') ? parseInt(s.idadeMax,10) : null;
    c.times = s.times;
    updateChave(c);
    const existingCat = categoriaByChaveId(c.id);
    if(existingCat){ existingCat.horaInicio = s.horaInicio || null; updateCategoria(existingCat); }
    toast('Chave atualizada');
    location.hash = '/chave/' + c.id;
  } else {
    const c = {
      id: uid('c'),
      nome: s.nome.trim(),
      modalidade: s.modalidade,
      numTimes: numTimes,
      formato: s.formato,
      formatoDecisivo: s.formatoDecisivo,
      disputa3: s.disputa3,
      idadeMin: (s.idadeMin!=null && s.idadeMin!=='') ? parseInt(s.idadeMin,10) : null,
      idadeMax: (s.idadeMax!=null && s.idadeMax!=='') ? parseInt(s.idadeMax,10) : null,
      times: s.times,
      resultados: {},
      // Categorias novas nascem com o chaveamento ESCONDIDO do público até o
      // organizador clicar em "disponibilizar" (ver chaveamentoVisivel acima)
      // — categorias já existentes (sem esse campo) continuam visíveis.
      chaveamentoLiberado: false,
      // Idem pra inscrição pública (Ed, 18/09, 6ª rodada) — categoria nova
      // nasce FECHADA pra inscrição até o organizador abrir explicitamente
      // (definindo vagas e, se quiser, um prazo) na tela da chave; categorias
      // já existentes (sem esse campo) continuam abertas, sem regressão.
      // EXCEÇÃO (Ed, 21/09): quem escolhe o modo "abrir vagas pro público se
      // inscrever" já na criação está explicitamente autorizando a
      // inscrição ali mesmo — não faz sentido pedir de novo na tela
      // seguinte, então essa já nasce ABERTA. Modo "vou digitar/colar os
      // times agora" continua nascendo fechada, como sempre.
      inscricaoAberta: (s._modoTimes !== 'manual'), vagas: null, prazoInscricaoData: null, prazoInscricaoHora: null,
      criadoEm: Date.now()
    };
    updateChave(c);
    const ctx = s._categoriaCtx;
    if(ctx){
      const cat = { id:uid('cat'), eventoId:ctx.eventoId, data:ctx.data, chaveId:c.id, horaInicio: s.horaInicio || null, criadoEm:Date.now() };
      updateCategoria(cat);
    }
    setupState = null;
    toast('Categoria criada!');
    location.hash = '/chave/' + c.id;
  }
}

function categorySwitcherHtml(chaveId){
  const cat = categoriaByChaveId(chaveId);
  if(!cat) return '';
  const ev = getEvento(cat.eventoId);
  if(!ev) return '';
  const dias = diasOfEvento(ev);
  let optionsHtml = '';
  dias.forEach(dia => {
    const items = categoriasOfDia(ev.id, dia);
    if(!items.length) return;
    optionsHtml += `<optgroup label="${escapeHtml(formatDiaLabel(dia))}">`;
    items.forEach(({cat:c, chave:ch}) => {
      optionsHtml += `<option value="${ch.id}" ${ch.id===chaveId?'selected':''}>${escapeHtml(ch.nome)}</option>`;
    });
    optionsHtml += `</optgroup>`;
  });
  return `<div class="cat-switcher">
    <select onchange="location.hash='/chave/'+this.value">${optionsHtml}</select>
  </div>`;
}

let activeTab = {};
// Groups a num-ordered game list into CONTIGUOUS runs of the same fase
// string, instead of merging every game that ever shares a fase label into
// one bucket wherever it first appears. The official CBV-extracted tables
// (brackets.json, restored as authoritative for most 8-26 sizes on
// 16/08/2026) reuse a generic "GRUPO" fase label across many non-adjacent
// rounds (e.g. n=17: jogos 1-9 are GRUPO, jogo 10 is a different fase, then
// jogos 11-14 are GRUPO again) — grouping by first-appearance-of-fase pulled
// ALL of those into a single section at the top of the list, scrambling the
// real play order (jogo 10 ended up displayed after jogo 14 instead of
// between 9 and 11). Starting a new section every time the fase actually
// changes keeps the list in real .num order regardless of how many times a
// label like "GRUPO" gets reused further down the table.
function groupIntoContiguousFaseRuns(games){
  const runs = [];
  games.forEach(g => {
    const last = runs[runs.length - 1];
    if(last && last.fase === g.fase) last.arr.push(g);
    else runs.push({ fase: g.fase, arr: [g] });
  });
  return runs;
}

function renderChaveView(id){
  const chave = getChave(id);
  if(!chave){ location.hash='/organizador'; return; }
  const backHash = chaveBackHash(id);
  const switcher = categorySwitcherHtml(id);
  const _cat = categoriaByChaveId(id);
  const logoUrl = _cat ? (getEvento(_cat.eventoId)||{}).logoUrl : null;
  const games = effectiveGames(chave);
  const total = games.length;
  const done = games.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
  const pct = Math.round((done/total)*100);

  // group by phase, preserving first-appearance order.
  // Group-phase games (grupo A/B/...) are pulled into one combined list in
  // .num order (already alternated between groups, see _interleave_grupo_games
  // in the build script) instead of separate per-group sections — this shows
  // organizers the real play order (Grupo A jogo 1, Grupo B jogo 2, Grupo A
  // jogo 3, ...) with each card's own group chip, rather than every Grupo A
  // game bunched above every Grupo B game.
  const groupGames = [];
  const nonGroupGames = [];
  games.forEach(g => { (g.grupo ? groupGames : nonGroupGames).push(g); });
  const runs = groupIntoContiguousFaseRuns(nonGroupGames);

  if(activeTab[id] === undefined) activeTab[id] = 'todas';
  const tab = activeTab[id];
  const fullRanking = computeFullRanking(chave);

  const rankingLink = `<div class="ranking-link" onclick="setTab('${id}','__ranking__')">🏁 Ver ranking final</div>`;
  // Card de "disponibilizar chaveamento" (Ed, 18/09) — só aparece enquanto
  // a categoria nasceu escondida e o organizador ainda não divulgou. Fica
  // junto do topActions pra aparecer em toda aba (lista/árvore/atletas/ranking).
  const disponibilizarCard = !chaveamentoVisivel(chave) ? (() => {
    const ev = _cat ? getEvento(_cat.eventoId) : null;
    const temCampeonato = !!(ev && (ev.campeonato||'').trim());
    // Já tinha sido sorteado/disponibilizado antes e foi ocultado de novo —
    // o botão principal reaparece SEM re-sortear (mantém a ordem e os
    // placares já lançados); sorteio/ranking do zero fica só como opção
    // secundária, pra quem realmente quer recomeçar a semeadura.
    if(chave.chaveamentoJaSorteado){
      return `<div class="card" style="border:2px dashed var(--primary); background:#eef4ff; margin-bottom:12px;">
        <div class="card-title">🔒 Chaveamento oculto no momento</div>
        <div class="hint" style="margin-top:-2px;">O público e os atletas só veem a lista de inscritos até você disponibilizar de novo. A ordem dos times de antes está guardada.</div>
        <button class="btn accent small" style="margin-top:8px; width:100%;" onclick="mostrarChaveamentoNovamente('${chave.id}')">🔓 Disponibilizar de novo (mantém a ordem)</button>
        <div class="hint" style="margin-top:8px; margin-bottom:-4px;">Ou recomeçar a ordem do zero:</div>
        <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
          <button class="btn ghost small" style="flex:1;" onclick="confirmDisponibilizarChaveamento('${chave.id}','sorteio')">🎲 Sortear de novo</button>
          <button class="btn ghost small" style="flex:1;" ${temCampeonato?'':'disabled'} onclick="confirmDisponibilizarChaveamento('${chave.id}','ranking')">🏆 Ranking da etapa de novo</button>
        </div>
      </div>`;
    }
    return `<div class="card" style="border:2px dashed var(--primary); background:#eef4ff; margin-bottom:12px;">
      <div class="card-title">🔒 Chaveamento ainda não divulgado</div>
      <div class="hint" style="margin-top:-2px;">O público e os atletas só veem a lista de inscritos até você disponibilizar. Escolha como definir a ordem dos times (R1, R2...):</div>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
        <button class="btn accent small" style="flex:1;" onclick="confirmDisponibilizarChaveamento('${chave.id}','sorteio')">🎲 Sorteio</button>
        <button class="btn accent small" style="flex:1;" ${temCampeonato?'':'disabled'} onclick="confirmDisponibilizarChaveamento('${chave.id}','ranking')">🏆 Ranking da etapa</button>
      </div>
      ${!temCampeonato ? `<div class="hint" style="margin-top:6px;">"Ranking da etapa" precisa que o evento tenha um campeonato/circuito definido (edite o evento).</div>` : ''}
    </div>`;
  })() : `<div class="card" style="margin-bottom:12px;">
    <div class="hint" style="margin-top:-2px;">🔓 Chaveamento disponibilizado — o público já vê confrontos e árvore.</div>
    <button class="btn ghost small" style="margin-top:6px;" onclick="confirmOcultarChaveamento('${chave.id}')">🔒 Ocultar chaveamento de novo</button>
  </div>`;
  // Card de inscrição pública desta categoria (Ed, 18/09, 6ª rodada) —
  // interruptor aberta/fechada + vagas (separado do tamanho da chave) +
  // prazo (data/hora, separado dos lotes de preço do evento). Preço em si
  // continua vindo do evento (precoInscricao/lotes), sem mudança aqui.
  // Ed, 21/09: "está ficando duas informações" — vagas já foi escolhida na
  // criação da categoria, então esse card não pergunta de novo por padrão;
  // só mostra o resumo, com um link "Ajustar" pra quem realmente precisa
  // mudar (reorganizar, dar mais vagas, mudar prazo).
  const inscricaoConfigCard = (() => {
    const aberta = chave.inscricaoAberta !== false;
    const vagasAtual = vagasDaCategoria(chave);
    const inscritos = (chave.times||[]).filter(t => teamRowHasData(t, chave.modalidade)).length;
    const prazoTxt = chave.prazoInscricaoData ? ` • Prazo: ${formatDateLong(chave.prazoInscricaoData)}${chave.prazoInscricaoHora?(' às '+chave.prazoInscricaoHora):''}` : '';
    const resumo = `<div class="hint" style="margin-top:-2px;">${aberta ? `✅ Aberta — ${inscritos}/${vagasAtual} vagas preenchidas` : '🚫 Fechada'}${prazoTxt}</div>`;
    if(!inscricaoConfigAjustando[chave.id]){
      return `<div class="card">
        <div class="card-title">📝 Inscrição pública desta categoria</div>
        ${resumo}
        <button class="btn ghost small" style="margin-top:6px;" onclick="toggleInscricaoConfigAjuste('${chave.id}')">✏️ Ajustar vagas/prazo</button>
      </div>`;
    }
    return `<div class="card">
      <div class="card-title">📝 Inscrição pública desta categoria</div>
      ${resumo}
      <label>Vagas (até ${chave.numTimes}, o tamanho da chave)</label>
      <input type="number" min="1" max="${chave.numTimes}" id="inscVagas_${chave.id}" value="${vagasAtual}">
      <label>Prazo pra inscrever (opcional, separado do preço)</label>
      <div style="display:flex; gap:6px;">
        <input type="date" id="inscPrazoData_${chave.id}" value="${chave.prazoInscricaoData||''}">
        <input type="time" id="inscPrazoHora_${chave.id}" value="${chave.prazoInscricaoHora||''}">
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn ${aberta?'ghost':'accent'} small" style="flex:1;" onclick="salvarInscricaoConfig('${chave.id}', ${!aberta})">${aberta?'🚫 Fechar inscrição':'✅ Abrir inscrição'}</button>
        <button class="btn secondary small" style="flex:1;" onclick="toggleInscricaoConfigAjuste('${chave.id}')">Concluir</button>
      </div>
    </div>`;
  })();
  // Editar duplas / Zerar placares — movidos pro topo da tela a pedido do Ed
  // (antes ficavam lá embaixo, depois de rolar toda a lista de jogos ou a
  // árvore inteira).
  const topActions = `${disponibilizarCard}${inscricaoConfigCard}<div class="footer-actions" style="margin-bottom:12px;">
    <button class="btn secondary" onclick="location.hash='/editar/${chave.id}'">Editar ${modalidadePlural(chave.modalidade)}</button>
    <button class="btn ghost" onclick="resetResults('${chave.id}')">Zerar placares</button>
  </div>`;

  // Ed, 21/09: enquanto não tiver pelo menos 2 times de verdade E o
  // chaveamento ainda não foi divulgado, o organizador vê só a lista de
  // inscritos (igual o público) em vez de Confrontos/Árvore cheios de
  // posições vazias tipo "Rank 1 x Rank 2" — evita a sensação de "já tem os
  // confrontos meio que definidos" quando na real ainda não tem ninguém
  // inscrito. Uma vez com 2+ times reais, os tabs voltam a aparecer
  // normalmente (mesmo antes de divulgar pro público), pra quem já quer
  // organizar/pré-visualizar a chave.
  const realTeamsCount = (chave.times||[]).filter(t => teamRowHasData(t, chave.modalidade)).length;
  if(!chaveamentoVisivel(chave) && realTeamsCount < 2){
    // Ed, 21/09 (2ª rodada): a opção de já colocar a lista de times na mão
    // (colar lista, importar planilha, digitar um por um) precisa aparecer
    // CLARO aqui — não só escondida atrás do botão genérico "Editar duplas"
    // lá em cima. As duas formas de preencher a categoria ficam lado a lado:
    // inserir a lista agora, ou esperar as inscrições públicas.
    const inserirListaCard = `<div class="card" style="margin-top:12px;">
      <div class="card-title">✍️ Já tem a lista de times?</div>
      <div class="hint" style="margin-top:-2px;">Cole a lista de uma vez, importe uma planilha ou digite time por time — depois é só lançar os jogos e o ranking normalmente. Ou, se preferir, não faça nada aqui: os times vão entrando sozinhos conforme as inscrições públicas forem aprovadas.</div>
      <button class="btn accent small" style="margin-top:8px; width:100%;" onclick="location.hash='/editar/${chave.id}'">📋 Inserir lista de times agora</button>
    </div>`;
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (modalidadePlural(chave.modalidade)) + ' • dupla eliminatória', backHash, switcher, logoUrl)}
      <div class="wrap-chave">
        ${topActions}
        ${listaInscritosCardHtml(chave)}
        ${inserirListaCard}
      </div>`;
    return;
  }

  if(tab === '__ranking__'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (modalidadePlural(chave.modalidade)) + ' • dupla eliminatória', backHash, `
        ${switcher}
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      `, logoUrl)}
      <div class="wrap-chave">
        ${topActions}
        <div class="ranking-link" onclick="setTab('${id}','todas')">⬅ Voltar à lista de jogos</div>
        ${renderFinalRankingView(chave, fullRanking, total, done)}
      </div>`;
    return;
  }

  const viewToggle = viewToggleHtml(id, false);

  if(getViewMode() === 'atletas'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (modalidadePlural(chave.modalidade)) + ' • dupla eliminatória', backHash, `
        ${switcher}
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      `, logoUrl)}
      <div class="wrap-chave">
        ${topActions}
        ${viewToggle}
        ${renderAtletasListHtml(chave)}
      </div>`;
    return;
  }

  if(getViewMode() === 'arvore'){
    app.innerHTML = `
      ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (modalidadePlural(chave.modalidade)) + ' • dupla eliminatória', backHash, `
        ${switcher}
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      `, logoUrl)}
      <div class="wrap-chave">
        ${topActions}
        ${viewToggle}
        ${treeSectionHtml(chave, false)}
      </div>`;
    setTimeout(setupTreePanZoom, 0);
    return;
  }

  const standings = computeStandings(chave);
  const podium = standings.length ? `<div class="podium">
    <h3>🏆 Classificação (parcial)</h3>
    ${standings.map(r=>`<div class="podium-row"><div class="pos ${r.cls}">${r.pos}</div><div class="name">${escapeHtml(r.name)}</div></div>`).join('')}
  </div>` : '';

  const groupCard = renderGroupCard(chave, false);

  const groupSection = groupGames.length ? (() => {
    const doneCount = groupGames.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
    return `<div class="phase-section">
      <div class="phase-title"><span>Fase de grupos</span><span class="count">${doneCount}/${groupGames.length}</span></div>
      ${groupGames.map(g => renderMatchCard(chave, g)).join('')}
    </div>`;
  })() : '';

  const isNovo = treeModeFor(chave) === 'novo';
  const sections = groupSection + runs.map(run => {
    const arr = run.arr;
    const doneCount = arr.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
    const kindTag = isNovo ? `<span class="cv-tag ${cvKindOf(run.fase)}">${cvKindOf(run.fase)==='wb'?'Vencedores':cvKindOf(run.fase)==='lb'?'Repescagem':'Fase final'}</span>` : '';
    return `<div class="phase-section ${isNovo?'chaveador-novo':''}">
      <div class="phase-title"><span>${phaseLabel(run.fase)}</span>${kindTag}<span class="count">${doneCount}/${arr.length}</span></div>
      ${arr.map(g => renderMatchCard(chave, g)).join('')}
    </div>`;
  }).join('');

  app.innerHTML = `
    ${header(escapeHtml(chave.nome), chave.numTimes + ' ' + (modalidadePlural(chave.modalidade)) + ' • dupla eliminatória', backHash, `
      ${switcher}
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    `, logoUrl)}
    <div class="wrap-chave">
      ${topActions}
      ${viewToggle}
      ${rankingLink}
      ${podium}
      ${groupCard}
      ${sections}
    </div>`;
}

function renderFinalRankingView(chave, ranking, total, done){
  const decidedCount = ranking.filter(r => !r.pending).length;
  const hasDataQuirk = ranking.some(r => r.dataQuirk);
  const allDecided = decidedCount === ranking.length;
  return `<div class="card">
    <div style="font-weight:800;font-size:14px;color:#8a5a12;margin-bottom:2px;">🏁 Classificação ${allDecided ? 'final' : '(atualiza conforme as duplas são eliminadas)'}</div>
    <div class="hint" style="margin-bottom:10px;">${decidedCount} de ${ranking.length} posições definidas · ${done} de ${total} jogos concluídos</div>
    ${ranking.map(r => r.pending ? `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
      <div style="min-width:44px;font-weight:800;font-size:13px;color:var(--muted2);">${r.posLabel}</div>
      <div style="flex:1;font-style:italic;font-size:13.5px;color:var(--muted2);">${r.dataQuirk ? (r.altName ? escapeHtml(r.altName) + ' — posição não determinada' : 'não determinado pela tabela original') : 'ainda em disputa'}</div>
    </div>` : `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
      <div style="min-width:44px;font-weight:800;font-size:13px;color:var(--primary-dark);">${r.posLabel}</div>
      <div style="flex:1;font-weight:600;font-size:14.5px;">${escapeHtml(r.name)}</div>
      ${r.tied ? '<span style="font-size:10.5px;color:var(--muted2);background:#f1eee2;padding:2px 6px;border-radius:6px;">empate</span>' : ''}
    </div>`).join('')}
    <div class="hint" style="margin-top:8px;">Posições empatadas não têm confronto direto na chave para desempate adicional.${hasDataQuirk ? ' Uma posição não pôde ser determinada com precisão pela tabela original desse tamanho de chave.' : ''}</div>
  </div>`;
}
function groupNamesOf(numTimes){
  const games = BRACKETS[numTimes];
  const set = new Set();
  games.forEach(g => { if(g.grupo) set.add(g.grupo); });
  return Array.from(set).sort();
}
// Critério de desempate (Ed, 21/08/2026): 1º saldo de vitórias, 2º average
// de pontos, 3º confronto direto — nessa ordem, mostrados na tabela. O
// organizador pode ajustar manualmente a ordem com ▲/▼ (readOnly=false),
// pra casos que os critérios automáticos não resolvem do jeito que ele quer;
// a tela pública só mostra o resultado, sem os controles.
function renderGroupCard(chave, readOnly){
  const names = groupNamesOf(chave.numTimes);
  if(names.length === 0) return '';
  const single = names.length === 1;
  return `<div class="card">
    <div style="font-weight:800;font-size:13px;color:var(--primary-dark);margin-bottom:8px;">
      ${single ? 'Classificação' : 'Classificação dos grupos'}
      <span style="font-weight:500;color:var(--muted2);font-size:11.5px;">(critérios: saldo de vitórias → average → confronto direto)</span>
    </div>
    ${names.map(n => groupTableHtml(chave, single ? null : n, groupStandings(chave, n), readOnly)).join('')}
    ${readOnly ? '' : '<div class="hint">Use ▲/▼ pra ajustar manualmente a ordem quando os critérios automáticos não bastarem.</div>'}
  </div>`;
}
function groupTableHtml(chave, name, st, readOnly){
  const title = name ? ('Grupo ' + name) : 'Fase de grupos';
  const grpKey = name || 'UNICO';
  return `<div style="margin-bottom:10px;">
    <div style="font-size:12px;font-weight:700;color:var(--muted2);margin-bottom:4px;display:flex;align-items:center;gap:8px;">
      <span>${title} ${st.complete ? '' : ('· parcial (' + st.played + '/' + st.totalGames + ' jogos)')}</span>
      ${st.overridden ? `<span class="standings-manual-tag">✋ ajustado manualmente</span>` : ''}
      ${(st.overridden && !readOnly) ? `<span class="standings-reset-link" onclick="resetStandingsOverride('${chave.id}','${grpKey}')">voltar ao automático</span>` : ''}
    </div>
    ${st.rows.map((r,i)=>`<div class="standings-row">
       <span style="font-weight:600;">${i+1}º ${escapeHtml(r.label)}</span>
       <span class="standings-stats">${r.vitorias}v · ${r.feitos}/${r.sofridos} · ${r.average===Infinity ? '∞' : r.average.toFixed(2)}</span>
       ${readOnly ? '' : `<span class="standings-actions">
         <button class="qmove" title="Subir" ${i===0?'disabled':''} onclick="moveStandingsRow('${chave.id}','${grpKey}',${i},-1)">▲</button>
         <button class="qmove" title="Descer" ${i===st.rows.length-1?'disabled':''} onclick="moveStandingsRow('${chave.id}','${grpKey}',${i},1)">▼</button>
       </span>`}
    </div>`).join('')}
  </div>`;
}
function setTab(id, f){ activeTab[id] = f; renderChaveView(id); }

// Compares two match results for "is this actually a different outcome"
// (ignores bookkeeping fields like lastEditedBy/lastEditedAt).
function resultadosIguais(a, b){
  if(!a || !b) return a === b;
  if(!!a.wo !== !!b.wo) return false;
  if(a.vencedorSlot !== b.vencedorSlot) return false;
  const sa = a.sets || [], sb = b.sets || [];
  if(sa.length !== sb.length) return false;
  return sa.every((s,i) => String(s[0])===String(sb[i][0]) && String(s[1])===String(sb[i][1]));
}
// Writes ONE game's result through a Firestore transaction instead of a
// blind full-chave overwrite. This is what makes it safe for 3-4
// organizadores to lançar placar at the same time: two different games in
// the same chave never clobber each other (the transaction reads-modifies-
// writes just the resultados map, retried automatically by Firestore if
// another write lands in between), and if the SAME jogo already has a
// different result from someone else, we ask before overwriting instead of
// silently replacing it. The same check runs again if this was queued while
// offline and only reaches the server later, so a stale offline edit can't
// quietly clobber a newer one either.
function salvarResultado(chaveId, gnum, novoResultado, opts){
  const force = !!(opts && opts.force);
  const ref = fbDb.collection('chaves').doc(chaveId);
  const localChave = getChave(chaveId);
  const localBackup = localChave ? Object.assign({}, localChave.resultados) : {};

  if(localChave){
    localChave.resultados = Object.assign({}, localChave.resultados, { [gnum]: novoResultado });
    clearAndamento(localChave, gnum); // um jogo com resultado não é mais "em andamento"
    // route() (não renderChaveView direto) porque esse mesmo placar pode
    // estar sendo lançado de outra tela que não a da chave — a Visão Geral
    // (22/08/2026) mostra e edita o placar de um jogo específico ali mesmo,
    // sem navegar pra dentro da categoria; route() sempre re-renderiza
    // qualquer tela que estiver aberta no momento, sem precisar saber qual é.
    route();
  }

  return fbDb.runTransaction(tx => tx.get(ref).then(snap => {
    if(!snap.exists) throw new Error('CHAVE_SUMIU');
    const data = snap.data();
    const resultados = Object.assign({}, data.resultados || {});
    // existing comes straight off the server document — still in the
    // Firestore-safe {a,b} wire shape, not the [a,b] tuples resultadosIguais
    // expects — normalize before comparing.
    const existing = resultados[gnum] ? Object.assign({}, resultados[gnum], { sets: setsFromFirestore(resultados[gnum].sets) }) : resultados[gnum];
    if(existing && existing.vencedorSlot && !force && !resultadosIguais(existing, novoResultado)){
      const err = new Error('CONFLICT');
      err.existing = existing;
      throw err;
    }
    resultados[gnum] = resultadoToFirestore(Object.assign({}, novoResultado, {
      lastEditedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null,
      lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
    }));
    const update = { resultados };
    if(data.andamento && data.andamento[gnum]) update['andamento.'+gnum] = firebase.firestore.FieldValue.delete();
    tx.update(ref, update);
  })).catch(err => {
    if(err && err.message === 'CONFLICT'){
      if(localChave){ localChave.resultados = localBackup; route(); }
      const quem = err.existing.lastEditedBy || 'outra pessoa';
      if(confirm(`Esse jogo já foi lançado por ${quem}. Sobrescrever com o novo placar?`)){
        return salvarResultado(chaveId, gnum, novoResultado, { force:true });
      }
      return;
    }
    if(err && err.message === 'CHAVE_SUMIU'){
      toast('Essa chave não existe mais');
      return;
    }
    // Any other failure — a network blip, a temporarily unreachable server,
    // etc. A transação can't be queued for offline retry: Firestore
    // transactions need a live round trip and simply fail outright the
    // instant the connection hiccups, even for a couple of seconds (this is
    // documented Firestore behavior, not a bug on our side) — confirmed as
    // the actual cause of the 15/08/2026 incidente, where placares looked
    // saved on-screen (the optimistic local update above) but never reached
    // the server, and the old message here ("vai sincronizar sozinho")
    // wasn't true for this case, since nothing had been queued anywhere.
    // Falling back to a plain field update instead DOES get queued by the
    // SDK's own offline persistence and resolves itself once the connection
    // is back — no extra retry loop needed on our side. This fallback skips
    // the same-jogo conflict check (a rare simultaneous-edit collision is a
    // much smaller risk than losing the placar outright).
    console.error('salvarResultado (transação falhou, tentando gravação direta)', err);
    return salvarResultadoDireto(chaveId, gnum, novoResultado, localChave, localBackup);
  });
}

function salvarResultadoDireto(chaveId, gnum, novoResultado, localChave, localBackup){
  const ref = fbDb.collection('chaves').doc(chaveId);
  const update = {};
  update['resultados.' + gnum] = resultadoToFirestore(Object.assign({}, novoResultado, {
    lastEditedBy: (fbAuth.currentUser && fbAuth.currentUser.email) || null,
    lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
  }));
  update['andamento.' + gnum] = firebase.firestore.FieldValue.delete();
  markSyncPending(1);
  return ref.update(update).then(() => {
    markSyncPending(-1);
  }).catch(err => {
    markSyncPending(-1);
    console.error('salvarResultadoDireto', err);
    // permission-denied/unauthenticated are PERMANENT — they will never
    // resolve on their own (no amount of waiting fixes a login problem), so
    // undo the optimistic update instead of leaving a placar on screen that
    // was never actually saved anywhere, and say so plainly.
    if(err && (err.code === 'permission-denied' || err.code === 'unauthenticated')){
      if(localChave){ localChave.resultados = localBackup; route(); }
      toast('Sem permissão pra salvar — faça login de novo');
      return;
    }
    toast('Ainda sem conexão com o servidor — vai tentar de novo sozinho em segundo plano');
  });
}

function resetResults(id){
  if(!confirm('Zerar todos os placares desta chave? Os nomes das duplas serão mantidos.')) return;
  const c = getChave(id);
  if(c) c.resultados = {};
  fbDb.collection('chaves').doc(id).update({ resultados: {} }).catch(err => {
    console.error('resetResults', err);
    toast('Não deu pra zerar agora — vai sincronizar quando a internet voltar');
  });
  renderChaveView(id);
  toast('Placares zerados');
}

// Short label used inside the fase chip on a match card — distinct from
// phaseLabel() (which is the longer text used as a section header elsewhere).
function shortPhaseChip(f){
  if(f === 'GP ÚNICO' || f === 'GRUPO') return 'Grupo';
  if(f === 'Grupo A' || f === 'Grupo B') return f;
  if(f === 'S/Final') return 'Semifinal';
  if(f === 'Semifinais da chave') return 'Semifinal (chave)';
  if(f === 'Semifinais cruzadas') return 'Semifinal cruzada';
  if(/^Rodada \d+$/.test(f)) return f.replace('Rodada', 'R.');
  if(/^LB Rodada \d+$/.test(f)) return 'Rep. ' + f.replace('LB Rodada', 'R.');
  if(/^Repescagem (\d+)$/.test(f)) return f.replace('Repescagem', 'Rep.');
  return f; // "3º/4º", "Final", "5º/6º", "9º/12º", "Preliminar", "Oitavas", etc. are already short
}

// The colored "chave" chip (Principal / Repescagem) + round text, shown on
// every match card. Only bracket sizes whose winners/losers lineages meet
// exactly once (see computeBracketMeta) get the true Principal/Repescagem
// classification; everything else (round-robin group sizes, and the CBV-table
// sizes with several placement crossovers) shows a neutral chip with the
// game's real fase name instead, which is more informative for those anyway.
function chaveBadgeInfo(chave, g){
  // Destaque (pedido do Ed, 18/09): Final e 3º lugar (chaveamento novo,
  // N=8-30) ganham um chip dourado próprio na lista de jogos, em vez do
  // chip neutro cinza que os outros jogos da fase final recebem.
  if(cvIsDestaque(g.fase)) return { label: (g.fase === 'Final' ? '🏆 Final' : '🥉 3º lugar'), cls:'destaque', round:null };
  const bm = computeBracketMeta(chave.numTimes);
  const info = bm.meta[g.num];
  if(bm.isClean && info){
    if(info.bracket === 'principal') return { label:'Principal', cls:'principal', round:info.round };
    if(info.bracket === 'repescagem') return { label:'Repescagem', cls:'repescagem', round:info.round };
    return { label:'Final', cls:'principal', round:info.round };
  }
  return { label: shortPhaseChip(g.fase), cls:'neutral', round: (info && !bm.isClean && bm.hasRepescagem) ? info.round : null };
}

// Single display value for a team's score pill: the set score directly for a
// single-set match, or the count of sets won for melhor-de-3 (with the
// set-by-set breakdown still available via the "editar" link below the card).
function scorePillValue(res, slot){
  if(!res || !res.vencedorSlot || res.wo) return null;
  const sets = res.sets || [];
  if(sets.length === 0) return null;
  if(sets.length === 1){
    const s = sets[0];
    return slot === 'a' ? s[0] : s[1];
  }
  let winsA = 0, winsB = 0;
  sets.forEach(s => { const a = Number(s[0])||0, b = Number(s[1])||0; if(a>b) winsA++; else if(b>a) winsB++; });
  return slot === 'a' ? winsA : winsB;
}

// ---------- Espinha de peixe (árvore) ----------
// Small tag shown above each tree box telling you where the two teams came
// from: "V7" = winner of jogo 7, "P7" = loser of jogo 7, "R3" = seed/rank 3,
// "A1" = 1º do Grupo A.
function originTag(ref){
  if(typeof ref === 'string'){
    const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
