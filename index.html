// ---------- Atletas / Inscrições (inscrição de atletas pelo site, 18/09) ----------
// Duas coleções novas no Firestore: "atletas" (perfil de cada atleta, doc id
// = uid do Firebase Auth dele) e "inscricoes" (uma por categoria escolhida,
// status pendente/aprovada/rejeitada). NÃO reaproveitam attachLiveListeners()
// porque as regras de segurança do Firestore são bem diferentes das outras 4
// coleções (chaves/eventos/categorias/config são só-organizador; essas duas
// aqui têm que dar pro ATLETA ler/escrever só os PRÓPRIOS dados):
//  - o perfil do atleta é um GET direto por uid (nunca um onSnapshot da
//    coleção inteira) — assim a regra "só pode ler o PRÓPRIO doc" nunca
//    precisa decidir o que fazer com uma query sem filtro;
//  - a lista de inscrições do próprio atleta usa where('atletaUid','==',uid),
//    não a coleção sem filtro — mesmo motivo;
//  - só o organizador (ver isOrganizador()) assina a coleção inteira das
//    duas, pra revisar a fila de pendentes com o perfil de quem se inscreveu.
// Ver HANDOFF_se7_chaveamento.md pro texto exato das regras que isso exige.
let _meuAtletaPerfil = null;
// Pra onde mandar o atleta DEPOIS de logar/cadastrar quando ele chegou no
// login vindo de um link "quero me inscrever nesse evento" (Ed, 18/09:
// "as inscrições devem aparecer dentro do evento, você colocou fora") — sem
// isso, todo login caía sempre em /atleta/home (lista genérica de todos os
// eventos), perdendo o contexto de QUAL evento a pessoa queria. Consumido
// uma vez só (ver route()) e depois limpo, pra não "grudar" num login futuro.
let _posLoginRedirectHash = null;
let _minhasInscricoesCache = [];
let _minhasInscricoesUnsub = null;
let _atletasCache = [];
let _inscricoesCache = [];
let _orgInscricoesUnsubs = [];
function getMeuAtletaPerfil(){ return _meuAtletaPerfil; }
// Roda pra QUALQUER login (organizador OU atleta) — é o próprio resultado
// dessa busca que decide o papel (ver isOrganizador()/isAtletaLogado() lá
// em cima): existe doc -> atleta; não existe -> organizador. Só depois de
// _roleChecked=true é que route() sabe pra onde mandar.
function carregarMeuAtletaPerfil(){
  if(!_authUser) return;
  fbDb.collection('atletas').doc(_authUser.uid).get().then(doc => {
    _meuAtletaPerfil = doc.exists ? Object.assign({ uid: doc.id }, doc.data()) : null;
    _roleChecked = true;
    if(isOrganizador()) attachOrganizadorInscricoesListeners();
    else attachMinhasInscricoesListener();
    route();
  }).catch(err => {
    console.error('carregarMeuAtletaPerfil', err);
    _roleChecked = true; // não trava a tela num "carregando" pra sempre por falha de rede
    route();
  });
}
function updateMeuAtletaPerfil(data){
  if(!_authUser) return Promise.reject(new Error('sem usuário logado'));
  const perfil = Object.assign({ uid: _authUser.uid, email: _authUser.email }, data);
  _meuAtletaPerfil = perfil;
  return fbDb.collection('atletas').doc(_authUser.uid).set(perfil, { merge:true });
}
function attachMinhasInscricoesListener(){
  if(!_authUser || _minhasInscricoesUnsub) return;
  _minhasInscricoesUnsub = fbDb.collection('inscricoes').where('atletaUid','==',_authUser.uid).onSnapshot(snap => {
    _minhasInscricoesCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('minhasInscricoes onSnapshot', err));
}
// Listener de TODOS os atletas cadastrados — independente do papel (usado
// pelo organizador pra revisar inscrições/CTs, e também pelo atleta comum na
// tela de inscrição pra buscar o parceiro pelo CPF, ver buscarParceiroPorCpf
// mais abaixo). Um único unsub compartilhado (não duplica se já ligado).
let _atletasUnsub = null;
function attachAtletasListener(){
  if(_atletasUnsub) return;
  _atletasUnsub = fbDb.collection('atletas').onSnapshot(snap => {
    _atletasCache = snap.docs.map(d => Object.assign({ uid: d.id }, d.data()));
    route();
  }, err => console.error('atletas onSnapshot', err));
}
function attachOrganizadorInscricoesListeners(){
  attachAtletasListener();
  if(_orgInscricoesUnsubs.length) return;
  _orgInscricoesUnsubs.push(fbDb.collection('inscricoes').onSnapshot(snap => {
    _inscricoesCache = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    route();
  }, err => console.error('inscricoes onSnapshot', err)));
}
// Limpa todo estado de atleta/organizador ligado à sessão anterior — chamado
// no logout pra uma conta nova que logue no MESMO navegador depois nunca ver
// (nem por um instante) dado de quem saiu.
function limparEstadoAuthPessoal(){
  _meuAtletaPerfil = null;
  _roleChecked = false;
  _minhasInscricoesCache = [];
  if(_minhasInscricoesUnsub){ try{ _minhasInscricoesUnsub(); }catch(e){} _minhasInscricoesUnsub = null; }
  if(_atletasUnsub){ try{ _atletasUnsub(); }catch(e){} _atletasUnsub = null; }
  _atletasCache = [];
  _inscricoesCache = [];
  _orgInscricoesUnsubs.forEach(unsub => { try{ unsub(); }catch(e){} });
  _orgInscricoesUnsubs = [];
}
function getAtletaByUidOrg(uid){ return _atletasCache.find(a => a.uid === uid); }
// ---------- Catálogo de CTs (Ed, 18/09) ----------
// Só os CONFIRMADOS entram no autocomplete do cadastro — os pendentes ainda
// não foram revisados pelo organizador, então não devem parecer "oficiais"
// pra quem está se cadastrando (mas continuam valendo pro atleta que já
// digitou, até serem confirmados/renomeados/rejeitados).
function listaCtsConfirmados(){
  return _ctsCache.filter(c => !c.pendente).map(c => c.nome)
    .sort((a,b) => a.localeCompare(b, 'pt-BR', { sensitivity:'base' }));
}
function listaCtsPendentes(){
  return _ctsCache.filter(c => c.pendente).sort((a,b) => a.criadoEm - b.criadoEm);
}
// Chamado sempre que um atleta digita um CT no cadastro (ou o organizador
// aprova uma inscrição com um CT novo) — se já existe um CT com esse nome
// (comparação normalizada, ignora acento/caixa), não faz nada; senão cria
// um registro PENDENTE pra revisão posterior (nunca cria duplicado, nunca
// bloqueia o cadastro do atleta esperando essa revisão).
function garantirCtCadastrado(nomeCt){
  const nome = (nomeCt||'').trim();
  if(!nome) return;
  const jaExiste = _ctsCache.some(c => normPersonName(c.nome) === normPersonName(nome));
  if(jaExiste) return;
  const doc = { id: uid('ct'), nome, pendente:true, criadoEm: Date.now() };
  _ctsCache.push(doc);
  const wireData = Object.assign({}, doc);
  delete wireData.id;
  fbDb.collection('cts').doc(doc.id).set(wireData).catch(err => console.error('garantirCtCadastrado', err));
}
// Confirma um CT pendente do jeito que está (sem renomear).
function confirmarCt(id){
  const ct = _ctsCache.find(c => c.id === id);
  if(!ct) return;
  ct.pendente = false;
  fbDb.collection('cts').doc(id).update({ pendente:false }).catch(err => console.error('confirmarCt', err));
  toast('CT "' + ct.nome + '" confirmado');
}
// Confirma renomeando pro nome "canônico" certo — além de corrigir o próprio
// registro do CT, atualiza também o campo ct de qualquer atleta que já
// tenha usado o nome antigo (unifica de fato, que era o pedido do Ed:
// "cadastramos previamente os CTs para unificar as informações").
function renomearEConfirmarCt(id, novoNome){
  const ct = _ctsCache.find(c => c.id === id);
  const nome = (novoNome||'').trim();
  if(!ct || !nome) return;
  const nomeAntigoNorm = normPersonName(ct.nome);
  ct.nome = nome; ct.pendente = false;
  fbDb.collection('cts').doc(id).update({ nome, pendente:false }).catch(err => console.error('renomearEConfirmarCt', err));
  _atletasCache.filter(a => normPersonName(a.ct||'') === nomeAntigoNorm).forEach(a => {
    a.ct = nome;
    fbDb.collection('atletas').doc(a.uid).update({ ct: nome }).catch(err => console.error('renomearEConfirmarCt/atleta', err));
  });
  toast('CT confirmado como "' + nome + '"');
}
function rejeitarCt(id){
  if(!confirm('Excluir esse CT da lista pendente?')) return;
  _ctsCache = _ctsCache.filter(c => c.id !== id);
  fbDb.collection('cts').doc(id).delete().catch(err => console.error('rejeitarCt', err));
  toast('CT excluído');
}
// Cadastro DIRETO de um CT pelo organizador (Ed, 21/09: "onde eu coloco
// essa lista, onde eu preencho e onde elas aparecerão... eu vi que tem CTs
// pendentes, mas onde eu faço o registro dos CTs") — diferente de
// garantirCtCadastrado() (chamado quando um ATLETA digita um CT novo no
// próprio cadastro, que sempre entra PENDENTE pra revisão), esse aqui é o
// organizador cadastrando de próprio punho, então já entra CONFIRMADO
// direto, sem passar pela fila.
let ctCadastroErro = '';
function cadastrarCtDireto(){
  const input = document.getElementById('ctNovoNome');
  const nome = (input && input.value || '').trim();
  if(!nome){ ctCadastroErro = 'Digite o nome do CT'; renderCtsPendentesView(); return; }
  const jaExiste = _ctsCache.some(c => normPersonName(c.nome) === normPersonName(nome));
  if(jaExiste){ ctCadastroErro = 'Já existe um CT com esse nome'; renderCtsPendentesView(); return; }
  const doc = { id: uid('ct'), nome, pendente:false, criadoEm: Date.now() };
  _ctsCache.push(doc);
  const wireData = Object.assign({}, doc);
  delete wireData.id;
  fbDb.collection('cts').doc(doc.id).set(wireData).catch(err => console.error('cadastrarCtDireto', err));
  ctCadastroErro = '';
  toast('CT "' + nome + '" cadastrado');
  renderCtsPendentesView();
}
function excluirCtConfirmado(id){
  const ct = _ctsCache.find(c => c.id === id);
  if(!ct) return;
  if(!confirm('Excluir o CT "' + ct.nome + '" da lista? Atletas que já usam esse nome não mudam sozinhos.')) return;
  _ctsCache = _ctsCache.filter(c => c.id !== id);
  fbDb.collection('cts').doc(id).delete().catch(err => console.error('excluirCtConfirmado', err));
  toast('CT excluído');
  renderCtsPendentesView();
}
function renderCtsPendentesView(){
  const pendentes = listaCtsPendentes();
  const confirmados = _ctsCache.filter(c => !c.pendente).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity:'base' }));
  const pendRows = pendentes.map(c => `<div class="card">
    <div style="font-weight:800; font-size:15.5px;">${escapeHtml(c.nome)}</div>
    <div class="hint">Cadastrado por um atleta em ${new Date(c.criadoEm).toLocaleDateString('pt-BR')}</div>
    <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
      <input type="text" value="${escapeHtmlAttr(c.nome)}" id="ctRenomear_${c.id}" style="flex:1; min-width:120px;">
      <button class="btn accent small" onclick="renomearEConfirmarCt('${c.id}', document.getElementById('ctRenomear_${c.id}').value)">✅ Confirmar</button>
      <button class="btn ghost small" onclick="rejeitarCt('${c.id}')">✕ Excluir</button>
    </div>
  </div>`).join('');
  const confirmadosRows = confirmados.map(c => `<div class="card" style="padding:10px 12px; display:flex; align-items:center; gap:8px;">
    <div style="flex:1; font-weight:700;">${escapeHtml(c.nome)}</div>
    <button class="btn ghost small" style="width:auto; padding:5px 10px;" onclick="excluirCtConfirmado('${c.id}')">✕</button>
  </div>`).join('');
  app.innerHTML = `
    ${header('Centros de treinamento', confirmados.length + ' cadastrados' + (pendentes.length ? (' • ' + pendentes.length + ' pendente'+(pendentes.length===1?'':'s')) : ''), '/organizador')}
    <div class="wrap">
      <div class="card">
        <div class="card-title">➕ Cadastrar novo CT</div>
        <div class="hint">Cadastre aqui direto — já entra confirmado na lista, pronto pra aparecer no cadastro dos atletas.</div>
        <div style="display:flex; gap:6px; margin-top:8px;">
          <input type="text" id="ctNovoNome" placeholder="Nome do centro de treinamento" style="flex:1;">
          <button class="btn accent small" style="width:auto; padding:0 16px;" onclick="cadastrarCtDireto()">Cadastrar</button>
        </div>
        ${ctCadastroErro ? `<div class="hint" style="color:#c65b4a; margin-top:6px;">${escapeHtml(ctCadastroErro)}</div>` : ''}
      </div>
      ${pendentes.length ? `<div class="card-title" style="margin:14px 2px 6px;">⏳ Pendentes de revisão</div>${pendRows}` : ''}
      <div class="card-title" style="margin:14px 2px 6px;">✅ Confirmados (${confirmados.length})</div>
      ${confirmadosRows || '<div class="empty"><div class="big">🏢</div><div style="font-weight:700;">Nenhum CT cadastrado ainda</div></div>'}
    </div>`;
}
function getInscricao(id){ return _inscricoesCache.find(i => i.id === id) || _minhasInscricoesCache.find(i => i.id === id); }
// Otimista igual updateChave/updateEvento/updateCategoria — o atleta vê a
// própria inscrição na hora, sem esperar o round-trip do Firestore (mesmo
// raciocínio do wifi de praia mencionado em enablePersistence acima).
function criarInscricao(data){
  const insc = Object.assign({ id: uid('insc'), status:'pendente', criadoEm: Date.now() }, data);
  _minhasInscricoesCache.push(insc);
  const wireData = Object.assign({}, insc);
  delete wireData.id;
  return fbDb.collection('inscricoes').doc(insc.id).set(wireData).then(() => insc);
}
function updateInscricaoStatus(id, status, extra){
  const patch = Object.assign({ status }, extra || {});
  const idxOrg = _inscricoesCache.findIndex(i => i.id === id);
  if(idxOrg >= 0) _inscricoesCache[idxOrg] = Object.assign({}, _inscricoesCache[idxOrg], patch);
  const idxMinhas = _minhasInscricoesCache.findIndex(i => i.id === id);
  if(idxMinhas >= 0) _minhasInscricoesCache[idxMinhas] = Object.assign({}, _minhasInscricoesCache[idxMinhas], patch);
  fbDb.collection('inscricoes').doc(id).update(patch).catch(err => {
    console.error('updateInscricaoStatus', err);
    toast('Não deu pra salvar agora — vai sincronizar quando a internet voltar');
  });
}
// Contagem de inscrições que já "contam" pra 1ª/2ª+ do atleta neste evento
// (pendente ou aprovada — uma rejeitada não conta, o atleta pode tentar de
// novo do zero nessa mesma categoria ou noutra sem pagar preço de "2ª+").
function contarInscricoesAtivasNoEvento(inscricoes, eventoId){
  return inscricoes.filter(i => i.eventoId === eventoId && i.status !== 'rejeitada').length;
}
// Ordem alfabética (PT-BR, ignorando maiúscula/acento) dentro do mesmo dia —
// pedido do Ed pra ficar mais fácil de achar a categoria na grade.
function byNomeChave(a, b){
  return a.chave.nome.localeCompare(b.chave.nome, 'pt-BR', { sensitivity:'base' });
}
function categoriasOfDia(eventoId, data){
  return loadCategorias().filter(c => c.eventoId === eventoId && c.data === data)
    .map(c => ({ cat:c, chave:getChave(c.chaveId) }))
    .filter(x => x.chave)
    .sort(byNomeChave);
}
// Todas as categorias do evento, atravessando os dias — usado na grade de
// categorias da página pública (arevo mostra tudo junto, sem separar por dia).
// Ordenado por dia do evento (cronológico, "YYYY-MM-DD" já ordena certo como
// string) e, dentro do mesmo dia, alfabeticamente pelo nome da categoria.
function categoriasOfEvento(eventoId){
  return loadCategorias().filter(c => c.eventoId === eventoId)
    .map(c => ({ cat:c, chave:getChave(c.chaveId) }))
    .filter(x => x.chave)
    .sort((a,b) => (a.cat.data < b.cat.data ? -1 : a.cat.data > b.cat.data ? 1 : 0) || byNomeChave(a,b));
}
// Status do evento como um todo (badge na página pública), derivado do
// progresso agregado de todas as categorias — não temos inscrição pelo site,
// então "Aberto" (como no arevo) não se aplica; usamos o mesmo vocabulário de
// status já usado nas chaves (Programado / Em andamento / Concluído).
function eventoStatusInfo(ev){
  const items = categoriasOfEvento(ev.id);
  if(!items.length) return { label:'Programado', cls:'status-pending' };
  let anyStarted = false, allDone = true;
  items.forEach(({chave}) => {
    const st = chaveStatus(chave);
    if(st.done > 0) anyStarted = true;
    if(!st.concluded) allDone = false;
  });
  if(allDone) return { label:'Concluído', cls:'status-done' };
  if(anyStarted) return { label:'Em andamento', cls:'status-live' };
  return { label:'Programado', cls:'status-pending' };
}
// Status of a chave's games, used for the at-a-glance badges in both UIs.
function chaveStatus(chave){
  const games = effectiveGames(chave);
  const total = games.length;
  const done = games.filter(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot).length;
  // "Concluída" is based on every game having a result, not on the ranking having
  // zero pending rows — a handful of bracket sizes carry a harmless "não determinado"
  // placeholder row from the source data (flagged dataQuirk) that would otherwise
  // keep the status stuck on "Em andamento" forever even once every match is played.
  const concluded = total > 0 && done === total;
  let label, cls;
  if(done === 0){ label = 'Não iniciada'; cls = 'status-pending'; }
  else if(concluded){ label = 'Concluída'; cls = 'status-done'; }
  else { label = 'Em andamento'; cls = 'status-live'; }
  return { total, done, concluded, label, cls };
}
// Where the back button / breadcrumb from a chave should go: back to its evento
// and day if it belongs to one, otherwise to the organizador home.
function chaveBackHash(chaveId){
  const cat = categoriaByChaveId(chaveId);
  if(cat) return '/evento/' + cat.eventoId + '/' + cat.data;
  return '/organizador';
}

// ---------- quadra + status do jogo (próximo / em andamento / finalizado) ----------
// "quadra" (which court) and "andamento" (organizer manually marking a game as
// currently being played) both live as small num->value maps on the chave doc,
// same pattern as .resultados — cheap to add without a schema migration.
function setQuadra(chaveId, gnum, valor){
  const chave = getChave(chaveId);
  if(!chave) return;
  chave.quadras = Object.assign({}, chave.quadras);
  const v = (valor||'').trim();
  if(v) chave.quadras[gnum] = v; else delete chave.quadras[gnum];
  updateChave(chave);
  // Feedback imediato pra deixar claro que o número foi salvo — o campo é
  // só o número agora (a palavra "Quadra" já vem fixa no rótulo), e o Ed
  // relatou não ter certeza se isso estava confirmando/salvando de fato.
  toast(v ? ('Quadra ' + v + ' salva') : 'Quadra removida');
}
function toggleAndamento(chaveId, gnum){
  const chave = getChave(chaveId);
  if(!chave) return;
  chave.andamento = Object.assign({}, chave.andamento);
  if(chave.andamento[gnum]) delete chave.andamento[gnum]; else chave.andamento[gnum] = true;
  updateChave(chave);
  // route() dá feedback imediato (sem esperar o onSnapshot do Firestore ir e
  // voltar) — importa mais agora que a Visão Geral (22/08/2026) usa "em
  // andamento" pra decidir qual jogo mostrar primeiro numa quadra.
  route();
}
// Clears the manual "em andamento" flag once a jogo gets a resultado — a
// finished game shouldn't keep showing as "em andamento".
function clearAndamento(chave, gnum){
  if(chave.andamento && chave.andamento[gnum]){
    chave.andamento = Object.assign({}, chave.andamento);
    delete chave.andamento[gnum];
  }
}
// Single source of truth for the 4-state badge shown on both the organizador
// and público match cards: finalizado (tem resultado) > em andamento (marcado
// manualmente pelo organizador) > próximo (os dois times já são conhecidos,
// pronto pra jogar) > aguardando (ainda depende de outro jogo).
function matchStatus(chave, g, info, res){
  const done = !!(res && res.vencedorSlot);
  if(done) return { key:'finalizado', label:'Finalizado', cls:'done' };
  if(chave.andamento && chave.andamento[g.num]) return { key:'andamento', label:'● Em andamento', cls:'live' };
  if(info.ready) return { key:'proximo', label:'Próximo', cls:'ready' };
  return { key:'aguardando', label:'Aguardando', cls:'wait' };
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// Persistent (does NOT auto-hide) counter of placares still waiting on a
// server ack — see salvarResultadoDireto(). Unlike toast(), this stays up
// for as long as it's true, so it can't quietly disappear while still
// actually unsynced (see incidente 15/08/2026).
let _syncPendingCount = 0;
function markSyncPending(delta){
  _syncPendingCount = Math.max(0, _syncPendingCount + delta);
  const el = document.getElementById('syncBanner');
  if(!el) return;
  if(_syncPendingCount > 0){
    el.textContent = _syncPendingCount === 1
      ? '🔄 1 placar aguardando confirmação do servidor — não feche o navegador'
      : ('🔄 ' + _syncPendingCount + ' placares aguardando confirmação do servidor — não feche o navegador');
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// ---------- team modality (dupla / trio / quarteto) ----------
// 'trio' e 'quarteto' guardam o time como { nome, atletas:[...], ct } (nome
// do time + lista de nomes, com N vagas conforme a modalidade); 'dupla'
// guarda como { nome, atleta1, atleta2, ct } (dois campos fixos). Os helpers
// abaixo centralizam essa diferença estrutural num só lugar — foi assim que
// "trio" entrou como modalidade nova (Ed, 21/09) sem duplicar de novo toda
// a lógica que já existia pra dupla/quarteto espalhada pelo arquivo.
function usaListaAtletas(modalidade){ return modalidade === 'quarteto' || modalidade === 'trio'; }
function modalidadeAtletasSlots(modalidade){ return modalidade === 'quarteto' ? 6 : modalidade === 'trio' ? 3 : 0; }
function modalidadeNominal(modalidade){ return modalidade === 'quarteto' ? 4 : modalidade === 'trio' ? 3 : 2; }
function modalidadeParceirosCount(modalidade){ return modalidade === 'quarteto' ? 3 : modalidade === 'trio' ? 2 : 1; }
function modalidadePlural(modalidade){ return modalidade === 'quarteto' ? 'quartetos' : modalidade === 'trio' ? 'trios' : 'duplas'; }
function modalidadePluralCap(modalidade){ return modalidade === 'quarteto' ? 'Quartetos' : modalidade === 'trio' ? 'Trios' : 'Duplas'; }
function modalidadeSingularCap(modalidade){ return modalidade === 'quarteto' ? 'Quarteto' : modalidade === 'trio' ? 'Trio' : 'Dupla'; }
function emptyTeam(modalidade){
  const slots = modalidadeAtletasSlots(modalidade);
  return slots ? { nome:'', atletas:Array(slots).fill(''), ct:'' } : { nome:'', atleta1:'', atleta2:'', ct:'' };
}
// Returns the display label for team at index idx, or null if not filled in yet.
function teamLabel(chave, idx){
  const t = chave.times[idx];
  if(!t) return null;
  if(typeof t === 'string') return t.trim() ? t.trim() : null; // legacy format safety net
  if(usaListaAtletas(chave.modalidade)){
    return (t.nome && t.nome.trim()) ? t.nome.trim() : null;
  }
  // Dupla também pode ter nome de time (Ed, 21/09: "precisa ser inserido o
  // nome do time" na inscrição) — prefere o nome quando existir, mas cai
  // pro "Fulana / Sicrana" de sempre pra times antigos sem nome.
  if(t.nome && t.nome.trim()) return t.nome.trim();
  const a1 = (t.atleta1||'').trim(), a2 = (t.atleta2||'').trim();
  if(a1 && a2) return a1 + ' / ' + a2;
  if(a1) return a1;
  if(a2) return a2;
  return null;
}

// ---------- bracket resolution ----------
function resolveTeam(chave, ref){
  // ref: number (rank), "Venc J N" / "Perd J N", or {grp,pos} (group standing)
  if(typeof ref === 'number'){
    const label = teamLabel(chave, ref-1);
    return { label: label || ('Rank ' + ref), resolved: !!label, teamKey: 'R'+ref };
  }
  if(ref && typeof ref === 'object' && ref.grp){
    const st = groupStandings(chave, ref.grp);
    if(!st.complete){
      // Placeholder pra qualquer posição do grupo (1º, 2º, 3º, 4º...), não só
      // 1º/2º — categorias de 4/5 duplas alimentam a disputa de 3º/4º direto
      // da classificação do grupo (pos 3 e 4), e com o texto fixo em "2º" os
      // dois lados apareciam como "2º do Grupo" mesmo sendo 3º x 4º.
      const single = groupNamesOf(chave.numTimes).length === 1;
      return { label: ordinal(ref.pos) + (single ? ' do grupo' : (' do Grupo ' + ref.grp)), resolved:false, teamKey:null };
    }
    const row = st.rows[ref.pos-1];
    if(!row) return { label:'?', resolved:false, teamKey:null };
    return { label: row.label, resolved:true, teamKey:'R'+row.rank };
  }
  const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
  if(!m) return { label: String(ref), resolved:false, teamKey:null };
  const kind = m[1]; const gnum = parseInt(m[2],10);
  const res = chave.resultados[gnum];
  if(!res || !res.vencedorSlot){
    return { label: (kind==='Venc' ? 'Vencedor Jogo ' : 'Perdedor Jogo ') + gnum, resolved:false, teamKey:null };
  }
  const games = BRACKETS[chave.numTimes];
  const g = games.find(x => x.num === gnum);
  const winnerRef = res.vencedorSlot === 'a' ? g.a : g.b;
  const loserRef  = res.vencedorSlot === 'a' ? g.b : g.a;
  return resolveTeam(chave, kind === 'Venc' ? winnerRef : loserRef);
}

// ---------- group-stage standings (average de pontos) ----------
function groupGames(numTimes, grp){
  return BRACKETS[numTimes].filter(g => g.grupo === grp);
}
function groupRanks(numTimes, grp){
  const games = groupGames(numTimes, grp);
  const set = new Set();
  games.forEach(g=>{ if(typeof g.a==='number') set.add(g.a); if(typeof g.b==='number') set.add(g.b); });
  return Array.from(set).sort((x,y)=>x-y);
}
// Critério de desempate pedido pelo Ed (21/08/2026), nessa ordem: 1º saldo
// de vitórias, 2º average de pontos, 3º confronto direto (só entra quando os
// dois primeiros empatam OS DOIS — confronto direto de um par específico não
// tem como decidir empate de 3+ duplas de uma vez, então é aplicado par a
// par dentro do sort, que é o comportamento padrão pra chave de grupo único
// pequena como essa). "Feitos" total continua como 4º critério de
// segurança, só pra nunca deixar a ordem indefinida (sort estável).
function groupStandings(chave, grp){
  const games = groupGames(chave.numTimes, grp);
  const ranks = groupRanks(chave.numTimes, grp);
  const stats = {};
  ranks.forEach(r => stats[r] = { rank:r, feitos:0, sofridos:0, jogos:0, vitorias:0, label: resolveTeam(chave, r).label });
  // headToHead[a][b] = 'a' ou 'b' — quem venceu o confronto direto entre as
  // duas duplas de rank a e b (se já jogaram).
  const headToHead = {};
  let playedCount = 0;
  games.forEach(g=>{
    const res = chave.resultados[g.num];
    if(!res || !res.vencedorSlot) return;
    playedCount++;
    let fa=0, fb=0;
    (res.sets||[]).forEach(s=>{ fa+=s[0]; fb+=s[1]; });
    stats[g.a].feitos += fa; stats[g.a].sofridos += fb; stats[g.a].jogos++;
    stats[g.b].feitos += fb; stats[g.b].sofridos += fa; stats[g.b].jogos++;
    if(res.vencedorSlot === 'a') stats[g.a].vitorias++; else stats[g.b].vitorias++;
    headToHead[g.a] = headToHead[g.a] || {};
    headToHead[g.b] = headToHead[g.b] || {};
    headToHead[g.a][g.b] = res.vencedorSlot === 'a' ? g.a : g.b;
    headToHead[g.b][g.a] = headToHead[g.a][g.b];
  });
  const arr = ranks.map(r=>{
    const s = stats[r];
    const average = s.sofridos>0 ? s.feitos/s.sofridos : (s.feitos>0 ? Infinity : 0);
    return Object.assign({}, s, { average });
  });
  arr.sort((x,y)=>{
    if(y.vitorias !== x.vitorias) return y.vitorias - x.vitorias;
    if(y.average !== x.average) return y.average - x.average;
    const h2h = headToHead[x.rank] && headToHead[x.rank][y.rank];
    if(h2h) return h2h === x.rank ? -1 : 1;
    if(y.feitos !== x.feitos) return y.feitos - x.feitos;
    return 0;
  });

  // Ajuste manual (Ed, 21/08/2026: "deixe editável para contagem dos
  // pontos") — organizador pode reordenar a classificação calculada quando
  // o critério automático não resolve do jeito que ele precisa. Guardado
  // como a lista de ranks na ordem final desejada; só é aplicado se cobrir
  // exatamente o mesmo conjunto de duplas do grupo (protege contra ficar
  // "preso" numa ordem velha depois de editar duplas/trocar o grupo).
  const overrideOrder = chave.standingsOverride && chave.standingsOverride[grp];
  let overridden = false;
  let finalArr = arr;
  if(overrideOrder && overrideOrder.length === arr.length && overrideOrder.every(r => stats[r])){
    const byRank = {}; arr.forEach(row => { byRank[row.rank] = row; });
    finalArr = overrideOrder.map(r => byRank[r]);
    overridden = true;
  }

  return { rows: finalArr, complete: playedCount === games.length, totalGames: games.length, played: playedCount, overridden };
}
// Move uma dupla pra cima/baixo na classificação (ajuste manual) — grava a
// ordem inteira do grupo como override, a partir da ordem ATUALMENTE exibida
// (que já pode ser um override anterior).
function moveStandingsRow(chaveId, grp, idx, dir){
  const chave = getChave(chaveId);
  if(!chave) return;
  const st = groupStandings(chave, grp);
  const order = st.rows.map(r => r.rank);
  const j = idx + dir;
  if(j < 0 || j >= order.length) return;
  const tmp = order[j]; order[j] = order[idx]; order[idx] = tmp;
  chave.standingsOverride = Object.assign({}, chave.standingsOverride, { [grp]: order });
  updateChave(chave);
}
function resetStandingsOverride(chaveId, grp){
  const chave = getChave(chaveId);
  if(!chave || !chave.standingsOverride) return;
  const novo = Object.assign({}, chave.standingsOverride);
  delete novo[grp];
  chave.standingsOverride = novo;
  updateChave(chave);
  toast('Classificação voltou a ser calculada automaticamente');
}

function matchInfo(chave, g){
  const A = resolveTeam(chave, g.a);
  const B = resolveTeam(chave, g.b);
  const res = chave.resultados[g.num] || null;
  return { A, B, res, ready: A.resolved && B.resolved };
}

// ---------- score logic ----------
function setWinner(scoreA, scoreB){
  const a = parseInt(scoreA,10), b = parseInt(scoreB,10);
  if(isNaN(a) || isNaN(b) || a === b) return null;
  return a > b ? 'a' : 'b';
}
function computeMatchWinner(formato, sets){
  // sets: [[a,b], ...]
  if(formato === 'unico'){
    if(sets.length < 1) return null;
    return setWinner(sets[0][0], sets[0][1]);
  }
  // melhorDe3
  let wa=0, wb=0;
  for(const s of sets){
    const w = setWinner(s[0], s[1]);
    if(w === 'a') wa++; else if(w === 'b') wb++;
  }
  if(wa >= 2) return 'a';
  if(wb >= 2) return 'b';
  return null;
}

// ---------- standings ----------
function computeStandings(chave){
  const games = effectiveGames(chave);
  const byFase = {};
  games.forEach(g => { (byFase[g.fase] = byFase[g.fase] || []).push(g); });
  const rows = [];
  function decided(fase){
    const arr = byFase[fase];
    if(!arr || arr.length !== 1) return null;
    const g = arr[0];
    const res = chave.resultados[g.num];
    if(!res || !res.vencedorSlot) return null;
    const info = matchInfo(chave, g);
    return { winner: res.vencedorSlot==='a'?info.A:info.B, loser: res.vencedorSlot==='a'?info.B:info.A };
  }
  const final = decided('Final');
  if(final){
    rows.push({pos:'1º', cls:'p1', name: final.winner.label});
    rows.push({pos:'2º', cls:'p2', name: final.loser.label});
  }
  const isSmall = String(chave.numTimes) === '4' || String(chave.numTimes) === '5';
  const semDisputa3 = isSmall && chave.disputa3 === false;
  const terceiro = decided('3º/4º');
  if(terceiro){
    rows.push({pos:'3º', cls:'p3', name: terceiro.winner.label});
    rows.push({pos:'4º', cls:'p3', name: terceiro.loser.label});
  } else if(semDisputa3){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && stU.rows.length >= 4){
      rows.push({pos:'3º', cls:'p3', name: stU.rows[2].label});
      rows.push({pos:'4º', cls:'p3', name: stU.rows[3].label});
    }
  }
  const quinto = decided('5º/6º');
  if(quinto){
    rows.push({pos:'5º', cls:'p5', name: quinto.winner.label});
    rows.push({pos:'6º', cls:'p5', name: quinto.loser.label});
  }
  const setimo = decided('7º/8º');
  if(setimo){
    rows.push({pos:'7º', cls:'p5', name: setimo.winner.label});
    rows.push({pos:'8º', cls:'p5', name: setimo.loser.label});
  }
  if(String(chave.numTimes) === '6'){
    const stA = groupStandings(chave, 'A');
    const stB = groupStandings(chave, 'B');
    if(stA.complete && stB.complete){
      const c1 = stA.rows[2], c2 = stB.rows[2];
      const pair = [c1, c2].sort((x,y)=> y.average - x.average);
      rows.push({pos:'5º', cls:'p5', name: pair[0].label});
      rows.push({pos:'6º', cls:'p5', name: pair[1].label});
    }
  }
  if(String(chave.numTimes) === '5'){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && rows.some(r=>r.pos==='4º') && stU.rows.length > 4){
      rows.push({pos:'5º', cls:'p5', name: stU.rows[4].label});
    }
  }
  if(String(chave.numTimes) === '3'){
    const stU = groupStandings(chave, 'UNICO');
    if(stU.complete && stU.rows.length >= 3){
      rows.push({pos:'3º', cls:'p3', name: stU.rows[2].label});
    }
  }
  if(String(chave.numTimes) === '7'){
    const stA = groupStandings(chave, 'A');
    const stB = groupStandings(chave, 'B');
    if(stA.complete && stB.complete){
      const cand = [stA.rows[2], stB.rows[2], stB.rows[3]].filter(Boolean);
      cand.sort((x,y) => y.average - x.average);
      const labels = ['5º','6º','7º'];
      cand.forEach((c,i) => rows.push({pos:labels[i], cls:'p5', name:c.label}));
    }
  }
  return rows;
}

// ---------- full 1..N final ranking (progressive: fills in as duplas are eliminated) ----------
function ordinal(n){ return n + 'º'; }
function posNumFromLabel(posStr){ return parseInt(String(posStr).replace('º',''), 10); }

// Structural template: for a given bracket size, which games decide which position
// (or position range, when several teams end up tied). This depends only on the
// bracket's shape — never on results — so it's computed once and cached.
const rankTemplateCache = {};
function buildRankTemplate(numTimes){
  if(rankTemplateCache[numTimes]) return rankTemplateCache[numTimes];
  const games = BRACKETS[numTimes];
  const referencedVenc = new Set(), referencedPerd = new Set();
  games.forEach(g => {
    [g.a, g.b].forEach(ref => {
      if(typeof ref === 'string'){
        const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
        if(m){ (m[1]==='Venc' ? referencedVenc : referencedPerd).add(parseInt(m[2],10)); }
      }
    });
  });
  const cohortsMap = {};
  games.forEach(g => {
    if(!referencedVenc.has(g.num)){
      const key = g.fase + '|venc';
      if(!cohortsMap[key]) cohortsMap[key] = { fase:g.fase, outcome:'venc', maxNum:-1, gameNums:[] };
      cohortsMap[key].maxNum = Math.max(cohortsMap[key].maxNum, g.num);
      cohortsMap[key].gameNums.push(g.num);
    }
    if(!referencedPerd.has(g.num)){
      const key = g.fase + '|perd';
      if(!cohortsMap[key]) cohortsMap[key] = { fase:g.fase, outcome:'perd', maxNum:-1, gameNums:[] };
      cohortsMap[key].maxNum = Math.max(cohortsMap[key].maxNum, g.num);
      cohortsMap[key].gameNums.push(g.num);
    }
  });
  const cohorts = Object.values(cohortsMap).sort((a,b)=>{
    if(b.maxNum !== a.maxNum) return b.maxNum - a.maxNum;
    if(a.outcome !== b.outcome) return a.outcome === 'venc' ? -1 : 1;
    return 0;
  });
  let pos = 1;
  cohorts.forEach(c => {
    c.posStart = pos;
    c.posEnd = pos + c.gameNums.length - 1;
    c.posLabel = c.posStart === c.posEnd ? ordinal(c.posStart) : (ordinal(c.posStart) + '–' + ordinal(c.posEnd));
    pos = c.posEnd + 1;
  });
  rankTemplateCache[numTimes] = cohorts;
  return cohorts;
}

function computeFullRanking(chave){
  const games = BRACKETS[chave.numTimes];
  const hasGroups = games.some(g => g.grupo);
  const N = Number(chave.numTimes);
  if(hasGroups){
    const standingsRows = computeStandings(chave);
    const known = {};
    standingsRows.forEach(r => { known[posNumFromLabel(r.pos)] = r.name; });
    const rows = [];
    for(let p = 1; p <= N; p++){
      if(known[p] !== undefined) rows.push({ posLabel: ordinal(p), posStart:p, name: known[p], tied:false, pending:false });
      else rows.push({ posLabel: ordinal(p), posStart:p, name:null, tied:false, pending:true });
    }
    return rows;
  }
  return computeFinalRankingChain(chave);
}

function computeFinalRankingChain(chave){
  const template = buildRankTemplate(chave.numTimes);
  const games = BRACKETS[chave.numTimes];
  let rows = [];
  template.forEach(c => {
    const allPlayed = c.gameNums.every(gn => chave.resultados[gn] && chave.resultados[gn].vencedorSlot);
    if(!allPlayed){
      rows.push({ posLabel:c.posLabel, posStart:c.posStart, name:null, tied:false, pending:true });
      return;
    }
    const teams = c.gameNums.map(gn => {
      const g = games.find(x => x.num === gn);
      const res = chave.resultados[gn];
      const info = matchInfo(chave, g);
      return c.outcome === 'venc' ? (res.vencedorSlot==='a'?info.A:info.B) : (res.vencedorSlot==='a'?info.B:info.A);
    });
    teams.sort((x,y)=>{
      const rx = parseInt(String(x.teamKey||'R999').replace('R',''),10);
      const ry = parseInt(String(y.teamKey||'R999').replace('R',''),10);
      return rx - ry;
    });
    teams.forEach(team => rows.push({ posLabel:c.posLabel, posStart:c.posStart, name:team.label, teamKey:team.teamKey, tied: teams.length>1, pending:false }));
  });

  // Safety net: a couple of the source spreadsheet's larger tables have a duplicated
  // internal reference that can resolve the same dupla into two different slots.
  // Keep only its best (lowest posStart) slot; the other slot is left without a name.
  const best = {};
  rows.forEach(r => {
    if(r.pending) return;
    const key = r.teamKey || r.name;
    if(!best[key] || r.posStart < best[key].posStart) best[key] = r;
  });
  rows = rows.map(r => {
    if(r.pending) return r;
    const key = r.teamKey || r.name;
    if(best[key] !== r) return { posLabel:r.posLabel, posStart:r.posStart, name:null, tied:false, pending:true, dataQuirk:true };
    return r;
  });

  // Once every game is played, any real dupla still missing from the decided rows
  // (a rarer knock-on effect of the same source-table inconsistency) gets an explicit
  // placeholder so it's never silently absent from the ranking.
  const allPlayed = games.every(g => chave.resultados[g.num] && chave.resultados[g.num].vencedorSlot);
  if(allPlayed){
    const decidedNames = new Set(rows.filter(r=>!r.pending).map(r=>r.name));
    chave.times.forEach((t, i) => {
      const label = teamLabel(chave, i) || ('Rank ' + (i+1));
      if(!decidedNames.has(label)){
        rows.push({ posLabel:'?', posStart:9999, name:null, altName:label, tied:false, pending:true, dataQuirk:true });
      }
    });
  }
  return rows;
}

// Pódio (1º-3º) de uma categoria — Ed (22/08/2026): "quero ao final divulgar
// em lista o pódio de todas as categorias". Reaproveita computeFullRanking
// (a mesma fonte usada na aba Classificação) e recorta só posStart 1-3,
// agrupando por posLabel — necessário porque um chaveamento sem disputa de
// 3º lugar produz DOIS nomes empatados em "3º" (as duas semifinalistas
// perdedoras), não um só.
function computePodio(chave){
  const st = chaveStatus(chave);
  const ranking = computeFullRanking(chave);
  const byLabel = {};
  const order = [];
  ranking.forEach(r => {
    if(r.posStart > 3) return;
    if(!byLabel[r.posLabel]){
      byLabel[r.posLabel] = { posLabel:r.posLabel, posStart:r.posStart, names:[], pending:false };
      order.push(byLabel[r.posLabel]);
    }
    if(r.pending) byLabel[r.posLabel].pending = true;
    else if(r.name) byLabel[r.posLabel].names.push(r.name);
  });
  order.sort((a,b) => a.posStart - b.posStart);
  return { concluded: st.concluded, done: st.done, total: st.total, podio: order };
}
// Pódio de TODAS as categorias de um evento (todos os dias), na mesma ordem
// alfabética/por dia já usada em categoriasOfEvento.
function computeEventoPodio(eventoId){
  return categoriasOfEvento(eventoId).map(({cat, chave}) => ({ cat, chave, podio: computePodio(chave) }));
}

// ---------- ranking de pontuação por atleta (Ed, 24/08/2026: "cada
// colocação tem uma pontuação... preciso gerar um relatorio pos evento dos
// atletas nas categorias, com esse sistema de pontuação", acumulado entre
// vários eventos — tipo ranking de circuito/temporada) ----------
// Tabela oficial do Ed. As chaves são o posStart de cada FAIXA de colocação
// — a mesma faixa que computeFullRanking já usa pra agrupar posições
// empatadas (5º/6º sempre saem juntos, 7º/8º juntos, 9º-12º juntos, 13º-16º
// juntos, 17º-24º juntos, 25º em diante), por isso não existe entrada pra
// 6º/8º/10º etc — "lembrando que sempre haverá dois 5" é exatamente essa
// faixa 5º-6º valendo o mesmo tanto de pontos pras duas duplas.
const PONTOS_POR_POSSTART = { 1:200, 2:180, 3:160, 4:140, 5:120, 7:100, 9:80, 13:60, 17:40, 25:30 };
const PONTOS_POSSTART_KEYS = Object.keys(PONTOS_POR_POSSTART).map(Number).sort((a,b) => a-b);
function pontosParaPosStart(posStart){
  let pts = 0;
  for(const k of PONTOS_POSSTART_KEYS){ if(posStart >= k) pts = PONTOS_POR_POSSTART[k]; else break; }
  return pts;
}
// Reaproveita teamMatchKey/timeDisplayName (já usados na importação de
// planilha) só pra achar o índice do time em chave.times a partir do label
// já resolvido pelo ranking (necessário quando a linha não carrega teamKey
// — categorias pequenas com grupo único, ver computeFullRanking).
function findTeamIndexByLabel(chave, label){
  for(let i=0; i<chave.times.length; i++){ if(teamLabel(chave, i) === label) return i; }
  return -1;
}
// Classificação final de UMA categoria (chave), com o valor em pontos de
// cada colocação — igual ao que computePodio já faz (agrupa por posLabel
// pra juntar posições empatadas, tipo as duas 5º/6º), só que aqui SEM
// cortar em 3º lugar: desce até onde a categoria já tiver decidido.
function computeClassificacaoComPontos(chave){
  const st = chaveStatus(chave);
  const ranking = computeFullRanking(chave);
  const byLabel = {};
  const linhas = [];
  ranking.forEach(r => {
    if(!byLabel[r.posLabel]){
      byLabel[r.posLabel] = { posLabel:r.posLabel, posStart:r.posStart, pontos: pontosParaPosStart(r.posStart), names:[], pending:false };
      linhas.push(byLabel[r.posLabel]);
    }
    if(r.pending){ byLabel[r.posLabel].pending = true; return; }
    if(!r.name) return;
    const idx = r.teamKey ? (parseInt(String(r.teamKey).replace('R',''), 10) - 1) : findTeamIndexByLabel(chave, r.name);
    const time = idx >= 0 ? chave.times[idx] : null;
    const label = time ? (timeDisplayName(chave.modalidade, time) || r.name) : r.name;
    byLabel[r.posLabel].names.push(label);
  });
  linhas.sort((a, b) => a.posStart - b.posStart);
  return { concluded: st.concluded, done: st.done, total: st.total, linhas };
}
// Ed (24/08/2026, 3ª rodada de ajuste): "não quero que some nada. quero o
// ranking das categorias isoladas. e a lista pra exportar delas tbm" — nada
// de somar pontos entre eventos nem entre duplas: cada categoria (pelo
// nome) vira uma seção, e DENTRO dela cada evento em que essa categoria
// rolou aparece como sua própria classificação isolada — sem misturar
// número de pontos de uma edição com o de outra, mesmo repetindo o nome.
function computeRankingCategoriasIsoladas(eventoIds){
  const eventos = eventoIds ? eventoIds.map(getEvento).filter(Boolean) : loadEventos();
  const byCategoria = {};
  eventos.forEach(ev => {
    categoriasOfEvento(ev.id).forEach(({chave}) => {
      const catNome = chave.nome;
      if(!byCategoria[catNome]) byCategoria[catNome] = [];
      byCategoria[catNome].push({ eventoNome: ev.nome, classificacao: computeClassificacaoComPontos(chave) });
    });
  });
  return Object.keys(byCategoria).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(nome => ({
    categoriaNome: nome,
    instancias: byCategoria[nome]
  }));
}

// ---------- ranking cumulativo por campeonato (Ed, 18/09: "soma sim, mas
// depende do evento... Copa PB e Copa SE7... são duas coisa distintas. Não se
// conversam. ranking diferentes") ----------
// Chave de identidade de uma dupla/quarteto ATRAVESSANDO eventos diferentes —
// diferente de teamMatchKey (que só resolve dentro de UMA chave, pra
// reimportação de planilha): aqui o que importa é o par de nomes de atleta
// normalizado, já que o mesmo atleta pode estar em times com "nome" de
// exibição distintos (ou nenhum) em eventos diferentes.
function duplaCampeonatoKey(modalidade, time){
  if(usaListaAtletas(modalidade)){
    const nomes = (time.atletas || []).map(normPersonName).filter(Boolean);
    if(nomes.length) return nomes.slice().sort().join('+');
    return time.nome ? ('NOME:' + normPersonName(time.nome)) : null;
  }
  const a1 = normPersonName(time.atleta1 || ''), a2 = normPersonName(time.atleta2 || '');
  if(!a1 && !a2) return null;
  return [a1, a2].sort().join('+');
}
// Base compartilhada: classificação de UMA chave com o TIME (objeto bruto)
// de cada linha, não só o texto pronto — é o que permite derivar qualquer
// agregação (por dupla, por atleta individual, por CT) sem repetir a
// caminhada por computeFullRanking em cada uma.
function computeClassificacaoComTimes(chave){
  const st = chaveStatus(chave);
  const ranking = computeFullRanking(chave);
  const byLabel = {};
  const linhas = [];
  ranking.forEach(r => {
    if(!byLabel[r.posLabel]){
      byLabel[r.posLabel] = { posLabel:r.posLabel, posStart:r.posStart, pontos: pontosParaPosStart(r.posStart), times:[], pending:false };
      linhas.push(byLabel[r.posLabel]);
    }
    if(r.pending){ byLabel[r.posLabel].pending = true; return; }
    if(!r.name) return;
    const idx = r.teamKey ? (parseInt(String(r.teamKey).replace('R',''), 10) - 1) : findTeamIndexByLabel(chave, r.name);
    const time = idx >= 0 ? chave.times[idx] : null;
    const label = time ? (timeDisplayName(chave.modalidade, time) || r.name) : r.name;
    byLabel[r.posLabel].times.push({ time, label });
  });
  linhas.sort((a, b) => a.posStart - b.posStart);
  return { concluded: st.concluded, done: st.done, total: st.total, linhas };
}
// Igual a computeClassificacaoComPontos, só que cada linha carrega a lista de
// EQUIPES (label + a chave de identidade acima), não só o texto pronto — é o
// que permite somar a pontuação da MESMA dupla entre etapas diferentes do
// mesmo campeonato sem tocar na função original (que o export/relatório do
// organizador já usa e testa isoladamente).
function computeClassificacaoComPontosEKeys(chave){
  const base = computeClassificacaoComTimes(chave);
  return {
    concluded: base.concluded, done: base.done, total: base.total,
    linhas: base.linhas.map(l => ({
      posLabel: l.posLabel, posStart: l.posStart, pontos: l.pontos, pending: l.pending,
      equipes: l.times.map(t => ({ label: t.label, key: t.time ? duplaCampeonatoKey(chave.modalidade, t.time) : null }))
    }))
  };
}
// ---------- ranking por atleta individual e por CT (Ed, 18/09, 2ª rodada:
// "para as próximas que serão geradas por CTs fazer a soma dos atletas por
// CTs... igual será no evento por atleta, o ranking por atleta, por CT, por
// dupla") — mesma engrenagem de acumular pontos por chave, só muda o que
// cada time "vira" (uma dupla, um atleta de cada vez, ou o CT do time). ----
function nomesAtletasDoTime(modalidade, time){
  if(!time) return [];
  if(usaListaAtletas(modalidade)) return (time.atletas || []).map(s => (s||'').trim()).filter(Boolean);
  return [time.atleta1, time.atleta2].map(s => (s||'').trim()).filter(Boolean);
}
function ctDoTime(time){
  const ct = time && time.ct ? String(time.ct).trim() : '';
  return ct || 'Sem CT';
}
function extratorDupla(modalidade, time){
  const key = duplaCampeonatoKey(modalidade, time);
  return key ? [{ key: 'D:' + key, label: timeDisplayName(modalidade, time) || key }] : [];
}
function extratorAtleta(modalidade, time){
  return nomesAtletasDoTime(modalidade, time).map(nome => ({ key: 'AT:' + normPersonName(nome), label: nome }));
}
function extratorCT(modalidade, time){
  const ct = ctDoTime(time);
  return [{ key: 'CT:' + normPersonName(ct), label: ct }];
}
// items: lista de {chave, eventoId}. extrator(modalidade, time) -> lista de
// {key, label} (0, 1 ou N por time — 1 pra dupla/CT, 2 ou mais pra atleta).
// Cada ocorrência do elemento numa colocação decidida ganha o valor EM CHEIO
// dessa colocação (convenção padrão desses rankings: cada integrante da
// dupla/CT recebe o pontos inteiro do time, não a metade).
function acumularPorElemento(items, extrator){
  const map = new Map();
  items.forEach(({chave, eventoId}) => {
    const cls = computeClassificacaoComTimes(chave);
    cls.linhas.forEach(l => {
      l.times.forEach(t => {
        if(!t.time) return;
        extrator(chave.modalidade, t.time).forEach(({key, label}) => {
          if(!key) return;
          if(!map.has(key)) map.set(key, { label, pontos:0, etapas: new Set() });
          const row = map.get(key);
          row.pontos += l.pontos;
          row.label = label;
          if(eventoId) row.etapas.add(eventoId);
        });
      });
    });
  });
  return Array.from(map.values())
    .map(r => ({ label:r.label, pontos:r.pontos, etapas:r.etapas.size }))
    .sort((a,b) => b.pontos - a.pontos);
}
function itemsDoCampeonato(nomeCampeonato){
  const eventos = loadEventos().filter(ev => (ev.campeonato||'').trim() === nomeCampeonato);
  const items = [];
  eventos.forEach(ev => categoriasOfEvento(ev.id).forEach(({chave}) => items.push({ chave, eventoId: ev.id })));
  return items;
}
function itemsDoEvento(eventoId){
  return categoriasOfEvento(eventoId).map(({chave}) => ({ chave, eventoId }));
}
// Geral por campeonato (soma entre etapas do MESMO campeonato — igual à
// regra já usada pra dupla; Ed confirmou 18/09: "só dentro do mesmo
// campeonato", nunca misturando Copa SE7 com Copa PB).
// Ed (18/09, correção depois de ver a referência da CBVP): "adequar o
// individual do atleta que é na categoria, e não somando as categorias que a
// atleta aparece" — o ranking POR ATLETA tem que ficar isolado por categoria
// (igual ao ranking por dupla), NUNCA somando, por exemplo, os pontos do
// Masculino com os do Misto só porque é o mesmo atleta jogando os dois. Uma
// seção por categoria (mesmo formato de computeRankingCampeonato), cada
// atleta somado só dentro da SUA categoria, entre etapas do mesmo campeonato.
function computeRankingCampeonatoPorAtleta(nomeCampeonato){
  const items = itemsDoCampeonato(nomeCampeonato);
  const porCategoria = {};
  items.forEach(it => { (porCategoria[it.chave.nome] = porCategoria[it.chave.nome] || []).push(it); });
  return Object.keys(porCategoria).sort((a,b) => a.localeCompare(b,'pt-BR')).map(catNome => {
    const linhas = acumularPorElemento(porCategoria[catNome], extratorAtleta);
    return { categoriaNome: catNome, atletas: linhas.length, linhas };
  });
}
// Por CT continua cruzando TODAS as categorias do campeonato de propósito —
// um CT é uma organização com atletas em várias categorias, diferente do
// ranking pessoal de UM atleta (que só faz sentido dentro da categoria que
// ele disputou). Ed não pediu pra isolar esse por categoria.
function computeRankingCampeonatoPorCT(nome){ return acumularPorElemento(itemsDoCampeonato(nome), extratorCT); }
// Ranking de UMA etapa (evento) só, cruzando TODAS as categorias desse
// evento — por atleta, por CT e por dupla (Ed: "no evento... por atleta, por
// CT, por dupla (daquela etapa)").
function computeRankingEtapa(eventoId){
  const items = itemsDoEvento(eventoId);
  return {
    porDupla: acumularPorElemento(items, extratorDupla),
    porAtleta: acumularPorElemento(items, extratorAtleta),
    porCT: acumularPorElemento(items, extratorCT)
  };
}
// Busca por nome (atleta/dupla/CT) nas telas de ranking — normaliza igual a
// normPersonName (minúsculo, sem acento) pra achar mesmo com grafia diferente.
let rkFiltroNome = '';
function filtrarLinhasPorNome(linhas){
  const q = normPersonName(rkFiltroNome || '');
  if(!q) return linhas;
  return linhas.filter(l => normPersonName(l.label).includes(q));
}
function buscaNomeInputHtml(onchangeCall){
  return `<input type="text" placeholder="🔎 Buscar atleta, dupla ou CT…" value="${escapeHtmlAttr(rkFiltroNome)}" oninput="rkFiltroNome=this.value; ${onchangeCall}" style="margin-bottom:10px;">`;
}
// Lista dos nomes de campeonato já usados em algum evento (pro autocomplete
// no cadastro do evento e pra montar a home do ranking).
function listaCampeonatos(){
  const set = new Set();
  loadEventos().forEach(ev => { const c = (ev.campeonato||'').trim(); if(c) set.add(c); });
  return Array.from(set).sort((a,b) => a.localeCompare(b,'pt-BR'));
}
// Ranking somado de um campeonato: uma seção por nome de categoria (chave.nome),
// somando os pontos da MESMA dupla (por nome de atleta) em toda etapa
// (evento) que compartilha esse nome de campeonato — nunca misturando com
// outro campeonato, mesmo que o nome da categoria seja igual.
function computeRankingCampeonato(nomeCampeonato){
  const eventos = loadEventos().filter(ev => (ev.campeonato||'').trim() === nomeCampeonato);
  const porCategoria = {}; // catNome -> Map(key -> {label, pontos, etapas:Set})
  eventos.forEach(ev => {
    categoriasOfEvento(ev.id).forEach(({chave}) => {
      const catNome = chave.nome;
      if(!porCategoria[catNome]) porCategoria[catNome] = new Map();
      const map = porCategoria[catNome];
      const cls = computeClassificacaoComPontosEKeys(chave);
      cls.linhas.forEach(l => {
        l.equipes.forEach(eq => {
          if(!eq.key) return;
          if(!map.has(eq.key)) map.set(eq.key, { label: eq.label, pontos:0, etapas: new Set() });
          const row = map.get(eq.key);
          row.pontos += l.pontos;
          row.label = eq.label;
          row.etapas.add(ev.id);
        });
      });
    });
  });
  return Object.keys(porCategoria).sort((a,b) => a.localeCompare(b,'pt-BR')).map(catNome => {
    const linhas = Array.from(porCategoria[catNome].values())
      .map(r => ({ label:r.label, pontos:r.pontos, etapas:r.etapas.size }))
      .sort((a,b) => b.pontos - a.pontos);
    return { categoriaNome: catNome, atletas: linhas.length, linhas };
  });
}
// Igual à caminhada de computeRankingCampeonato, só que devolve um Map
// key->pontos (a duplaCampeonatoKey de cada dupla) em vez de linhas prontas
// pra exibir — é o que disponibilizarChaveamento() usa pra ordenar os times
// de UMA chave por pontos já acumulados no campeonato (metodo "ranking da
// etapa"). Isolado por categoria (chave.nome), igual ao ranking por dupla.
function pontosAcumuladosPorDuplaCategoria(nomeCampeonato, categoriaNome){
  const map = new Map();
  if(!nomeCampeonato) return map;
  const eventos = loadEventos().filter(ev => (ev.campeonato||'').trim() === nomeCampeonato);
  eventos.forEach(ev => {
    categoriasOfEvento(ev.id).forEach(({chave}) => {
      if(chave.nome !== categoriaNome) return;
      const cls = computeClassificacaoComPontosEKeys(chave);
      cls.linhas.forEach(l => {
        l.equipes.forEach(eq => {
          if(!eq.key) return;
          map.set(eq.key, (map.get(eq.key)||0) + l.pontos);
        });
      });
    });
  });
  return map;
}

// ---------- Visibilidade do chaveamento (Ed, 18/09: "isso aqui só deve
// aparecer quando começar a competição, quando for divulgado... disponibilizar
// confronto, disponibilizar árvore, disponibilizar chaveamento das
// competições") ----------
// Categorias CRIADAS ANTES dessa funcionalidade não têm o campo
// chaveamentoLiberado (undefined) — precisam continuar EXATAMENTE como
// estavam (chaveamento visível), pra não sumir nada de torneio já rolando.
// Só uma chave NOVA nasce com chaveamentoLiberado:false explicitamente (ver
// saveSetup) e portanto começa escondida até o organizador disponibilizar.
function chaveamentoVisivel(chave){ return !chave || chave.chaveamentoLiberado !== false; }
// Disponibiliza o chaveamento de uma categoria: define a ordem dos times
// (sorteio aleatório OU pelos pontos já acumulados no campeonato dessa
// etapa — as duas opções que o Ed confirmou) e marca liberado.
// Ed, 21/09: "preciso que ele tenha o espaço de ocultar, já que a categoria
// está aberta. não pode aparecer até a gente autorizar" — então isso DEIXOU
// de ser uma ação de mão única: dá pra ocultar de novo a qualquer momento
// (ver ocultarChaveamentoNovamente/mostrarChaveamentoNovamente abaixo) sem
// perder a ordem já sorteada nem os placares já lançados.
function disponibilizarChaveamento(chaveId, metodo){
  const chave = getChave(chaveId);
  if(!chave) return;
  if(chaveamentoVisivel(chave)){ toast('Esse chaveamento já foi disponibilizado'); return; }
  const times = chave.times || [];
  const comDados = times.filter(t => teamRowHasData(t, chave.modalidade));
  if(comDados.length < 2){ toast('Cadastre pelo menos 2 times antes de disponibilizar o chaveamento'); return; }
  let novaOrdem;
  if(metodo === 'sorteio'){
    novaOrdem = times.slice();
    for(let i = novaOrdem.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = novaOrdem[i]; novaOrdem[i] = novaOrdem[j]; novaOrdem[j] = tmp;
    }
  } else if(metodo === 'ranking'){
    const cat = categoriaByChaveId(chaveId);
    const ev = cat ? getEvento(cat.eventoId) : null;
    const nomeCampeonato = ev ? (ev.campeonato||'').trim() : '';
    const pontosMap = pontosAcumuladosPorDuplaCategoria(nomeCampeonato, chave.nome);
    novaOrdem = times.map((t,i) => {
      const key = t ? duplaCampeonatoKey(chave.modalidade, t) : null;
      return { t, i, pts: key ? (pontosMap.get(key)||0) : 0 };
    }).sort((a,b) => (b.pts - a.pts) || (a.i - b.i)).map(x => x.t);
  } else {
    toast('Método de definição da ordem inválido');
    return;
  }
  chave.times = novaOrdem;
  chave.chaveamentoLiberado = true;
  chave.chaveamentoJaSorteado = true;
  updateChave(chave);
  toast('Chaveamento disponibilizado — o público já vê os confrontos');
}
function confirmDisponibilizarChaveamento(chaveId, metodo){
  const label = metodo === 'sorteio' ? 'sorteio (ordem aleatória)' : 'ranking da etapa (pontos já acumulados no campeonato)';
  if(!confirm('Disponibilizar o chaveamento dessa categoria usando ' + label + '? O público passa a ver os confrontos/árvore a partir de agora.')) return;
  disponibilizarChaveamento(chaveId, metodo);

// For 4/5 duplas the organizer can skip the 3º/4º dispute (goes straight to the
// final, 3º/4º decided by group average instead). This returns the game list a
// given chave should actually use.
function effectiveGames(chave){
  const games = BRACKETS[chave.numTimes];
  const isSmall = String(chave.numTimes) === '4' || String(chave.numTimes) === '5';
  if(isSmall && chave.disputa3 === false){
    return games.filter(g => g.fase !== '3º/4º');
  }
  return games;
}

// ---------- cronograma (planejamento de quadras/horários) ----------
// Pedido do Ed: a partir do nº de quadras disponíveis num dia e da duração
// de cada jogo, montar uma previsão de horário/quadra pra cada jogo de cada
// categoria daquele dia — pra saber se cabe no dia e exportar em PDF pra
// arbitragem. Respeita a ordem real da chave: um jogo só entra na simulação
// depois que os jogos dos quais ele depende (Venc/Perd J N, ou — nos
// formatos com fase de grupos — TODOS os jogos do grupo de que ele puxa a
// classificação) já tiverem, na simulação, terminado. Categorias diferentes
// não dependem entre si — só disputam as mesmas quadras.
function isFaseDecisiva(fase){
  return fase === 'S/Final' || fase === 'Final' || fase === '3º/4º';
}
function duracaoJogo(ev, g){
  // Corrigido 18/09: || só filtra falsy (0, '', undefined), não valores
  // negativos — um duracaoPadrao/duracaoDecisiva negativo (digitado sem
  // passar pelo min="5" do HTML, ou vindo de um evento antigo salvo antes
  // desse campo existir) fazia fim < início em gerarGradeDia/gerarCronograma,
  // voltando quadraFreeAt no tempo e gerando jogos com horário sobreposto ou
  // que somem da grade/PDF (o filtro de linha nunca casa um intervalo invertido).
  const padrao = Math.max(5, ev.duracaoPadrao || 30);
  const decisiva = Math.max(5, ev.duracaoDecisiva || 40);
  return isFaseDecisiva(g.fase) ? decisiva : padrao;
}
// Números dos jogos (na MESMA chave) dos quais um jogo depende antes de
// poder começar: "Venc/Perd J N" aponta direto pro jogo N; uma referência de
// grupo ({grp,pos}) depende de TODOS os jogos daquele grupo.
function gameDeps(chave, g){
  const deps = new Set();
  [g.a, g.b].forEach(ref => {
    if(typeof ref === 'string'){
      const m = /^(Venc|Perd) J (\d+)$/.exec(ref);
      if(m) deps.add(parseInt(m[2], 10));
    } else if(ref && typeof ref === 'object' && ref.grp){
      effectiveGames(chave).forEach(gg => { if(gg.grupo === ref.grp && gg.num !== g.num) deps.add(gg.num); });
    }
  });
  return Array.from(deps);
}
function hhmmToMin(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function gcdMin(a, b){
  a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
  while(b){ const t = b; b = a % b; a = t; }
  return a || 1;
}
// Passo de linha da grade do cronograma, em minutos: se a duração do jogo
// classificatório e a do decisivo forem diferentes (ex: 30 e 40), uma linha
// fixa de 30min faz o fim de um jogo decisivo cair "entre" linhas e some da
// tabela — usar o MDC das duas durações garante que todo início/fim de jogo
// caia exatamente numa linha, qualquer que seja a combinação configurada.
function cronogramaGridStep(ev){
  return Math.max(5, gcdMin(ev.duracaoPadrao || 30, ev.duracaoDecisiva || 40));
}
function minToHHMM(min){
  min = Math.round(min);
  const h = Math.floor(min/60) % 24, m = ((min%60)+60)%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
// Motor de simulação — puro (sem tocar em estado global nem DOM), pra dar
// pra testar isoladamente. Recebe as categorias do dia (cada uma com sua
// chave), o nº de quadras e o horário de início; devolve os jogos com
// quadra/horário previstos.
function gerarCronograma(ev, items, quadras, horaInicioStr){
  const inicioMin = hhmmToMin(horaInicioStr);
  const inicio = inicioMin == null ? 8*60 : inicioMin;
  if(!quadras || quadras < 1) return { slots: [], fimMin: inicio, ok:false };
  const quadraFreeAt = Array(quadras).fill(inicio);
  const porChave = items.map(({cat, chave}) => ({
    chave, cat,
    pendentes: effectiveGames(chave).slice().sort((a,b)=>a.num-b.num),
    fimDe: {} // gnum -> minuto em que termina (previsto)
  }));
  const slots = [];
  const totalJogos = porChave.reduce((s,pc)=>s+pc.pendentes.length, 0);
  let guard = 0;
  while(slots.length < totalJogos && guard < totalJogos + 500){
    guard++;
    const prontos = [];
    porChave.forEach(pc => {
      pc.pendentes.forEach(g => {
        const deps = gameDeps(pc.chave, g);
        if(deps.every(d => pc.fimDe[d] !== undefined)){
          const depEarliest = deps.length ? Math.max(...deps.map(d => pc.fimDe[d])) : inicio;
          prontos.push({ pc, g, depEarliest });
        }
      });
    });
    if(!prontos.length) break; // dependência não resolvida (não deveria acontecer) — sai pra não travar
    prontos.sort((a,b) => (a.depEarliest - b.depEarliest) || (a.g.num - b.g.num));
    prontos.forEach(({pc, g, depEarliest}) => {
      let earliest = depEarliest;
      // Fases finais (poucos jogos restantes numa categoria — quartas,
      // repescagem, semifinal, final) nunca rodam mais de 2 jogos da MESMA
      // categoria ao mesmo tempo, mesmo sobrando quadra livre — pedido do Ed:
      // com menos de 4 jogos por distribuir, 3+ simultâneos "desconfigura a
      // competição" (essas fases só comportam 2 de verdade). O limite some
      // assim que sobrarem 4+ jogos daquela categoria (cobre quartas com 4
      // jogos em paralelo, por exemplo). slots já reflete o que foi agendado
      // nesta mesma leva até aqui, então também serializa candidatos que
      // ficaram prontos juntos.
      if(pc.pendentes.length < 4){
        const finsDesc = slots.filter(s => s.chaveId === pc.chave.id).map(s => s.fim).sort((a,b) => b-a);
        if(finsDesc.length >= 2) earliest = Math.max(earliest, finsDesc[1]);
      }
      let idx = 0;
      for(let i=1;i<quadraFreeAt.length;i++) if(quadraFreeAt[i] < quadraFreeAt[idx]) idx = i;
      const startAt = Math.max(quadraFreeAt[idx], earliest);
      const dur = duracaoJogo(ev, g);
      const fim = startAt + dur;
      slots.push({ chaveId: pc.chave.id, categoria: pc.chave.nome, gnum: g.num, fase: g.fase, quadraIdx: idx, inicio: startAt, fim });
      quadraFreeAt[idx] = fim;
      pc.fimDe[g.num] = fim;
      pc.pendentes = pc.pendentes.filter(x => x.num !== g.num);
    });
  }
  const fimMin = slots.length ? Math.max(...slots.map(s=>s.fim)) : inicio;
  return { slots, fimMin, ok:true };
}
// ---------- grade por categoria (quadras dedicadas, com "degraus") ----------
// Modelo pedido pelo Ed depois de ver os jogos "misturados" livremente pela
// mesma quadra (categoria A num horário, categoria B no seguinte, categoria
// A de novo): cada categoria usa um NÚMERO DE QUADRAS PRÓPRIO (editável —
// quantas quadras + que horas começa), nunca dividindo a mesma quadra com
// outra categoria NO MESMO INSTANTE. Ago/2026: o Ed pediu pra esse número
// poder MUDAR ao longo do dia por categoria — ex. "Pais e Filhos" começa com
// 2 quadras e ganha uma 3ª a partir das 15h30 (se estiver livre nessa hora);
// "Adulto Iniciante" começa com 4, sobe pra 5 às 10h e desce pra 2 nas fases
// finais. Isso vira uma lista de "degraus" por categoria (cat.quadraSteps —
// [{horaInicio, quadras}, ...]) além do quadras/horaInicio simples de antes
// (que continua funcionando normalmente pra quem não usa degraus).
//
// Pra dar pra "devolver" uma quadra ociosa pra outra categoria pegar assim
// que ela libera (em vez de reservar tudo cego desde o início do dia), as
// quadras de TODAS as categorias do dia são simuladas juntas numa única
// simulação por ondas (como o antigo gerarCronograma fazia antes do pedido
// de quadra dedicada) — só que agora cada categoria tem uma COTA de quadras
// simultâneas que pode variar com o tempo (era fixa em "sempre 2" só nas
// fases finais; virou geral, dirigida pelos degraus). Cada categoria tenta
// primeiro reaproveitar as quadras que "já são dela" (pra não ficar pulando
// de quadra à toa); só reivindica uma quadra nova (sem dono no momento) se
// ainda não bateu a cota — e assim que sua cota cai (fim, degrau de descida,
// fases finais) ou ela termina os jogos, devolve o excesso, que fica livre
// pra qualquer outra categoria reivindicar.
function normalizeCategoriaSteps(cat, quadrasTotais, inicioDia){
  const start = Math.max(inicioDia, hhmmToMin(cat.horaInicio) ?? inicioDia);
  const clampN = n => Math.max(1, Math.min(quadrasTotais, Math.round(n) || 1));
  const custom = (Array.isArray(cat.quadraSteps) ? cat.quadraSteps : [])
    .filter(s => s && s.quadras && hhmmToMin(s.horaInicio) != null)
    .map(s => ({ at: Math.max(inicioDia, hhmmToMin(s.horaInicio)), quadras: clampN(s.quadras) }))
    .sort((a,b) => a.at - b.at);
  let steps;
  if(!custom.length || custom[0].at > start){
    steps = [{ at: start, quadras: clampN(cat.quadras || 1) }].concat(custom);
  } else {
    // já existe um degrau bem na hora de início (ou antes) — ele que manda
    // a partir do início, ajustado pra não começar antes da categoria.
    steps = custom.slice();
    steps[0] = { at: start, quadras: steps[0].quadras };
  }
  // funde degraus repetidos no mesmo horário (o último definido vence) e
  // remove degraus que não mudam nada em relação ao anterior.
  const merged = [];
  steps.forEach(s => {
    if(merged.length && merged[merged.length-1].at === s.at) merged[merged.length-1] = s;
    else if(!merged.length || merged[merged.length-1].quadras !== s.quadras) merged.push(s);
    else if(s.at > merged[merged.length-1].at) { /* mesmo valor, degrau redundante — ignora */ }
  });
  return merged.length ? merged : [{ at: start, quadras: clampN(cat.quadras || 1) }];
}
function quadrasAtStep(steps, t){
  let n = steps[0].quadras;
  for(const s of steps){ if(s.at <= t) n = s.quadras; else break; }
  return n;
}
function gerarGradeDia(ev, items, quadrasTotais, horaInicioDiaStr){
  const inicioDia = hhmmToMin(horaInicioDiaStr) ?? 8*60;
  if(!quadrasTotais || quadrasTotais < 1) return { jogos: [], fimMin: inicioDia };

  // Cada categoria é montada de uma vez só, do primeiro ao último jogo dela,
  // ANTES de passar pra próxima — isso é o que mantém o cronograma
  // "agrupado" (cada quadra real fica reservada pra mesma categoria o dia
  // inteiro, só passando pra outra categoria quando a dona termina de vez).
  // A ordem de montagem é por horário de início (quem começa mais cedo tem
  // preferência de quadra), com empate pela ordem da lista.
  // Dentro da montagem de UMA categoria, se ela tiver degraus de quadra
  // (cat.quadraSteps), ela pode reivindicar quadra(s) extra do que sobrou —
  // livre porque ninguém pegou ainda, ou porque uma categoria já processada
  // terminou antes — e devolve o excesso se a cota cair (fases finais, por
  // exemplo). Categoria sem degrau nunca solta nem invade quadra de outra.
  const porCat = items.map((it, idx) => ({
    cat: it.cat, chave: it.chave,
    steps: normalizeCategoriaSteps(it.cat, quadrasTotais, inicioDia),
    pendentes: effectiveGames(it.chave).slice().sort((a,b) => a.num - b.num),
    _origIdx: idx,
  }));
  porCat.sort((a,b) => (a.steps[0].at - b.steps[0].at) || (a._origIdx - b._origIdx));

  const quadraFreeAt = Array(quadrasTotais).fill(inicioDia);
  const jogos = [];

  porCat.forEach(pc => {
    const fimDe = {};      // gnum -> minuto em que termina (previsto)
    const meusFins = [];   // fins dos jogos já marcados dessa categoria (regra de fases finais)
    let colunas = [];      // índices de quadra REAL "da vez" dessa categoria
    // menor horário em que a categoria já tem direito a N quadras ao mesmo
    // tempo (o primeiro degrau que alcança N) — usado pra nunca deixar a
    // categoria reivindicar uma quadra "extra" antes da hora combinada, nem
    // que essa quadra esteja livre desde cedo por acaso.
    function earliestForQuota(n){
      for(const s of pc.steps){ if(s.quadras >= n) return s.at; }
      return Infinity;
    }

    let guard = 0;
    while(pc.pendentes.length && guard < pc.pendentes.length + 200){
      guard++;
      const prontos = pc.pendentes.filter(g => gameDeps(pc.chave, g).every(d => fimDe[d] !== undefined));
      if(!prontos.length) break; // dependência não resolvida — não deveria acontecer, sai pra não travar
      prontos.sort((a,b) => a.num - b.num);
      const g = prontos[0];
      const deps = gameDeps(pc.chave, g);
      let earliest = deps.length ? Math.max(...deps.map(d => fimDe[d])) : pc.steps[0].at;
      // Fases finais: nunca mais de 2 jogos da MESMA categoria ao mesmo
      // tempo enquanto restam menos de 4 pra fechar (mesma regra de antes).
      if(pc.pendentes.length < 4){
        const finsDesc = meusFins.slice().sort((a,b) => b-a);
        if(finsDesc.length >= 2) earliest = Math.max(earliest, finsDesc[1]);
      }
      // 1) converge a cota "de descida" olhando só pras quadras que já são
      // da categoria (nunca considera quadra nova aqui — só solta excesso
      // se a cota cair antes do jogo realmente poder começar).
      let refTime = earliest;
      for(let iter=0; iter<8; iter++){
        const capNow = quadrasAtStep(pc.steps, refTime);
        if(colunas.length > capNow) colunas = colunas.slice(0, capNow);
        if(!colunas.length) break;
        let bestOwned = colunas[0];
        for(const i of colunas) if(quadraFreeAt[i] < quadraFreeAt[bestOwned]) bestOwned = i;
        const newRef = Math.max(quadraFreeAt[bestOwned], earliest);
        if(newRef === refTime) break;
        refTime = newRef;
      }
      const capNow = quadrasAtStep(pc.steps, refTime);
      if(colunas.length > capNow) colunas = colunas.slice(0, capNow);

      // 2) escolhe entre esperar numa quadra já "da vez" ou reivindicar uma
      // quadra nova — só permitido a partir do horário do degrau que libera
      // essa unidade extra, mesmo que fisicamente já esteja livre antes.
      let idx = null, startAt = Infinity, viaNova = false;
      if(colunas.length){
        let bestOwned = colunas[0];
        for(const i of colunas) if(quadraFreeAt[i] < quadraFreeAt[bestOwned]) bestOwned = i;
        idx = bestOwned;
        startAt = Math.max(quadraFreeAt[bestOwned], earliest);
      }
      if(colunas.length < capNow){
        const threshold = earliestForQuota(colunas.length + 1);
        let bestNovo = null, bestNovoStart = Infinity;
        for(let i=0; i<quadraFreeAt.length; i++){
          if(colunas.includes(i)) continue;
          const st = Math.max(quadraFreeAt[i], earliest, threshold);
          if(st < bestNovoStart){ bestNovoStart = st; bestNovo = i; }
        }
        if(bestNovo !== null && bestNovoStart < startAt){
          idx = bestNovo; startAt = bestNovoStart; viaNova = true;
        }
      }
      if(viaNova) colunas.push(idx);

      const dur = duracaoJogo(ev, g);
      const fim = startAt + dur;
      jogos.push({ chaveId: pc.chave.id, categoria: pc.chave.nome, gnum: g.num, fase: g.fase, quadraIdx: idx, inicio: startAt, fim });
      quadraFreeAt[idx] = fim;
      fimDe[g.num] = fim;
      meusFins.push(fim);
      pc.pendentes = pc.pendentes.filter(x => x.num !== g.num);
    }
  });

  const fimMin = jogos.length ? Math.max(...jogos.map(j => j.fim)) : inicioDia;
  return { jogos, fimMin };
}
function setCategoriaConfig(catId, patch){
  const cat = getCategoria(catId);
  if(!cat) return;
  Object.assign(cat, patch);
  updateCategoria(cat);
}
// Degraus de quadras ao longo do dia pra uma categoria (cat.quadraSteps —
// [{horaInicio, quadras}, ...]), além do quadras/horaInicio simples de
// sempre — pedido do Ed pra poder aumentar (ou diminuir, nas fases finais)
// o número de quadras de uma categoria a partir de um horário específico.
function addCategoriaStep(catId){
  const cat = getCategoria(catId);
  if(!cat) return;
  const steps = (cat.quadraSteps || []).slice();
  steps.push({ horaInicio:'', quadras: cat.quadras || 1 });
  setCategoriaConfig(catId, { quadraSteps: steps });
}
function setCategoriaStep(catId, idx, patch){
  const cat = getCategoria(catId);
  if(!cat) return;
  const steps = (cat.quadraSteps || []).slice();
  if(!steps[idx]) return;
  steps[idx] = Object.assign({}, steps[idx], patch);
  setCategoriaConfig(catId, { quadraSteps: steps });
}
function removeCategoriaStep(catId, idx){
  const cat = getCategoria(catId);
  if(!cat) return;
  const steps = (cat.quadraSteps || []).slice();
  steps.splice(idx, 1);
  setCategoriaConfig(catId, { quadraSteps: steps });
}
function getDiaConfig(ev, data){
  const c = (ev.diasConfig && ev.diasConfig[data]) || {};
  // quadraCategoria: {quadraIdx -> chaveId} — fixação manual de qual
  // categoria aparece em qual quadra no mapa (Ed, 21/08/2026: "a ordem dos
  // jogos e a disposição das categorias está errada", pediu uma opção pra
  // alterar diretamente em vez de depender só do cálculo automático).
  return { quadras: c.quadras || 0, horaInicio: c.horaInicio || '08:00', horaLimite: c.horaLimite || '', quadraCategoria: c.quadraCategoria || {} };
}
function setDiaConfig(eventoId, data, patch){
  const ev = getEvento(eventoId);
  if(!ev) return;
  ev.diasConfig = Object.assign({}, ev.diasConfig);
  ev.diasConfig[data] = Object.assign({}, getDiaConfig(ev, data), patch);
  updateEvento(ev);
}
// Fixa (ou libera, se chaveId for '') manualmente qual categoria aparece
// numa quadra específica do mapa daquele dia — sobrepõe o cálculo automático
// (gerarGradeDia) só pra essa quadra, só naquele dia.
function setQuadraMapaCategoria(eventoId, dia, quadraIdx, chaveId){
  const ev = getEvento(eventoId);
  if(!ev) return;
  const dc = getDiaConfig(ev, dia);
  const quadraCategoria = Object.assign({}, dc.quadraCategoria);
  if(chaveId) quadraCategoria[quadraIdx] = chaveId; else delete quadraCategoria[quadraIdx];
  setDiaConfig(eventoId, dia, { quadraCategoria });
  toast(chaveId ? 'Quadra atualizada' : 'Essa quadra voltou a seguir o horário automático');
}
function setEventoDuracao(eventoId, field, value){
  const ev = getEvento(eventoId);
  if(!ev) return;
  const n = parseInt(value, 10);
  // Corrigido 18/09: o HTML tem min="5" mas isso não é reforçado no JS —
  // um valor negativo digitado (ou colado) direto no campo passava puro
  // pra duracaoJogo() e invertia o horário dos jogos na grade. Trava em 5.
  ev[field] = isNaN(n) ? undefined : Math.max(5, n);
  updateEvento(ev);
}
// Paleta fixa (fundo claro + texto escuro correspondente) — mais previsível e
// bonita na tela e no PDF do que gerar cor por hash do nome. Usada pra
// colorir a grade do cronograma (uma cor por categoria).
const GRADE_PALETTE = [
  ['#dbe9ff','#1c4ea3'], ['#ffe4d6','#a3521c'], ['#e0f5d8','#2f7a2f'], ['#fde2ef','#a3235f'],
  ['#e6dbff','#5b3ea3'], ['#fff3c4','#8a6d0a'], ['#d8f5f0','#127a6b'], ['#ffe0e0','#a32424'],
  ['#dcf0ff','#0a5f8a'], ['#f0e6d8','#7a5a2f'], ['#e8e0f7','#4a3a8a'], ['#d8f0e6','#1f6b4f']
];
function corMapCategorias(itens){
  const map = {};
  itens.forEach(x => { if(!(x.categoria in map)) map[x.categoria] = GRADE_PALETTE[Object.keys(map).length % GRADE_PALETTE.length]; });
  return map;
}
function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
