function route(){
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);
  // A raiz "/" agora É o modo público (lista de eventos publicados) — quem
  // acessa o link do evento cai direto lá, sem precisar logar. "/pub" continua
  // funcionando como sinônimo (links/QR codes antigos). "/atleta/..." tem seu
  // próprio login, separado do organizador (ver bloco mais abaixo). Só
  // "/organizador" e as telas de edição (evento, categoria, chave...) exigem
  // o login do ORGANIZADOR especificamente.
  const isPub = hash === '/' || hash === '/pub' || parts[0] === 'pub';
  const isAtletaRoute = parts[0] === 'atleta';

  // Além de esperar o Firebase Auth resolver (_authInitialized), quem está
  // logado também precisa esperar carregarMeuAtletaPerfil() decidir o papel
  // (_roleChecked) antes de qualquer rota não-pública — senão isOrganizador()/
  // isAtletaLogado() ainda não têm resposta certa (ver comentário lá em cima).
  if(!isPub && (!_authInitialized || (_authUser && !_roleChecked))){
    app.innerHTML = `${header('Chaveamento', null, null)}<div class="wrap"><div class="empty"><div class="big">⏳</div><div style="font-weight:700;">Carregando…</div></div></div>`;
    return; // onAuthStateChanged/carregarMeuAtletaPerfil chamam route() de novo ao resolver
  }

  // ---- atleta (login/cadastro próprios, separados do organizador) ----
  if(isAtletaRoute){
    const sub = parts[1];
    if(!sub || sub === 'login' || sub === 'cadastro'){
      if(isAtletaLogado()){ const dest = _posLoginRedirectHash || '/atleta/home'; _posLoginRedirectHash = null; location.hash = dest; return; }
      return sub === 'cadastro' ? renderAtletaCadastro() : renderAtletaLogin();
    }
    if(!_authUser) return renderAtletaLogin();
    if(isOrganizador()){ location.hash = '/organizador'; return; } // organizador não tem tela de atleta
    if(sub === 'home') return renderAtletaHome();
    if(sub === 'inscrever-evento') return renderAtletaEventoInscricaoView(parts[2]);
    if(sub === 'inscrever') return renderAtletaInscricaoForm(parts[2], parts[3]);
    if(sub === 'minhas-inscricoes') return renderAtletaMinhasInscricoes();
    if(sub === 'carrinho') return renderAtletaCarrinhoView();
    if(sub === 'pagamento') return renderAtletaPagamentoView(parts[2]);
    if(sub === 'perfil') return renderAtletaPerfil();
    return renderAtletaHome();
  }

  if(!isPub){
    // Autenticado mas NÃO é o organizador (é um atleta que caiu numa URL de
    // organizador) — manda pra área dele em vez de mostrar a tela de login
    // (que só confundiria: a conta dele existe e funciona, só não é essa área).
    if(_authUser && !isOrganizador()){ location.hash = '/atleta/home'; return; }
    if(!_authUser) return renderLoginGate();
  }

  // ---- organizador (autenticado) ----
  if(hash === '/organizador') return renderEventosHome();
  if(hash === '/inscricoes-pendentes') return renderInscricoesPendentesView();
  if(hash === '/cts-pendentes') return renderCtsPendentesView();
  if(hash === '/novo-evento') return renderEventoSetup();
  if(parts[0] === 'editar-evento') return renderEventoSetup(parts[1]);
  if(parts[0] === 'evento') return renderEventoView(parts[1], parts[2] ? decodeURIComponent(parts[2]) : null);
  if(parts[0] === 'nova-categoria') return renderSetup(null, { eventoId:parts[1], data:decodeURIComponent(parts[2]) });
  if(parts[0] === 'importar-lista') return renderImportLista(parts[1], decodeURIComponent(parts[2]));
  if(parts[0] === 'cronograma') return renderCronograma(parts[1], decodeURIComponent(parts[2]));
  if(parts[0] === 'visao-geral') return renderVisaoGeralView(parts[1], decodeURIComponent(parts[2]));
  if(parts[0] === 'podio') return renderPodioGeralView(parts[1]);
  if(hash === '/ranking-atletas') return renderRankingAtletasView();
  if(parts[0] === 'chave') return renderChaveView(parts[1]);
  if(parts[0] === 'editar') return renderSetup(parts[1]);

  // ---- público (somente leitura, sem login) ----
  if(hash === '/' || hash === '/pub') return renderPubEventos();
  if(parts[0] === 'pub' && parts[1] === 'evento' && parts.length === 3) return renderPubEventoView(parts[2]);
  if(parts[0] === 'pub' && parts[1] === 'evento' && parts.length >= 4) return renderPubDiaView(parts[2], decodeURIComponent(parts[3]));
  if(parts[0] === 'pub' && parts[1] === 'visao-geral') return renderPubVisaoGeralView(parts[2], decodeURIComponent(parts[3]));
  if(parts[0] === 'pub' && parts[1] === 'podio') return renderPubPodioView(parts[2]);
  if(parts[0] === 'pub' && parts[1] === 'chave') return renderPubChaveView(parts[2]);
  if(parts[0] === 'pub' && parts[1] === 'ranking' && parts.length === 2) return renderPubRankingHomeView();
  if(parts[0] === 'pub' && parts[1] === 'ranking' && parts.length === 3) return renderPubRankingCampeonatoView(decodeURIComponent(parts[2]));
  if(parts[0] === 'pub' && parts[1] === 'ranking' && parts.length === 4){
    const nomeRk = decodeURIComponent(parts[2]);
    if(parts[3] === '__atletas__') return renderPubRankingCampeonatoAtletasView(nomeRk);
    if(parts[3] === '__cts__') return renderPubRankingCampeonatoCTsView(nomeRk);
    return renderPubRankingCategoriaView(nomeRk, decodeURIComponent(parts[3]));
  }
  if(parts[0] === 'pub' && parts[1] === 'ranking' && parts.length === 5 && parts[3] === '__atletas__'){
    return renderPubRankingCampeonatoAtletaCategoriaView(decodeURIComponent(parts[2]), decodeURIComponent(parts[4]));
  }
  if(parts[0] === 'pub' && parts[1] === 'ranking-etapa') return renderPubRankingEtapaView(parts[2]);

  return renderPubEventos();
}

function doAtletaCadastro(){
  const nome = (document.getElementById('acNome').value||'').trim();
  const nomeAtleta = (document.getElementById('acNomeAtleta').value||'').trim();
  const dataNascimento = document.getElementById('acNascimento').value||'';

  if(cpf.length !== 11){ atletaCadastroErro = 'CPF deve ter 11 números.'; renderAtletaCadastro(); return; }
  if(senha.length < 6){ atletaCadastroErro = 'A senha precisa ter pelo menos 6 caracteres.'; renderAtletaCadastro(); return; }

  if(ct) garantirCtCadastrado(ct);
  // O onAuthStateChanged disparado por createUserWithEmailAndPassword já
  // chama carregarMeuAtletaPerfil() sozinho — mas nesse primeiro instante o

function hojeStr(){ return new Date().toISOString().slice(0,10); }
// Aberto pra inscrição = publicado + tem pelo menos 1 lote cadastrado + o
// período de algum lote ainda não terminou (ver hint em renderEventoSetup).
function eventosAbertosParaInscricao(){
  const hoje = hojeStr();
  return loadEventos().filter(ev => ev.publicado === true && (
    ev.inscricaoGratuita === true || ((ev.lotes||[]).length && (ev.lotes||[]).some(l => hoje <= l.fim))
  ));
}
// ---------- Inscrição pública por CATEGORIA (Ed, 18/09, 6ª rodada) ----------
// Preço/prazo de LOTE continuam no nível do EVENTO (sem mudança) — o que
// muda é que cada categoria (chave) ganha seu PRÓPRIO interruptor de
// aberta/fechada, sua PRÓPRIA cota de vagas (independente do tamanho da
// chave/numTimes, que é sobre o FORMATO do chaveamento, não sobre quantas
// inscrições aceitar) e seu PRÓPRIO prazo (data+hora), separado dos lotes de
// preço. Ed: "continuar por evento, mas tendo o interruptor de cada
// categoria, para abrir ou fechar inscrição dela... vagas e tamanho da
// chave são diferentes... prazo único, separado dos lotes."
// Categoria SEM o campo `inscricaoAberta` (criada antes dessa funcionalidade)
// continua aberta, igual sempre foi — só uma categoria NOVA nasce fechada
// por padrão (ver saveSetup), mesmo padrão já usado em chaveamentoVisivel().
function vagasDaCategoria(chave){
  return (chave.vagas != null) ? chave.vagas : chave.numTimes;
}
function prazoInscricaoPassou(chave){
  if(!chave.prazoInscricaoData) return false;
  const limite = new Date(chave.prazoInscricaoData + 'T' + (chave.prazoInscricaoHora || '23:59') + ':00');
  return Date.now() > limite.getTime();
}
function categoriaAbertaParaInscricao(chave){
  if(!chave) return false;
  if(chave.inscricaoAberta === false) return false;
  if(prazoInscricaoPassou(chave)) return false;
  return true;
}
// Linha de uma categoria dentro da lista de inscrição (usada tanto na home
// geral do atleta quanto na tela "dentro do evento" abaixo) — mesma lógica
// de status/vagas/fechada nos dois lugares, só o botão de ação muda.
function linhaInscricaoCategoriaHtml(ev, cat, chave, minhas){
  const minha = minhas.find(i => i.categoriaId === cat.id);
  const vagas = vagasDaCategoria(chave) - (chave.times||[]).filter(t => teamRowHasData(t, chave.modalidade)).length;
  let acao;
  if(minha){
    const stLabel = minha.status === 'pendente' ? '⏳ Pendente' : minha.status === 'aprovada' ? '✅ Inscrito' : '❌ Rejeitada';
    const stCls = minha.status === 'aprovada' ? 'done' : (minha.status === 'rejeitada' ? 'rejected' : 'wait');
    acao = `<span class="match-badge ${stCls}">${stLabel}</span>`;
  } else if(!categoriaAbertaParaInscricao(chave)){
    acao = `<span class="hint">Fechada</span>`;
  } else if(vagas <= 0){
    acao = `<span class="hint">Sem vagas</span>`;
  } else {
    acao = `<button class="btn ghost small" onclick="location.hash='/atleta/inscrever/${ev.id}/${cat.id}'">Inscrever-se</button>`;
  }
  const faixaIdade = (chave.idadeMin != null || chave.idadeMax != null)
    ? `<div class="hint" style="margin-top:-2px;">${chave.idadeMin!=null && chave.idadeMax!=null ? ('De '+chave.idadeMin+' a '+chave.idadeMax+' anos') : chave.idadeMin!=null ? ('A partir de '+chave.idadeMin+' anos') : ('Até '+chave.idadeMax+' anos')}</div>`
    : '';
  return `<div class="atleta-row" style="align-items:flex-start;"><div style="flex:1;"><div class="atleta-nomes">${escapeHtml(chave.nome)}</div>${faixaIdade}</div>${acao}</div>`;
}

// Busca um atleta cadastrado pelo CPF (11 dígitos) na cache já sincronizada
// via attachAtletasListener() e preenche o nome do parceiro automaticamente
// se achar — nunca deixa escolher o próprio CPF do titular como parceiro.
function buscarParceiroPorCpf(i){
  const s = inscricaoFormState;
  if(!s) return;
  const cpf = (s.parceirosCpf[i]||'').replace(/\D/g,'');
  if(cpf.length !== 11){ toast('Digite um CPF válido (11 números)'); return; }
  if(_authUser && cpf === (getMeuAtletaPerfil()||{}).cpf){ toast('Esse CPF é o seu próprio cadastro'); return; }
  const encontrado = _atletasCache.find(a => (a.cpf||'') === cpf);
  if(!encontrado){ toast('Nenhum atleta cadastrado com esse CPF — preencha os dados dele manualmente abaixo'); return; }
  s.parceiros[i] = (encontrado.nomeAtleta||'').trim() || encontrado.nome || '';
  s.parceirosUid[i] = encontrado.uid;
  renderAtletaInscricaoForm(s._eventoId, s._categoriaId);
}
function limparParceiroEncontrado(i){
  const s = inscricaoFormState;
  if(!s) return;
  s.parceirosUid[i] = null;
  s.parceiros[i] = '';
  s.parceirosCpf[i] = '';
  renderAtletaInscricaoForm(s._eventoId, s._categoriaId);
}
function cpfNorm(v){ return (v||'').replace(/\D/g,''); }
// ---------- preço 1ª/2ª+ considerando CPF, não só a conta logada ----------
// Ed, 21/09: "como é gerado a cobrança para aquele CPF caso ele... se
// inscreva por outro local" — antes só olhava as inscrições da PRÓPRIA
// conta logada; agora considera qualquer aparição desse CPF no evento,
// seja como titular OU como parceiro (inclusive ainda só no carrinho local,
// sem ter sido enviada). Limitação conhecida: só enxerga o que passa pela
// conta logada agora (próprias inscrições enviadas + carrinho) — se a MESMA
// pessoa se inscrever de forma independente, por outra conta, isso exigiria
// abrir a leitura de todas as inscrições do evento pra qualquer atleta
// logado (troca de privacidade que não foi pedida); nesse caso o
// organizador ajusta manualmente o valor na aprovação.
function cpfJaApareceuNoEvento(cpf, eventoId){
  const c = cpfNorm(cpf);
  if(!c) return false;
  const emInscricaoEnviada = _minhasInscricoesCache.some(i => i.eventoId === eventoId && i.status !== 'rejeitada' && (
    cpfNorm(i.titularCpf) === c || (i.parceirosCpf||[]).some(pc => cpfNorm(pc) === c)
  ));
  if(emInscricaoEnviada) return true;
  return carrinhoAtleta.some(item => item.eventoId === eventoId && item.membros.some(m => cpfNorm(m.cpf) === c));
}
function itemEhPrimeiraNoEvento(membros, eventoId){
  return !membros.some(m => cpfJaApareceuNoEvento(m.cpf, eventoId));
}
// Monta o "membro" (titular ou parceiro) no formato usado pelo carrinho e
// pela validação de idade — mesma forma pra quem tem conta (dados puxados
// de _atletasCache) e pra quem foi digitado na hora (miniregistro).
function montarMembrosDoFormulario(chave, perfil){
  const s = inscricaoFormState;
  const parceirosCount = modalidadeParceirosCount(chave.modalidade);
  const titular = { papel:'titular', nome: perfil.nome||'', nomeAtleta: perfil.nomeAtleta||'', cpf: perfil.cpf||'', dataNascimento: perfil.dataNascimento||'', ct: perfil.ct||'', uid: _authUser.uid };
  const parceiros = Array.from({length:parceirosCount}, (_,i) => {
    const uid = s.parceirosUid[i];
    if(uid){
      const at = _atletasCache.find(a => a.uid === uid) || {};
      return { papel:'parceiro', nome: at.nome || s.parceiros[i] || '', nomeAtleta: at.nomeAtleta || '', cpf: at.cpf || '', dataNascimento: at.dataNascimento || '', ct: at.ct || '', uid };
    }
    return { papel:'parceiro', nome: (s.parceirosNomeCompleto[i]||'').trim(), nomeAtleta: (s.parceirosNomeAtleta[i]||'').trim(), cpf: cpfNorm(s.parceirosCpf[i]), dataNascimento: s.parceirosDataNascimento[i]||'', ct: (s.parceirosCt[i]||'').trim(), uid: null };
  });
  return [titular].concat(parceiros);
}
function adicionarAoCarrinho(eventoId, categoriaId){
  const s = inscricaoFormState;
  const ev = getEvento(eventoId);
  const cat = getCategoria(categoriaId);
  const chave = cat ? getChave(cat.chaveId) : null;
  const perfil = getMeuAtletaPerfil();
  if(!ev || !chave || !s || !perfil) return;
  const nomeTime = (s.nomeTime||'').trim();
  // Ed, 21/09: "na dupla retire o nome do time" — dupla não pede/exige nome
  // de time na inscrição (mostra "Fulana / Sicrana" direto, como sempre foi
  // pro cadastro manual do organizador); trio/quarteto continuam exigindo,
  // já que ali o time é a identidade principal na chave.
  if(chave.modalidade !== 'dupla' && !nomeTime){ toast('Dê um nome pro seu time'); return; }
  const parceirosCount = modalidadeParceirosCount(chave.modalidade);
  for(let i=0; i<parceirosCount; i++){
    const encontrado = s.parceirosUid[i];
    if(encontrado) continue;
    if(!(s.parceirosNomeCompleto[i]||'').trim() || !(s.parceirosDataNascimento[i]||'').trim()){
      toast('Preencha nome completo e data de nascimento de todos os parceiros (ou busque pelo CPF)');
      return;
    }
  }
  const membros = montarMembrosDoFormulario(chave, perfil);
  const foraDaFaixa = membrosForaDaFaixa(membros, chave, ev.dataInicio);
  if(foraDaFaixa.length){
    toast('Fora da faixa de idade da categoria: ' + foraDaFaixa.map(m => (m.nome||'—') + ' (' + m.idade + ' anos)').join(', '));
    return;
  }
  const ehPrimeira = itemEhPrimeiraNoEvento(membros, eventoId);
  const preco = precoInscricao(ev, hojeStr(), ehPrimeira);
  if(preco == null){ toast('Inscrições fechadas pra esse evento no momento'); return; }
  carrinhoAtleta.push({
    id: uid('cart'), eventoId, categoriaId, chaveId: chave.id, eventoNome: ev.nome, categoriaNome: chave.nome,
    nomeTime, membros, tamanhoCamiseta: s.camiseta || null, valor: preco, ehPrimeira
  });
  inscricaoFormState = null;
  toast('Adicionado ao carrinho!');
  location.hash = '/atleta/carrinho';
}

// Só AQUI (finalizar) que cada item do carrinho vira uma inscrição de
// verdade no Firestore — até esse momento não existia nenhum registro,
// nenhuma vaga foi ocupada, nada apareceu pro organizador.
function finalizarCarrinho(){
  if(!carrinhoAtleta.length) return;
  const itens = carrinhoAtleta.slice();
  Promise.all(itens.map(it => {
    it.membros.slice(1).forEach(m => { if(m.ct) garantirCtCadastrado(m.ct); });
    return criarInscricao({
      atletaUid: _authUser.uid, eventoId: it.eventoId, categoriaId: it.categoriaId, chaveId: it.chaveId,
      nomeTime: it.nomeTime,
      parceiros: it.membros.slice(1).map(m => m.nomeAtleta || m.nome || ''),
      parceirosUids: it.membros.slice(1).map(m => m.uid || null),
      parceirosCpf: it.membros.slice(1).map(m => m.cpf || null),
      parceirosNomeCompleto: it.membros.slice(1).map(m => m.nome || null),
      parceirosDataNascimento: it.membros.slice(1).map(m => m.dataNascimento || null),
      parceirosCt: it.membros.slice(1).map(m => m.ct || null),
      titularCpf: it.membros[0].cpf || null,
      tamanhoCamiseta: it.tamanhoCamiseta || null, valor: it.valor
    });
  })).then((inscricoesCriadas) => {
    carrinhoAtleta = [];
    const ids = inscricoesCriadas.map(i => i.id).join(',');
    const totalPago = inscricoesCriadas.reduce((s,i) => s + (i.valor||0), 0);
    if(totalPago > 0){
      toast('Inscrições enviadas!');
      location.hash = '/atleta/pagamento/' + ids;
    } else {
      toast('Inscrições enviadas! Aguarde a aprovação do organizador.');
      location.hash = '/atleta/minhas-inscricoes';
    }
  }).catch(err => {
    console.error('finalizarCarrinho', err);
    toast('Não deu pra enviar agora — tenta de novo em alguns segundos');
  });
}

// define o tamanho da chave, então precisa bater com SIZES), aqui é o
// contrário: o organizador já fixou chave.numTimes quando criou a categoria
// (ex.: "8 duplas"), e as inscrições vão enchendo as vagas progressivamente —
// times[] pode legitimamente ficar mais curto que numTimes enquanto sobram
// vagas (teamLabel()/matchInfo() já tratam um slot ainda vazio como "a
// definir"). Por isso a trava aqui é só "não passar de numTimes", nunca
// SIZES.includes(...).
function aprovarInscricao(id){
  const insc = getInscricao(id);
  if(!insc) return;
  const cat = getCategoria(insc.categoriaId);
  const chave = cat ? getChave(cat.chaveId) : null;
  const atleta = getAtletaByUidOrg(insc.atletaUid);
  if(!chave || !atleta){ toast('Não achei a chave ou o perfil do atleta'); return; }
  // Prefere o "nome de atleta" (curto, de exibição — Ed, 18/09: "nome de
  // atleta também é importante", inspirado no jeito da CBVP de mostrar
  // "EVANDRO/RJ" na chave em vez do nome completo) quando o atleta cadastrou
  // um; sem isso, cai pro nome completo de sempre. Só o titular tem essa
  // preferência hoje — o(s) parceiro(s) entram como texto puro (ver
  // enviarInscricao/buscarParceiroPorCpf) e já usam o nome preferido deles
  // quando encontrados por CPF.
  const nomeExibicao = (atleta.nomeAtleta||'').trim() || atleta.nome;
  const nomeTimeInsc = (insc.nomeTime||'').trim();
  const novoTime = usaListaAtletas(chave.modalidade)
    ? { nome: nomeTimeInsc, atletas:[nomeExibicao].concat(insc.parceiros||[]).slice(0, modalidadeAtletasSlots(chave.modalidade)), ct: atleta.ct||'' }
    : { nome: nomeTimeInsc, atleta1: nomeExibicao, atleta2: (insc.parceiros||[])[0]||'', ct: atleta.ct||'' };
  // Quando a categoria já nasceu com "slots" reservados pro tamanho da
  // chave (linhas em branco, ex.: organizador criou a chave com 8 vagas
  // pra preencher via inscrição pública), a aprovação preenche o primeiro
  // slot vazio em vez de crescer o array — senão o array passaria do
  // numTimes e o próprio chaveamento ficaria com mais times que o formato
  // suporta. Categorias "antigas" com times:[] (sem slots reservados)
  // continuam simplesmente crescendo um por um, como sempre foi.
  const timesAtuais = chave.times || [];
  const slotVazioIdx = timesAtuais.findIndex(t => !teamRowHasData(t, chave.modalidade));
  const novoTimes = slotVazioIdx >= 0
    ? timesAtuais.map((t,i) => i === slotVazioIdx ? novoTime : t)
    : timesAtuais.concat([novoTime]);
  const vagas = vagasDaCategoria(chave);
  // Conta TIMES DE VERDADE (não o tamanho do array, que já pode incluir
  // slots em branco reservados pro tamanho da chave) — senão uma categoria
  // criada com N slots vazios nunca deixaria aprovar nenhuma inscrição.
  const timesReaisDepois = novoTimes.filter(t => teamRowHasData(t, chave.modalidade)).length;
  if(timesReaisDepois > vagas){
    toast('Essa categoria já está com todas as ' + vagas + ' vagas preenchidas — abra mais vagas na tela da chave, ou ajuste manualmente em "Editar chave"');
    return;
  }
  const temPlacar = Object.keys(chave.resultados||{}).length > 0;
  if(temPlacar){
    toast('Essa categoria já tem placar lançado — adicione esse time manualmente em "Editar chave"');
    return;
  }
  chave.times = novoTimes;
  updateChave(chave);
  updateInscricaoStatus(id, 'aprovada');
  toast('Inscrição aprovada — time adicionado à chave');
}
function rejeitarInscricao(id){
  if(!confirm('Rejeitar essa inscrição?')) return;
  updateInscricaoStatus(id, 'rejeitada');
  toast('Inscrição rejeitada');
}

window.addEventListener('hashchange', route);
// Live-ish updates for the read-only público screens: pick up changes saved by
// the organizador in another tab/window of the same browser (storage event),
// plus a light poll as a fallback so a screen left open keeps refreshing.
window.addEventListener('storage', (e) => {
  if(String(e.key||'').indexOf('chaveamento_v1_') === 0) route();
});
// This is a defensive fallback, not the primary update mechanism — Firestore's
// onSnapshot listeners already push route() reactively the instant data
// changes, in real time. Re-rendering the whole screen from scratch every 4s
// regardless of whether anything changed was wasteful (and visibly janky —
// it could interrupt a scroll or an in-progress pinch-zoom on the árvore), so
// this now just runs occasionally in case a snapshot listener ever misses
// something (dropped connection, etc), not as the normal update path.
setInterval(() => {
  const h = location.hash.slice(1) || '/';
  if(h === '/' || h.indexOf('/pub') === 0) route();
}, 20000);

    <div style="display:flex; align-items:center; gap:10px;">
      ${bgUrl ? `<img src="${bgUrl}" style="width:44px; height:44px; object-fit:contain; background:#eef2f2; border-radius:8px; padding:4px; flex:none;">` : ''}

function confirmDeleteEvento(id){
  const ev = getEvento(id);
  if(!ev) return;
  const cats = loadCategorias().filter(c => c.eventoId === id);
  if(confirm(`Excluir o evento "${ev.nome}"? Isso apaga também ${cats.length} categoria(s) e suas chaves. Essa ação não pode ser desfeita.`)){
    deleteEvento(id);
    renderEventosHome();
    toast('Evento excluído');
  }
}

// Uma entrada de quadra é {nome, lado} — "lado" ('esquerda'|'direita') é o
// que alimenta o mapa visual (Ed, 21/08/2026: quadras de um lado e do outro
// da arena, igual a foto que ele mandou). Versões antigas gravaram só string
// (sem lado) — normaliza pra sempre virar objeto, default 'esquerda'.
function normQuadraNome(q){
  if(typeof q === 'string') return { nome:q, lado:'esquerda' };
  return { nome:(q && q.nome) || '', lado:(q && q.lado) === 'direita' ? 'direita' : 'esquerda' };
}

  const patrocinadoresRow = s.patrocinadores.length ? `<div class="patrocinador-row">
    ${s.patrocinadores.map((url,i) => `<div class="patrocinador-thumb"><img src="${url}"><button class="rm" onclick="removePatrocinador(${i})">✕</button></div>`).join('')}

// Lotes de pagamento (pedido do Ed, 18/09): cada lote tem uma faixa de datas
// e dois preços — 1ª inscrição do atleta nesse evento, e 2ª/3ª ou mais (pra
// quem se inscreve em mais de uma categoria). Ver precoInscricao() mais abaixo
// pra como isso é usado na hora de calcular o valor de uma inscrição real.
function loteEditRows(lotes){
  if(!lotes.length) return '<div class="hint">Nenhum lote cadastrado ainda.</div>';
  return lotes.map((l,i) => `<div class="card" style="padding:10px; margin-top:8px; margin-bottom:0;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
      <div style="flex:1; font-weight:700;">Lote ${i+1}</div>

    </div>

// Redimensiona no navegador (máx. 640px de largura, JPEG) antes de salvar —
// evita estourar o limite de 1MB por documento do Firestore com foto em base64
// (não usamos Firebase Storage aqui pra não somar mais um SDK/configuração).
function onEventoFotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 640;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      eventoSetupState.fotoUrl = canvas.toDataURL('image/jpeg', 0.72);
      renderEventoSetup(eventoSetupState._editId || '');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
// Mesmo esquema de redimensionar no navegador antes de salvar, só que bem
// menor (é um selinho de ~50px no cabeçalho, não uma foto de capa) e como
// PNG em vez de JPEG — logomarca costuma ter fundo transparente, e JPEG não
// tem canal alpha (viraria um fundo branco/preto sólido por trás da logo).

    img.onload = function(){
      const maxW = 300;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      eventoSetupState.logoUrl = canvas.toDataURL('image/png');

// Logos de patrocinador — pode escolher vários arquivos de uma vez
// (input multiple); cada um passa pelo mesmo redimensionamento pequeno em
// PNG da logomarca do evento, e vai entrando na lista um a um conforme
// termina de carregar (não precisa esperar todos pra ver o primeiro).
function onEventoPatrocinadorSelected(e){

  if(!files.length) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 300;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        eventoSetupState.patrocinadores = (eventoSetupState.patrocinadores || []).concat([canvas.toDataURL('image/png')]);
        renderEventoSetup(eventoSetupState._editId || '');

}

// Move uma quadra pra cima/baixo DENTRO do seu próprio lado (Ed, 21/08/2026:
// "quero poder mover a quadra para o lugar e ordem certa, com a categoria e
// quadra") — o array quadrasNomes intercala os dois lados livremente, então
// "vizinho" aqui significa o PRÓXIMO índice na direção pedida que tenha o
// MESMO lado, não necessariamente o índice adjacente no array. Isso faz um
// clique sempre mover uma posição dentro da coluna visual (mapa e editor),
// sem misturar com o outro lado. A ordem final do array é exatamente a ordem
// usada pelo mapa (renderQuadraMapHtml lê nomes[i] em ordem).
function moveQuadraNome(idx, dir){
  const s = eventoSetupState;
  const list = s.quadrasNomes || [];
  const q = list[idx];
  if(!q) return;
  let j = idx + dir;
  while(j >= 0 && j < list.length && list[j].lado !== q.lado) j += dir;
  if(j < 0 || j >= list.length) return; // já é a primeira/última do seu lado
  const tmp = list[j];
  list[j] = list[idx];
  list[idx] = tmp;
  s.quadrasNomes = list;
  persistQuadrasNomesSeExistir(s);
  renderEventoSetup(s._editId || '');
}

// Valida os lotes antes de salvar: datas presentes e em ordem, valores
// numéricos não-negativos. Não bloqueia sobreposição entre lotes (avisado só
// como hint na tela) — o organizador pode ter um motivo pra isso, e
// precoInscricao() sempre usa o PRIMEIRO lote cuja faixa contém a data.
function validarLotes(lotes){
  for(let i=0; i<lotes.length; i++){
    const l = lotes[i];
    if(!l.inicio || !l.fim) return `Lote ${i+1}: informe início e fim`;
    if(l.fim < l.inicio) return `Lote ${i+1}: o fim não pode ser antes do início`;
    if(l.valor1a == null || l.valorDemais == null) return `Lote ${i+1}: informe os dois valores`;
  }
  return null;
}

// Calcula o preço de UMA inscrição (uma categoria) dado o evento, a data de
// referência (normalmente "agora", string 'YYYY-MM-DD') e se é a 1ª
// inscrição do atleta nesse evento ou a 2ª/3ª+ — pedido do Ed (18/09), regra
// exata: HANDOFF_se7_chaveamento.md, seção "Pagamento". Usa o PRIMEIRO lote
// cuja faixa [inicio,fim] contém a data de referência; sem lote ativo,
// retorna null (quem chamar decide o que fazer — ex.: bloquear inscrição).
function precoInscricao(evento, dataRefStr, ehPrimeira){
  // Evento gratuito (Ed, 18/09: "tem a necessidade de fazer a inscrição em
  // um campeonato gratuito") — inscrição sempre R$0, sem depender de lote
  // nenhum; a inscrição AINDA passa pela fila de aprovação de sempre (só o
  // valor que muda, não o fluxo pendente → aprovada).
  if(evento.inscricaoGratuita === true) return 0;
  const lotes = evento.lotes || [];
  const lote = lotes.find(l => l.inicio <= dataRefStr && dataRefStr <= l.fim);
  if(!lote) return null;
  return ehPrimeira ? lote.valor1a : lote.valorDemais;
}
function formatBRL(n){ return 'R$ ' + Number(n||0).toFixed(2).replace('.', ','); }
// ---------- faixa de idade por categoria (Ed, 21/09) ----------
// Idade em anos completos numa data de referência (a gente usa a data de
// INÍCIO do evento, não "hoje" — assim a validação não muda de resultado
// conforme os dias passam entre a inscrição e o evento de verdade). Datas no
// formato "YYYY-MM-DD" (o mesmo que <input type=date> já usa em todo canto).
function calcularIdade(dataNascStr, dataRefStr){
  if(!dataNascStr || !dataRefStr) return null;
  const nasc = new Date(dataNascStr + 'T00:00:00');
  const ref = new Date(dataRefStr + 'T00:00:00');
  if(isNaN(nasc.getTime()) || isNaN(ref.getTime())) return null;
  let idade = ref.getFullYear() - nasc.getFullYear();
  const aindaNaoFezAniversario = (ref.getMonth() < nasc.getMonth()) || (ref.getMonth() === nasc.getMonth() && ref.getDate() < nasc.getDate());
  if(aindaNaoFezAniversario) idade--;
  return idade;
}
// Confere se UMA pessoa está dentro da faixa de idade da chave — chave sem
// idadeMin/idadeMax (a maioria, categorias sem restrição) sempre libera.
// Sem data de nascimento pra comparar, também libera (deixa o organizador
// resolver na aprovação manual em vez de travar a inscrição por falta de
// dado) — mas isso só deveria acontecer em cadastros bem antigos, já que o
// cadastro do atleta e o miniformulário de parceiro (ver enviarInscricao)
// exigem data de nascimento.
function idadePermitida(dataNascStr, chave, dataRefStr){
  if(chave.idadeMin == null && chave.idadeMax == null) return true;
  const idade = calcularIdade(dataNascStr, dataRefStr);
  if(idade == null) return true;
  if(chave.idadeMin != null && idade < chave.idadeMin) return false;
  if(chave.idadeMax != null && idade > chave.idadeMax) return false;
  return true;
}
// Valida TODO o time (titular + parceiros) de uma vez — devolve a lista de
// quem ficou fora da faixa (nome + idade calculada), pra mostrar um erro
// específico em vez de um "não pode" genérico.
function membrosForaDaFaixa(membros, chave, dataRefStr){
  return membros.filter(m => m.dataNascimento && !idadePermitida(m.dataNascimento, chave, dataRefStr))
    .map(m => ({ nome: m.nome, idade: calcularIdade(m.dataNascimento, dataRefStr) }));
}
// Lote ativo HOJE (pra mostrar o preço atual nos cards/hero da área pública)
// — null se não tiver inscrição aberta agora (evento sem lote pra data atual).
function loteAtivoHoje(evento){
  const hoje = hojeStr();
  return (evento.lotes || []).find(l => l.inicio <= hoje && hoje <= l.fim) || null;
}

function duplicateCategoria(catId){

function teamRowHasData(t, modalidade){
  if(!t) return false;

}

function setModalidade(m){
  if(m === setupState.modalidade) return;
  if(setupState.times.some(t => teamRowHasData(t, setupState.modalidade)) && !confirm('Trocar a modalidade vai limpar os times já preenchidos. Continuar?')) return;
  setupState.modalidade = m;
  setupState.times = setupState.times.map(()=> emptyTeam(m));
  renderSetup(setupState._editId || '');
}
function addTeamRow(){
  setupState.times.push(emptyTeam(setupState.modalidade));
  renderSetup(setupState._editId || '');
}
function removeTeamRow(idx){
  setupState.times.splice(idx,1);
  renderSetup(setupState._editId || '');
}
function moveTeamRow(idx, dir){
  const arr = setupState.times;
  const j = idx + dir;
  if(j < 0 || j >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  renderSetup(setupState._editId || '');
}
function setModoTimes(m){
  setupState._modoTimes = m;
  renderSetup(setupState._editId || '');
}
function shuffleTeams(){
  const arr = setupState.times;
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  renderSetup(setupState._editId || '');
  toast('Ordem sorteada');
}
function pickSize(n){
  const arr = setupState.times;
  if(n > arr.length){
    while(arr.length < n) arr.push(emptyTeam(setupState.modalidade));
  } else if(n < arr.length){
    const losingData = arr.slice(n).some(t => teamRowHasData(t, setupState.modalidade));
    if(losingData && !confirm('Isso vai remover times já preenchidos do final da lista. Continuar?')) return;
    setupState.times = arr.slice(0, n);
  }
  renderSetup(setupState._editId || '');
}
function autoFillTeams(){
  setupState.times.forEach((t,i) => {
    if(usaListaAtletas(setupState.modalidade)){
      if(!t.nome || !t.nome.trim()) t.nome = 'Time ' + (i+1);
    } else {
      if(!t.atleta1 || !t.atleta1.trim()) t.atleta1 = 'Atleta ' + (i+1) + 'A';
      if(!t.atleta2 || !t.atleta2.trim()) t.atleta2 = 'Atleta ' + (i+1) + 'B';
    }
  });
  renderSetup(setupState._editId || '');
}

// ---------- importar times de uma planilha (.xlsx/.csv) ----------
// SheetJS (~1MB) is only needed on this one screen, so it's fetched on
// demand the first time someone actually clicks "Importar planilha" instead
// of being loaded on every single page view — that unconditional <script>
// tag was adding real weight to every load, público included, for a feature
// almost nobody touches on any given visit.
let xlsxLoadPromise = null;
function ensureXlsxLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => { xlsxLoadPromise = null; reject(new Error('xlsx load failed')); };
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
function triggerImportPlanilha(){
  toast('Carregando leitor de planilha…');
  ensureXlsxLoaded()
    .then(() => document.getElementById('importPlanilhaInput').click())
    .catch(() => toast('Não consegui carregar o leitor de planilha — confira sua internet'));
}
// ---------- colar lista de times (texto simples, sem planilha) ----------
// Pra quando o Ed já tem a lista de times em mãos (mandada por WhatsApp,
// copiada de outro lugar etc.) e não quer digitar time por time nos campos
// separados. Uma linha = um time, com os "campos" dessa linha (nomes das
// pessoas — cada um podendo vir com nome e sobrenome — e, no quarteto, o
// nome do time também) separados por "/" ou por um "x" isolado (com espaço
// dos dois lados, pra não confundir com um "x" que faça parte de um nome
// como "Alex" ou "Max").
function toggleColarLista(){
  setupState._pasteOpen = !setupState._pasteOpen;
  if(!setupState._pasteOpen) setupState._pasteText = '';
  renderSetup(setupState._editId || '');
}
// Pure parser (no DOM, no setupState) so it's independently testable: one
// line in -> one team out. Every field within a line (person names — first
// + last name allowed, since we only split on "/" or a standalone " x ",
// never on internal spaces — and, for quarteto, the team name too) is
// separated the same way. Dupla: "Nome Sobrenome / Nome Sobrenome" -> Atleta
// 1 / Atleta 2 (no separator -> whole line goes to Atleta 1, Atleta 2 blank).
// Quarteto: "Nome do Time / Atleta 1 / Atleta 2 / ..." -> first field is the
// team name, the rest fill the athlete slots in order (no separator -> whole
// line is just the team name, athlete slots blank, same as before).
function parseListaTimes(text, modalidade){
  const linhas = String(text||'').split(/\r?\n/).map(l => l.trim()).filter(l => l);
  return linhas.map(linha => {
    const partes = linha.split(/\s*\/\s*|\s+x\s+/i).map(p => p.trim());
    if(usaListaAtletas(modalidade)){
      const nome = partes[0] || '';
      const slots = modalidadeAtletasSlots(modalidade);
      const atletas = Array.from({length:slots}, (_,j) => partes[j+1] || '');
      return { nome, atletas };
    }
    return { atleta1: partes[0]||'', atleta2: partes[1]||'' };
  });
}
function processarListaColada(){
  const ta = document.getElementById('colarListaInput');
  const text = (ta && ta.value) ? ta.value : (setupState._pasteText || '');
  const novosTimes = parseListaTimes(text, setupState.modalidade);
  if(!novosTimes.length){ toast('Cole a lista de times primeiro'); return; }
  setupState.times = novosTimes;
  setupState._pasteOpen = false;
  setupState._pasteText = '';
  renderSetup(setupState._editId || '');
  toast(novosTimes.length + ' times adicionados a partir da lista — confira antes de salvar');
}
// Lê a planilha inteira no navegador (via SheetJS) e tenta reconhecer colunas
// pelo cabeçalho ("Atleta 1", "Nome do time", "Categoria" etc). Se não achar
// um cabeçalho reconhecível, assume que as colunas já vêm na ordem esperada.
function normHeader(s){
  return String(s==null?'':s).trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'');
}
// ---------- leitor genérico de planilha ----------
// Usado tanto pra importar times dentro de UMA categoria já criada quanto
// pra importação em lote de TODAS as categorias de uma vez, a partir da
// planilha mestre do Ed (uma linha por dupla/quarteto, com colunas
// "Categoria", "Nome do quarteto" e pares repetidos de "Nome completo" +
// "Apelido", um par por atleta do time — a versão anterior só reconhecia
// cabeçalhos tipo "Atleta 1"/"Atleta 2", que não é o que a planilha real
// usa, então nunca importava nada dela).
// Devolve { records, headerFound }, onde cada record é
// { categoria, nomeTime, pessoas:[{nomeCompleto,apelido}, ...] } — pessoas
// vem na ordem das colunas (só as 2 primeiras importam pra dupla, até 6 pra
// quarteto).
function parsePlanilhaGeral(rows){
  if(!rows || !rows.length) return { records:[], headerFound:false };
  const headerRow = rows[0].map(normHeader);
  const headerFound = headerRow.some(h => /atleta|jogador|dupla|time|equipe|categoria|nome/.test(h));
  if(!headerFound){
    // Sem cabeçalho reconhecível não tem como achar a coluna Categoria, então
    // a importação em lote não funciona — só assume Atleta1/Atleta2 na ordem.
    const records = rows.map(r => ({
      categoria: '',
      nomeTime: '',
      pessoas: [0,1,2,3,4,5].map(j => ({ nomeCompleto:String(r[j]||'').trim(), apelido:'' })).filter(p=>p.nomeCompleto)
    })).filter(r => r.pessoas.length);
    return { records, headerFound:false };
  }
  let colCategoria=-1, colNomeTime=-1;
  headerRow.forEach((h,i) => {
    if(colCategoria<0 && /categoria/.test(h)) colCategoria=i;
    else if(colNomeTime<0 && /nome do (time|equipe|quarteto)|^equipe$|^time$|^dupla$/.test(h)) colNomeTime=i;
  });
  const nameSlots = [];
  let i = 0;
  while(i < headerRow.length){
    if(i === colCategoria || i === colNomeTime){ i++; continue; }
    const h = headerRow[i];
    if(/nome completo|^nome$|atleta|jogador/.test(h)){
      const apelidoCol = (headerRow[i+1] && /apelido/.test(headerRow[i+1])) ? i+1 : -1;
      nameSlots.push({ nomeCol:i, apelidoCol });
      i += apelidoCol>=0 ? 2 : 1;
      continue;
    }
    i++;
  }
  const records = rows.slice(1).map(r => {
    const categoria = colCategoria>=0 ? String(r[colCategoria]||'').trim() : '';
    const nomeTime = colNomeTime>=0 ? String(r[colNomeTime]||'').trim() : '';
    const pessoas = nameSlots.map(slot => ({
      nomeCompleto: String(r[slot.nomeCol]||'').trim(),
      apelido: slot.apelidoCol>=0 ? String(r[slot.apelidoCol]||'').trim() : ''
    })).filter(p => p.nomeCompleto || p.apelido);
    return { categoria, nomeTime, pessoas };
  }).filter(r => r.categoria || r.nomeTime || r.pessoas.length);
  return { records, headerFound:true };
}
// Nome de exibição de uma pessoa: prioriza o apelido (mais curto, é o que
// normalmente se usa em quadra) e cai pro nome completo se não tiver.
function personDisplayName(p){
  if(!p) return '';
  return (p.apelido && p.apelido.trim()) ? p.apelido.trim() : (p.nomeCompleto||'').trim();
}
// Monta a lista de "times" (no formato que a tela de categoria espera) a
// partir de um grupo de registros já filtrado pra uma única categoria. Se
// forceModalidade não for passado, detecta sozinho: quarteto se algum
// registro tiver nome de time preenchido ou mais de 2 pessoas na linha.
function buildTimesFromRows(rows, forceModalidade){
  const isMulti = forceModalidade ? usaListaAtletas(forceModalidade)
    : rows.some(r => (r.nomeTime && r.nomeTime.trim()) || r.pessoas.length > 2);
  const modalidadeOut = forceModalidade || (isMulti ? 'quarteto' : 'dupla');
  const slots = isMulti ? modalidadeAtletasSlots(modalidadeOut) : 0;
  const times = rows.map((r, idx) => {
    if(isMulti){
      const atletas = Array.from({length:slots}, (_,j) => r.pessoas[j] ? personDisplayName(r.pessoas[j]) : '');
      return { nome: (r.nomeTime && r.nomeTime.trim()) ? r.nomeTime.trim() : ('Time ' + (idx+1)), atletas };
    }
    return {
      atleta1: r.pessoas[0] ? personDisplayName(r.pessoas[0]) : '',
      atleta2: r.pessoas[1] ? personDisplayName(r.pessoas[1]) : ''
    };
  });
  return { modalidade: modalidadeOut, times };
}
// Agrupa os registros pela coluna Categoria (ignorando acento/maiúscula),
// preservando a primeira grafia encontrada como nome de exibição — é assim
// que a importação em lote descobre quantas categorias existem numa
// planilha só e separa os times de cada uma.
function groupRecordsByCategoria(records){
  const groups = [];
  const byKey = {};
  records.forEach(r => {
    if(!r.categoria) return;
    const key = normHeader(r.categoria);
    if(!byKey[key]){
      const g = { categoria: r.categoria, rows: [] };
      byKey[key] = g;
      groups.push(g);
    }
    byKey[key].rows.push(r);
  });
  return groups;
}
// Acha uma categoria JÁ CADASTRADA no evento (em qualquer dia) cujo nome da
// chave bate com o nome vindo da planilha — é assim que a importação em
// lote reconhece "essa categoria já existe, é só atualizar" em vez de criar
// duplicada. Pedido do Ed: comparar a planilha nova com o que já está
// cadastrado, sem mexer nas datas/horários já definidos.
function findExistingCategoriaByName(eventoId, nome){
  const key = normHeader(nome);
  if(!key) return null;
  return categoriasOfEvento(eventoId).find(x => normHeader(x.chave.nome) === key) || null;
}
// Normaliza um nome de pessoa pra comparação (ignora acento, maiúscula,
// espaço duplicado) — assim "João Silva" e "joao  silva" batem como o
// mesmo atleta mesmo com pequena diferença de digitação entre planilhas.
function normPersonName(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
// Chave de identidade de um time pra comparar a planilha nova com o que já
// está cadastrado: o conjunto (sem ordem) dos nomes dos atletas. Pedido do
// Ed: reconhecer o time pelo nome dos atletas, não pela posição na lista —
// então uma dupla que só mudou de linha continua sendo "a mesma dupla".
function teamMatchKey(modalidade, time){
  const slots = modalidadeAtletasSlots(modalidade);
  const names = slots
    ? Array.from({length:slots}, (_,i) => normPersonName((time.atletas||[])[i])).filter(Boolean)
    : [normPersonName(time.atleta1), normPersonName(time.atleta2)].filter(Boolean);
  if(names.length) return names.sort().join('+');
  // Trio/quarteto sem nenhum atleta preenchido (só nome do time) cai pro nome.
  return (slots && (time.nome||'').trim()) ? ('NOME:' + normPersonName(time.nome)) : '';
}
// Compara os times já cadastrados numa chave com os que vieram na planilha
// nova: "novos" (na planilha, não achei entre os cadastrados — entram no
// fim da lista) e "sumidos" (cadastrados, não achei mais na planilha — só
// aviso, nunca removo sozinho, porque pode já ter jogo com placar lançado
// em cima desse time — Ed pediu confirmação manual pra isso).
function diffTimes(existingTimes, newTimes, modalidade){
  const existingKeys = new Set(existingTimes.map(t => teamMatchKey(modalidade, t)).filter(Boolean));
  const newKeys = new Set(newTimes.map(t => teamMatchKey(modalidade, t)).filter(Boolean));
  const novos = newTimes.filter(t => { const k = teamMatchKey(modalidade, t); return !k || !existingKeys.has(k); });
  const sumidos = existingTimes.filter(t => { const k = teamMatchKey(modalidade, t); return !k || !newKeys.has(k); });
  return { novos, sumidos };
}
// Nome pra exibir na prévia da importação (lista de "novos"/"sumidos").
function timeDisplayName(modalidade, t){
  if(usaListaAtletas(modalidade)) return (t.nome||'').trim() || (t.atletas||[]).filter(Boolean).join(' / ') || 'Time sem nome';
  if((t.nome||'').trim()) return t.nome.trim();
  const a1 = (t.atleta1||'').trim(), a2 = (t.atleta2||'').trim();
  return (a1 && a2) ? (a1+' / '+a2) : (a1||a2||'Dupla sem nome');
}
function onImportPlanilhaSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', blankrows:false });
      importTeamsFromRows(rows);
    } catch(err){
      console.error('importPlanilha', err);
      toast('Não deu pra ler essa planilha — confira o formato (.xlsx ou .csv)');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
// Importação pra dentro de UMA categoria já aberta na tela de setup — se a
// planilha tiver coluna Categoria e o nome já digitado no campo "Nome da
// categoria" bater com algum valor dela, filtra só essas linhas; senão usa
// a planilha inteira. A modalidade fica a que já está selecionada na tela
// (dupla/quarteto), não é redetectada por linha.
function importTeamsFromRows(rows){
  if(!rows || !rows.length){ toast('Planilha vazia'); return; }
  const { records } = parsePlanilhaGeral(rows);
  if(!records.length){ toast('Não encontrei times nessa planilha'); return; }
  let filtered = records;
  const wanted = normHeader(setupState.nome || '');
  if(wanted){
    const byCategoria = records.filter(r => {
      const v = normHeader(r.categoria);
      return v && (v.includes(wanted) || wanted.includes(v));
    });
    if(byCategoria.length) filtered = byCategoria;
  }
  const { times } = buildTimesFromRows(filtered, setupState.modalidade);
  if(!times.length){ toast('Não encontrei times nessa planilha'); return; }
  setupState.times = times;
  renderSetup(setupState._editId || '');
  toast(times.length + ' times importados — confira a lista antes de salvar');
}

    const actionableCount = s.groups.filter(g => {

          const totalNovo = totalAtual + g.novos.length;

            </label>` : '';
          const disabledByReset = precisaConfirmarReset && !g.confirmReset;
          const tamanhoWarning = !tamanhoOk ? `<div class="hint" style="margin-top:6px; color:#a13a3a; font-weight:600;">⚠️ ${totalNovo} não bate com nenhum tamanho de chave pronto — não dá pra aplicar por aqui, ajuste manualmente em "Editar chave" depois.</div>` : '';
          return `<div class="card" style="padding:12px; margin-bottom:8px;">

            ${novosHtml}${sumidosHtml}${resetWarning}${tamanhoWarning}
            ${disabledByReset ? `<div class="hint" style="margin-top:6px; color:#a13a3a;">Marque a confirmação acima pra aplicar essa atualização.</div>` : ''}
          </div>`;
        }
        const sizeOk = SIZES.includes(g.times.length);
        // Corrigido 18/09: o checkbox não travava quando o total não batia
        // com nenhum tamanho de chave pronto, e o texto prometia "ajuste

            <span style="flex:none; font-weight:700; color:var(--primary-dark);">🆕</span>
            <input type="text" value="${escapeHtmlAttr(g.categoria)}" oninput="importListaState.groups[${i}].categoria=this.value" style="flex:1; margin:0;">
          </label>
          <div class="hint" style="margin-top:6px;">
            ${modalidadePluralCap(g.modalidade)} • ${g.times.length} time${g.times.length===1?'':'s'} • categoria nova
            ${sizeOk ? '' : ` • <span style="color:#a13a3a; font-weight:600;">⚠️ não bate com um tamanho de chave pronto (${SIZES[0]} a ${SIZES[SIZES.length-1]}) — ajuste o total de times na planilha e importe de novo</span>`}
          </div>

            <label style="font-size:12.5px; color:var(--muted2); font-weight:600; white-space:nowrap;">⏰ Início</label>
            <input type="time" value="${escapeHtmlAttr(g.horaInicio||'')}" oninput="importListaState.groups[${i}].horaInicio=this.value" style="margin:0; max-width:130px;">
          </div>
          <div class="hint" style="margin-top:6px;">Entra no dia ${escapeHtml(formatDiaLabel(dia))} — depois é só usar "Mover…" se quiser trocar de dia.</div>
        </div>`;
      }).join('')}
      <button class="btn" onclick="confirmarImportLista()">Aplicar ${actionableCount} mudança${actionableCount===1?'':'s'}</button>
      <button class="btn ghost small" style="margin-top:8px;" onclick="importListaState.groups=null; renderImportLista('${eventoId}','${dia}')">Tentar outra planilha</button>`;
  }

  app.innerHTML = `
    ${header('Importar lista completa', escapeHtml(ev.nome) + ' • ' + formatDiaLabel(dia), backHash)}

function triggerImportListaCompleta(){
